/* ============ LIVE TIMER PERSISTENCE ============ */
/* Session minutes only get logged to state.sessions when a Pomodoro sprint completes or
   the stopwatch is stopped — so a running timer's progress was invisible to localStorage
   the whole time it was ticking. If the tab reloaded, crashed, or was closed mid-session,
   that time was gone. This snapshots the running timer every tick (and on every explicit
   action) to a separate key, and replays real elapsed wall-clock time back in on load. */
const LIVE_TIMER_KEY = 'studiumLiveTimerState';
const LEGACY_LIVE_TIMER_KEYS = ['ledgerLiveTimerState'];
/* Fixes the "two tabs double-count study time" bug: opening a second tab while a timer
   runs in another used to make that second tab independently resume and eventually
   complete/log the SAME timer a second time. sessionStorage is scoped per browser tab
   and survives a reload of that same tab, but a genuinely different tab gets its own
   empty sessionStorage — exactly the distinction needed here, which a plain JS variable
   can't make (it resets on every reload regardless of which tab). Every write to the
   live timer state is tagged with whichever tab made it; only the tagged "owner" tab
   drives the countdown/stopwatch and logs sessions. Any other tab just mirrors the
   displayed value from that owner's writes via the 'storage' event, without running its
   own interval — so it can't independently reach zero and log a duplicate session. */
const TAB_ID = (function(){
  try{
    let id = sessionStorage.getItem('studiumTabId');
    if(!id){ id = uid(); sessionStorage.setItem('studiumTabId', id); }
    return id;
  }catch(e){ return uid(); }
})();
const TIMER_OWNER_STALE_MS = 10000; // if the owning tab hasn't written in this long, treat it as gone (closed/crashed) and take over
let isMirroringTimer = false;
function saveLiveTimerState(){
  try{
    localStorage.setItem(LIVE_TIMER_KEY, JSON.stringify({
      pomo: { mode:pomo.mode, remaining:pomo.remaining, running:pomo.running, subjectId:pomo.subjectId, sessionsDone:pomo.sessionsDone, segmentDate:pomo.segmentDate },
      sw: { elapsed:sw.elapsed, running:sw.running, subjectId:sw.subjectId, segmentDate:sw.segmentDate },
      savedAt: Date.now(),
      owner: TAB_ID
    }));
  }catch(e){}
}
function clearLiveTimerState(){ try{ localStorage.removeItem(LIVE_TIMER_KEY); }catch(e){} }
function restoreLiveTimerState(){
  let data;
  try{
    let raw = localStorage.getItem(LIVE_TIMER_KEY);
    if(!raw){
      for(const legacyKey of LEGACY_LIVE_TIMER_KEYS){
        const legacyRaw = localStorage.getItem(legacyKey);
        if(legacyRaw){ raw = legacyRaw; break; }
      }
    }
    if(!raw) return;
    data = JSON.parse(raw);
  }catch(e){ return; }
  const now = Date.now();
  const ownedByOtherFreshTab = data.owner && data.owner !== TAB_ID && (now - (data.savedAt||0)) < TIMER_OWNER_STALE_MS;
  if(data.pomo){
    pomo.mode = data.pomo.mode || 'work';
    pomo.subjectId = data.pomo.subjectId || '';
    pomo.sessionsDone = data.pomo.sessionsDone || 0;
    pomo.segmentDate = data.pomo.segmentDate || todayStr(new Date(data.savedAt||Date.now()));
    if(data.pomo.running && ownedByOtherFreshTab){
      // Another tab is actively driving this — just mirror the displayed value, don't
      // start our own interval or we'd independently complete/log it a second time.
      const elapsedSec = Math.floor((now - data.savedAt)/1000);
      pomo.remaining = Math.max(0, data.pomo.remaining - elapsedSec);
      pomo.running = true;
      isMirroringTimer = true;
    } else if(data.pomo.running){
      const elapsedSec = Math.floor((now - data.savedAt)/1000);
      const GRACE_SEC = 120; // generous allowance for a normal refresh/restart gap
      if(elapsedSec > data.pomo.remaining + GRACE_SEC){
        // The gap is far bigger than the timer itself could explain — the browser was
        // actually closed for a while, not just refreshed. Don't fabricate a finished
        // session for time you weren't there for; bank only what was genuinely studied
        // before it closed — dated to whichever day it was actually earned on, which
        // may not be today if the tab closed before midnight and reopened after it.
        if(pomo.mode==='work'){
          const studiedMin = (pomoDuration('work') - data.pomo.remaining) / 60;
          if(studiedMin >= 1) logSessionOnDate(pomo.subjectId, studiedMin, 'pomodoro-partial', pomo.segmentDate);
        }
        pomo.remaining = pomoDuration(pomo.mode);
        pomo.running = false;
        pomo.segmentDate = todayStr();
      } else {
        pomo.remaining = data.pomo.remaining - elapsedSec;
        if(pomo.remaining <= 0){
          // Finished naturally while briefly away — settle it as a completed sprint.
          pomo.remaining = 0; pomo.running = false;
          completePomoCycle(false);
        } else {
          pomo.running = true;
          startPomoInterval();
          ensureKeepAliveAudio();
        }
      }
    } else {
      pomo.remaining = data.pomo.remaining;
      pomo.running = false;
    }
  }
  if(data.sw){
    sw.subjectId = data.sw.subjectId || '';
    sw.segmentDate = data.sw.segmentDate || todayStr(new Date(data.savedAt||Date.now()));
    if(data.sw.running && ownedByOtherFreshTab){
      sw.elapsed = data.sw.elapsed + (now - data.savedAt);
      sw.running = true;
      isMirroringTimer = true;
    } else if(data.sw.running){
      // The stopwatch is open-ended (unlike Pomodoro's bounded sprint length), so a long
      // gap here does NOT reliably mean "the browser was actually closed" — it's just as
      // likely to mean the phone screen locked or the tab was backgrounded for a while,
      // both completely normal during a real study session, and mobile browsers routinely
      // discard/reload a backgrounded tab's JS in the process. Treating a gap as "closed"
      // here previously reset people's running stopwatch to zero mid-session, silently.
      // Always just extend elapsed by the full gap instead.
      sw.elapsed = data.sw.elapsed + (now - data.savedAt);
      sw.running = true;
      sw.startedAt = now - sw.elapsed;
      startSwInterval();
      ensureKeepAliveAudio();
    } else {
      sw.elapsed = data.sw.elapsed;
      sw.running = false;
    }
  }
  updatePomoUI();
  updateSwUI();
}
/* Whenever any tab writes a live-timer update, every OTHER tab gets a 'storage' event
   (the tab that made the write does not). If the write belongs to a different, fresher
   owner than what we think is running locally, stop our own interval immediately and
   switch to mirroring — this is what makes ownership hand off cleanly the moment someone
   starts/stops/finishes a timer in whichever tab they're actually looking at. */
window.addEventListener('storage', (e)=>{
  if(e.key !== LIVE_TIMER_KEY || !e.newValue) return;
  let data;
  try{ data = JSON.parse(e.newValue); }catch(err){ return; }
  if(!data.owner || data.owner === TAB_ID) return; // our own write, or nothing to reconcile
  const now = Date.now();
  if(data.pomo){
    if(pomo.running && !data.pomo.running){ stopPomoInterval(); }
    if(data.pomo.running){
      const elapsedSec = Math.floor((now - data.savedAt)/1000);
      pomo.remaining = Math.max(0, data.pomo.remaining - elapsedSec);
      pomo.running = true;
      if(pomo.timerId){ stopPomoInterval(); } // relinquish — the other tab now owns it
      isMirroringTimer = true;
    } else {
      stopPomoInterval();
      pomo.remaining = data.pomo.remaining;
      pomo.running = false;
      isMirroringTimer = false;
    }
    pomo.mode = data.pomo.mode || pomo.mode;
  }
  if(data.sw){
    if(sw.timerId && !data.sw.running){ clearInterval(sw.timerId); sw.timerId=null; }
    if(data.sw.running){
      sw.elapsed = data.sw.elapsed + (now - data.savedAt);
      sw.running = true;
      if(sw.timerId){ clearInterval(sw.timerId); sw.timerId=null; } // relinquish
      isMirroringTimer = true;
    } else {
      if(sw.timerId){ clearInterval(sw.timerId); sw.timerId=null; }
      sw.elapsed = data.sw.elapsed;
      sw.running = false;
      isMirroringTimer = false;
    }
  }
  updatePomoUI(false);
  updateSwUI(false);
});

/* ============ FLOATING TIMER (Picture-in-Picture) ============ */
/* This is the piece that actually survives minimizing the whole browser window — the tab
   title and favicon badge only help while some part of the browser is visible on screen.
   PiP renders the countdown onto a canvas, streams that canvas into a hidden video, and
   asks the browser to float that video above every other window, including a minimized one. */
let pipCanvas = null, pipCtx = null, pipVideo = null, pipActive = false;
function pipSupported(){ return typeof document.pictureInPictureEnabled === 'boolean' && document.pictureInPictureEnabled; }
function ensurePipAssets(){
  if(pipCanvas) return;
  pipCanvas = document.createElement('canvas');
  pipCanvas.width = 170; pipCanvas.height = 60;
  pipCtx = pipCanvas.getContext('2d');
  pipVideo = document.createElement('video');
  pipVideo.muted = true; pipVideo.playsInline = true;
  pipVideo.setAttribute('playsinline', ''); pipVideo.setAttribute('muted', '');
  pipVideo.width = 170; pipVideo.height = 60;
  // Kept off-screen but NOT display:none — a display:none video won't reliably decode
  // frames or accept requestPictureInPicture() in most browsers.
  pipVideo.style.position = 'fixed';
  pipVideo.style.left = '-9999px';
  pipVideo.style.top = '0';
  pipVideo.style.width = '170px';
  pipVideo.style.height = '60px';
  pipVideo.style.opacity = '0';
  pipVideo.style.pointerEvents = 'none';
  pipVideo.srcObject = pipCanvas.captureStream(2); // 2fps is plenty for a digit clock
  document.body.appendChild(pipVideo);
  pipVideo.addEventListener('leavepictureinpicture', ()=>{ pipActive = false; updatePipButtons(); });
}
function pipDrawData(){
  if(pomo.running){
    const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
    const s = (pomo.remaining%60).toString().padStart(2,'0');
    const label = pomo.mode==='work' ? 'Focus Sprint' : pomo.mode==='longBreak' ? 'Long Break' : 'Short Break';
    return { big:`${m}:${s}`, label, color: pomo.mode==='work' ? '#4BCBA8' : '#F0B35C' };
  }
  if(sw.running){
    const totalSec = Math.floor(sw.elapsed/1000);
    const h = Math.floor(totalSec/3600).toString().padStart(2,'0');
    const m = Math.floor((totalSec%3600)/60).toString().padStart(2,'0');
    const s = (totalSec%60).toString().padStart(2,'0');
    return { big: h!=='00' ? `${h}:${m}:${s}` : `${m}:${s}`, label:'Stopwatch', color:'#7C8CF0' };
  }
  return null;
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawPipFrame(){
  if(!pipCtx) return;
  const d = pipDrawData();
  const w = pipCanvas.width, h = pipCanvas.height;
  pipCtx.clearRect(0,0,w,h);
  roundRectPath(pipCtx, 2, 2, w-4, h-4, (h-4)/2);
  pipCtx.fillStyle = '#12160F';
  pipCtx.fill();
  pipCtx.beginPath();
  pipCtx.arc(22, h/2, 7, 0, Math.PI*2);
  pipCtx.fillStyle = (d && d.color) || '#4BCBA8';
  pipCtx.fill();
  pipCtx.fillStyle = '#fff';
  pipCtx.font = '700 24px "IBM Plex Mono", monospace';
  pipCtx.textAlign = 'left'; pipCtx.textBaseline = 'middle';
  pipCtx.fillText(d ? d.big : '—:—', 38, h/2 + 1);
}
async function togglePip(){
  if(!pipSupported()){
    toast('Picture-in-Picture isn\'t supported in this browser.');
    return;
  }
  if(document.pictureInPictureElement){
    try{ await document.exitPictureInPicture(); }catch(e){}
    return;
  }
  ensurePipAssets();
  drawPipFrame();
  try{
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
    pipActive = true;
    updatePipButtons();
  }catch(e){
    toast('Floating timer blocked: ' + (e.name || 'error') + (e.message ? ' — ' + e.message : ''));
  }
}
function updatePipButtons(){
  ['pomoPipBtn','swPipBtn'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.innerHTML = pipActive
      ? `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Close Floating Timer`
      : `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Pop-out Timer`;
  });
}

  });
  document.getElementById('pomoSkip').addEventListener('click', ()=>completePomoCycle(true));
  const pomoPipBtn = document.getElementById('pomoPipBtn');
  if(pomoPipBtn) pomoPipBtn.addEventListener('click', togglePip);
  document.getElementById('saveLens').addEventListener('click', ()=>{
    state.settings.workMin = Math.max(1, parseInt(document.getElementById('wLen').value)||25);
    state.settings.breakMin = Math.max(1, parseInt(document.getElementById('bLen').value)||5);
    state.settings.longBreakMin = Math.max(1, parseInt(document.getElementById('lbLen').value)||15);
    state.settings.sessionsBeforeLong = Math.max(1, parseInt(document.getElementById('sbl').value)||4);
    save();
    if(!pomo.running){ pomo.remaining = pomoDuration(pomo.mode); }
    updatePomoUI();
    toast('Session lengths saved');
  });
  if(pomo.remaining === undefined) pomo.remaining = pomoDuration('work');
  updatePomoUI();
  updatePipButtons();
}
function syncPomoRemaining(){
  if(pomo.running && pomo.targetEndAt){
    pomo.remaining = Math.max(0, Math.round((pomo.targetEndAt - Date.now())/1000));
  }
}
function startPomoInterval(){
  stopPomoInterval();
  pomo.targetEndAt = Date.now() + pomo.remaining*1000;
  pomo.timerId = setInterval(()=>{
    const curDay = todayStr();
    if(pomo.mode==='work' && curDay !== pomo.segmentDate){
      const elapsedMin = (pomoDuration('work') - pomo.remaining) / 60;
      if(elapsedMin >= 1) logSessionOnDate(pomo.subjectId, elapsedMin, 'pomodoro-partial', pomo.segmentDate);
      pomo.remaining = pomoDuration('work');
      pomo.segmentDate = curDay;
      pomo.targetEndAt = Date.now() + pomo.remaining*1000;
      toast("New day — yesterday's progress was saved, and your sprint restarted fresh.");
    }
    syncPomoRemaining();
    if(pomo.remaining <= 0){ completePomoCycle(false); return; }
    updatePomoUI();
  },1000);
}
function togglePomo(){
  pomo.running = !pomo.running;
  if(pomo.running){
    sfxStart();
    playMusicIfEnabled();
    ensureKeepAliveAudio();
    startPomoInterval();
  } else {
    syncPomoRemaining(); // lock in the true value at the exact instant of pausing
    stopPomoInterval();
    pauseMusic();
    stopKeepAliveAudioIfIdle();
  }
  updatePomoUI();
}
function stopPomoInterval(){ clearInterval(pomo.timerId); pomo.timerId=null; }
function completePomoCycle(skipped){
  stopPomoInterval();
  const wasWork = pomo.mode==='work';
  if(wasWork && !skipped){
    logSession(pomo.subjectId, state.settings.workMin, 'pomodoro');
    pomo.sessionsDone++;
    sfxWorkComplete();
    notifyUser('Focus sprint complete', 'Nice work — time for a break.');
  } else if(wasWork && skipped){
    pomo.sessionsDone++;
  }
  if(wasWork){
    pomo.mode = (pomo.sessionsDone % state.settings.sessionsBeforeLong === 0) ? 'longBreak' : 'break';
    if(!skipped) setTimeout(sfxBreakStart, 500);
  } else {
    pomo.mode = 'work';
    if(!skipped){ sfxBreakEnd(); notifyUser('Break over', 'Ready for another focus sprint?'); }
  }
  pomo.remaining = pomoDuration(pomo.mode);
  pomo.running = false;
  pomo.targetEndAt = null;
  pomo.segmentDate = todayStr();
  pauseMusic();
  stopKeepAliveAudioIfIdle();
  updatePomoUI();
  if(currentPage==='pomodoro'){
    document.getElementById('pomoDoneCount').textContent = state.sessions.filter(s=>s.date===todayStr() && s.type==='pomodoro').length;
  }
}
function updatePomoUI(persist=true){
  updateStickyProgressLive();
  updatePageChrome();
  if(persist) saveLiveTimerState();
  if(currentPage!=='pomodoro') return;
  const t = document.getElementById('pomoTime'); if(!t) return;
  const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
  const s = (pomo.remaining%60).toString().padStart(2,'0');
  t.textContent = `${m}:${s}`;
  document.getElementById('pomoMode').textContent = pomo.mode==='work' ? 'Focus' : pomo.mode==='break' ? 'Short Break' : 'Long Break';
  document.getElementById('pomoStart').textContent = pomo.running ? 'Pause' : 'Start';
  const ring = document.getElementById('pomoRing');
  const total = pomoDuration(pomo.mode);
  const circumference = 553;
  const frac = 1 - (pomo.remaining/total);
  ring.setAttribute('stroke-dashoffset', (circumference*(1-frac)).toFixed(1));
  ring.setAttribute('stroke', pomo.mode==='work' ? 'var(--accent)' : 'var(--accent-2)');
}

/* Shared chapter management panel — used by both the Subject Tracker card (collapsible)
   and the always-open Chapter Progress card, so add/check/delete/link behave identically
   in either place. */
function chapterManagePanelHtml(subject){
  const rows = subject.chapters.length ? subject.chapters.map(c=>{
    const nameEl = c.link
      ? `<a href="${escapeHtml(c.link)}" target="_blank" rel="noopener" class="${c.done?'done':''}" title="Open link">${escapeHtml(c.name)}</a>`
      : `<span class="${c.done?'done':''}">${escapeHtml(c.name)}</span>`;
    return `<div class="chapter-row">
      <input type="checkbox" data-ch="${c.id}" ${c.done?'checked':''}>
      ${nameEl}
      <button class="icon-btn" data-link-ch="${c.id}" title="${c.link?'Edit link':'Add link'}" style="color:${c.link?'var(--accent)':'inherit'};">${ICONS.link}</button>
      <button class="icon-btn" data-del-ch="${c.id}" title="Remove chapter">${ICONS.trash}</button>
    </div>`;
  }).join('') : '<p style="font-size:12px; color:var(--text-muted); padding:6px 0;">No chapters yet.</p>';
  return `<div id="chapterPanel-${subject.id}">
    ${rows}
    <div class="row" style="margin-top:10px;">
      <input type="text" placeholder="New chapter name" data-new-ch-input style="flex:1;">
      <button class="btn btn-sm" data-add-ch>Add</button>
    </div>
  </div>`;
}
function wireChapterPanel(subject, panelEl){
  panelEl.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const ch = subject.chapters.find(c=>c.id===cb.dataset.ch);
      if(ch){ ch.done = cb.checked; save(); checkAchievements(); if(cb.checked) notifyTaskDone(ch.name); }
      renderMain();
    });
  });
  panelEl.querySelectorAll('[data-del-ch]').forEach(b=>{
    b.addEventListener('click', ()=>{
      subject.chapters = subject.chapters.filter(c=>c.id!==b.dataset.delCh);
      save(); renderMain();
    });
  });
  panelEl.querySelectorAll('[data-link-ch]').forEach(b=>{
    b.addEventListener('click', ()=> openChapterLinkModal(subject.id, b.dataset.linkCh));
  });
  const addBtn = panelEl.querySelector('[data-add-ch]');
  if(addBtn){
    const doAdd = ()=>{
      const input = panelEl.querySelector('[data-new-ch-input]');
      const name = input.value.trim();
      if(!name) return;
      subject.chapters.push({id:uid(), name, done:false, link:''});
      save(); renderMain(); checkAchievements();
    };
    addBtn.addEventListener('click', doAdd);
    const input = panelEl.querySelector('[data-new-ch-input]');
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  }
}

/* ============ HEATMAP ============ */
/* Calendar-style heatmap — weekday rows fixed (Sun top → Sat bottom) so day-of-week
   patterns are visible at a glance, plus month labels along the top. */
function buildHeatmapGrid(days){
  const today = new Date();
  const start = new Date(today); start.setDate(today.getDate() - (days-1));
  const startDow = start.getDay(); // 0=Sun .. 6=Sat
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null); // leading blanks so rows align to weekday
  for(let i=0;i<days;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    cells.push({date:d, ds:todayStr(d), mins:minutesOnDate(todayStr(d))});
  }
  while(cells.length % 7 !== 0) cells.push(null); // trailing blanks to complete last week
  const totalCols = cells.length / 7;
  let max = 1;
  cells.forEach(c=>{ if(c) max = Math.max(max, c.mins); });

  const wrap = document.createElement('div');
  wrap.className = 'heatmap-wrap';

  const monthsRow = document.createElement('div');
  monthsRow.className = 'heatmap-months';
  monthsRow.style.gridTemplateColumns = `repeat(${totalCols}, 12px)`;
  let lastMonth = -1;
  for(let col=0; col<totalCols; col++){
    let label = '';
    for(let row=0; row<7; row++){
      const c = cells[col*7+row];
      if(c && c.date.getDate() <= 7 && c.date.getMonth() !== lastMonth){
        label = c.date.toLocaleString('en-US', {month:'short'});
        lastMonth = c.date.getMonth();
        break;
      }
    }
    const span = document.createElement('span');
    span.textContent = label;
    monthsRow.appendChild(span);
  }

  const dayLabels = document.createElement('div');
  dayLabels.className = 'heatmap-daylabels';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>{ const s = document.createElement('span'); s.textContent = n; dayLabels.appendChild(s); });

  const grid = document.createElement('div');
  grid.className = 'heatmap';
  cells.forEach(c=>{
    const cell = document.createElement('div');
    if(!c){ cell.className = 'heat-cell heat-cell-empty'; grid.appendChild(cell); return; }
    cell.className = 'heat-cell';
    const dayName = c.date.toLocaleString('en-US', {weekday:'short'});
    const dateLabel = c.date.toLocaleString('en-US', {month:'short', day:'numeric'});
    cell.title = `${dayName}, ${dateLabel}: ${fmtMin(c.mins)}`;
    let level = 0;
    if(c.mins>0) level = 1;
    if(c.mins >= max*0.33) level = 2;
    if(c.mins >= max*0.66) level = 3;
    if(c.mins >= max*0.9) level = 4;
    const opacities = [0, 0.28, 0.52, 0.75, 1];
    cell.style.background = level===0 ? 'var(--bg-alt)' : `color-mix(in srgb, var(--accent) ${opacities[level]*100}%, var(--bg-alt))`;
    grid.appendChild(cell);
  });

  const body = document.createElement('div');
  body.className = 'heatmap-body';
  body.appendChild(dayLabels);
  body.appendChild(grid);

  wrap.appendChild(monthsRow);
  wrap.appendChild(body);
  return wrap;
}

  main.innerHTML = `<div class="page-header"><div><h1>Heatmap</h1><p>Your study consistency over the last 26 weeks.</p></div></div>
  <div class="card">

/* ============ NOTES ============ */
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = (header.match(/data:(.*?);base64/)||[])[1] || 'application/octet-stream';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}
function openAttachment(att){
  try{
    const blob = dataUrlToBlob(att.dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank', 'noopener');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('Could not open this file.'); }
}
function downloadAttachment(att){
  try{
    const blob = dataUrlToBlob(att.dataUrl);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = att.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }catch(e){ toast('Could not download this file.'); }
}
/* Smart attachment viewer: images get a fit/zoom lightbox, PDFs render inline via the
   browser's native PDF viewer (full scroll/zoom/search/print for free) with prev/next
   through a note's other attachments and a fallback if inline preview isn't supported. */
let viewerState = {list:[], index:0, zoomed:false, onClose:null};
function openAttachmentViewer(list, index, onClose){
  viewerState = {list, index, zoomed:false, onClose: onClose || null};
  renderAttachmentViewer();
}
function closeAttachmentViewer(){
  if(viewerState.onClose) viewerState.onClose();
  else closeModal();
}
function renderAttachmentViewer(){
  const {list, index, zoomed} = viewerState;
  const att = list[index];
  const isImg = att.type.startsWith('image/');

  const multi = list.length > 1;

    <div class="row" style="justify-content:space-between; margin-bottom:14px; padding-right:26px;">

    </div>

      <div style="flex:1;"></div>

  const body = document.getElementById('viewerBody');

    body.innerHTML = `<div style="max-height:62vh; overflow:auto; text-align:center; background:var(--bg-alt); border-radius:8px; padding:10px;">
      <img src="${att.dataUrl}" id="viewerImg" style="${zoomed? 'max-width:none; cursor:zoom-out;' : 'max-width:100%; max-height:58vh; cursor:zoom-in;'} border-radius:6px;">
    </div>`;
    document.getElementById('viewerImg').addEventListener('click', ()=>{ viewerState.zoomed = !viewerState.zoomed; renderAttachmentViewer(); });
  } else if(isPdf){
    body.innerHTML = `<object data="${att.dataUrl}" type="application/pdf" class="pdf-frame">
        <div style="height:64vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:var(--bg-alt); border-radius:8px; text-align:center; padding:24px;">
          <span class="nav-icon" style="width:34px; height:34px; color:var(--text-muted);">${ICONS.file}</span>
          <p style="font-size:13px; color:var(--text-muted); max-width:300px;">This view can't render a PDF preview here. Use Open in New Tab or Download below — your browser will handle it from there.</p>
        </div>
      </object>
      <p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Scroll, zoom, and search using your browser's built-in PDF controls once it loads. If the box above stays blank, use "Open in New Tab" instead.</p>`;
  } else {
    body.innerHTML = `<div class="empty"><h3>No preview available</h3><p>Use Download or Open in New Tab.</p></div>`;
  }
  document.getElementById('closeM').addEventListener('click', closeAttachmentViewer);
  if(multi){
    const prevBtn = document.getElementById('prevAtt'), nextBtn = document.getElementById('nextAtt');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(viewerState.index>0){ viewerState.index--; viewerState.zoomed=false; renderAttachmentViewer(); } });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(viewerState.index<list.length-1){ viewerState.index++; viewerState.zoomed=false; renderAttachmentViewer(); } });
  }
  const zoomBtn = document.getElementById('zoomBtn');
  if(zoomBtn) zoomBtn.addEventListener('click', ()=>{ viewerState.zoomed = !viewerState.zoomed; renderAttachmentViewer(); });
  document.getElementById('openNewTab').addEventListener('click', ()=> openAttachment(att));
  document.getElementById('downloadAtt').addEventListener('click', ()=> downloadAttachment(att));
}

function openNoteEditor(id){

  const isNew = !id;
  // Draft mirrors the form fields live, so previewing an attachment and coming back

        ${!isNew? '<button class="btn btn-danger" id="delM" style="margin-right:auto;">Delete</button>':''}

      </div>
    `);
    document.getElementById('nTitle').addEventListener('input', e=> draft.title = e.target.value);
    document.getElementById('nSubject').addEventListener('change', e=> draft.subjectId = e.target.value);
    document.getElementById('nBody').addEventListener('input', e=> draft.body = e.target.value);
    function refreshAttachList(){
      document.getElementById('attachListWrap').innerHTML = attachListHtml(draft.attachments);
      wireAttachList();
    }
    function wireAttachList(){
      document.querySelectorAll('[data-view]').forEach(el=> el.addEventListener('click', ()=>{
        const i = draft.attachments.findIndex(a=>a.id===el.dataset.view);

        if(!isImg && !isPdf){ toast(file.name + ' isn\'t a supported type (images or PDF only)'); return; }
        if(file.size > MAX_ATTACH_BYTES){ toast(file.name + ' is too large (max 4MB)'); return; }
        const reader = new FileReader();
        reader.onload = ()=>{
          draft.attachments.push({id:uid(), name:file.name, type:file.type, dataUrl:reader.result});
          refreshAttachList();
        };
        reader.onerror = ()=>{ toast('Could not read ' + file.name); };
        reader.readAsDataURL(file);
      });
    });
    document.getElementById('closeM').addEventListener('click', closeModal);
    document.getElementById('cancelM').addEventListener('click', closeModal);
    if(!isNew) document.getElementById('delM').addEventListener('click', ()=>{
      confirmAction('Delete this note? This cannot be undone.', ()=>{
        state.notes = state.notes.filter(x=>x.id!==n.id); save(); renderMain();
      });
    });
    document.getElementById('saveM').addEventListener('click', ()=>{

      if(isNew) state.notes.push(n);

        return; // leave modal open so they can remove an attachment and retry
      }
      closeModal(); renderMain(); checkAchievements();
    });
  }
  renderEditorModal();
}

/* ============ ANALYTICS ============ */
function last7DaysTotals(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const ds = todayStr(d);
    const label = i===0 ? 'Today' : i===1 ? 'Yest' : d.toLocaleDateString(undefined,{weekday:'short'});
    days.push({ date:ds, mins: minutesOnDate(ds), label });
  }
  return days;
}
function subjectBreakdownForDate(dateStr){
  const bySubj = {};
  state.sessions.filter(s=>s.date===dateStr).forEach(s=>{
    const key = s.subjectId || 'unassigned';
    bySubj[key] = (bySubj[key]||0) + s.minutes;
  });
  return Object.entries(bySubj).map(([subjId,mins])=>{
    const subj = subjId==='unassigned' ? null : subjectById(subjId);
    return { name: subj ? subj.name : 'Unassigned', color: subj ? subj.color : '#8A9086', mins };
  }).sort((a,b)=> b.mins-a.mins);
}
function weeklyTrendChartHtml(days){
  const width = 640, height = 190, padTop = 16, padBottom = 30, padX = 8;
  const max = Math.max(1, ...days.map(d=>d.mins));
  const stepX = (width - padX*2) / (days.length-1);
  const yFor = (mins)=> height - padBottom - (mins/max)*(height-padTop-padBottom);
  const points = days.map((d,i)=> ({ x: padX + i*stepX, y: yFor(d.mins) }));
  const pathD = points.map((p,i)=> (i===0?'M':'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)} ${height-padBottom} L${points[0].x.toFixed(1)} ${height-padBottom} Z`;
  const gridLines = [0,0.33,0.66,1].map(f=>{
    const y = height - padBottom - f*(height-padTop-padBottom);
    return `<line x1="${padX}" y1="${y.toFixed(1)}" x2="${width-padX}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>`;
  }).join('');
  const dots = points.map((p,i)=> `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="var(--accent)" stroke="var(--card-bg)" stroke-width="2"><title>${escapeHtml(days[i].label)}: ${fmtMin(days[i].mins)}</title></circle>`).join('');
  const labels = points.map((p,i)=> `<text x="${p.x.toFixed(1)}" y="${height-8}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${escapeHtml(days[i].label)}</text>`).join('');
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:auto; display:block; overflow:visible;">
    <defs><linearGradient id="weeklyTrendFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${areaD}" fill="url(#weeklyTrendFill)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

          </div>
        </div>`).join('')
        : `<p style="font-size:13px; color:var(--text-muted);">No sessions logged yesterday.</p>`}
    </div>
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:12px;">This Week, Day by Day</h3>

          <span style="color:${d.label==='Today'?'var(--text)':'var(--text-muted)'};">${escapeHtml(d.label)}</span>
          <span class="mono" style="color:${d.mins>0?'var(--text)':'var(--text-muted)'};">${d.mins>0 ? fmtMin(d.mins) : '—'}</span>
        </div>`).join('')}
      </div>
    </div>
  </div>
  <div class="card">
    <h3 style="font-size:16px; margin-bottom:16px;">Time by Subject</h3>
    <div id="donutWrap"></div>
  </div>`;
  const wrap = document.getElementById('donutWrap');
  const data = state.subjects.map(s=>({name:s.name, color:s.color, mins:totalMinutesForSubject(s.id)})).filter(d=>d.mins>0);
  const unassigned = state.sessions.filter(s=>!s.subjectId || !subjectById(s.subjectId)).reduce((a,s)=>a+s.minutes,0);
  if(unassigned>0) data.push({name:'Unassigned', color:'#8A9086', mins:unassigned});
  if(data.length===0){
    wrap.innerHTML = `<div class="empty"><h3>No data yet</h3><p>Log a Pomodoro or stopwatch session to see the breakdown.</p></div>`;
    return;
  }
  const total = data.reduce((a,d)=>a+d.mins,0);
  let acc = 0;
  const stops = data.map(d=>{
    const start = acc/total*360; acc += d.mins; const end = acc/total*360;
    return `${d.color} ${start}deg ${end}deg`;
  }).join(', ');
  wrap.innerHTML = `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops});"></div>
    <div class="legend">${data.map(d=>`<div class="legend-item"><span class="swatch" style="background:${d.color}"></span>${escapeHtml(d.name)}<span class="pct">${Math.round(d.mins/total*100)}%</span></div>`).join('')}</div>
  </div>`;
}
/* ============ LEADERBOARD & CHALLENGES (Supabase-backed) ============ */
/* Everyone who opens this deployed app shares the same Supabase project, so the roster
   and challenges are real and automatic — no manual entry. Only your name, photo, and
   today's total minutes are ever sent; nothing about your notes, subjects, or sessions
   leaves the device. A small in-memory cache lets the dashboard show a rank instantly
   without every render needing to await a network call — it's refreshed in the
   background and the page re-renders itself once fresh data lands. */
let sbClient = null;
function normalizeSupabaseUrl(url){
  return (url||'').trim().replace(/\/rest\/v1\/?$/i,'').replace(/\/+$/,'');
}
function getSbClient(){
  const cfg = state.settings.leaderboardSync;
  const url = normalizeSupabaseUrl(cfg.supabaseUrl);
  if(!url || !cfg.supabaseKey || typeof supabase === 'undefined') return null;
  if(!sbClient || sbClient.__url!==url || sbClient.__key!==cfg.supabaseKey){
    try{ sbClient = supabase.createClient(url, cfg.supabaseKey); sbClient.__url=url; sbClient.__key=cfg.supabaseKey; }
    catch(e){ sbClient = null; }
  }
  return sbClient;
}
/* Set to false once the avatar-egress issue is confirmed resolved and it's safe to resume
   automatic syncing. While true, every network call to Supabase (roster/avatar/minutes
   fetches, polling, pushes) is skipped — leaderboardSyncReady() is the single gate every
   one of those call sites already checks before firing, so flipping this one flag is
   enough to fully pause the feature without touching each call site individually. */
const LEADERBOARD_PAUSED = false;
function leaderboardConfigured(){
  const cfg = state.settings.leaderboardSync;
  return !!(normalizeSupabaseUrl(cfg.supabaseUrl) && cfg.supabaseKey && state.profile.name && getSbClient());
}
function leaderboardSyncReady(){
  return !LEADERBOARD_PAUSED && leaderboardConfigured();
}

/* One-way broadcast: only whoever has the admin code can post, everyone else just
   receives it as a notification the next time they open the app. Reuses the same
   Supabase project as the leaderboard — needs one extra table (see Settings → Admin
   for the exact SQL). Change ADMIN_CODE to something private before you publish. */
const ADMIN_CODE = 'studium-admin-2026';
let isAdminUnlocked = false;
async function fetchLatestAnnouncement(){
  const client = getSbClient();
  if(!client) return { row:null, error:'Leaderboard sync isn\'t connected.' };
  try{
    const { data, error } = await client.from('announcements').select('*').order('created_at', { ascending:false }).limit(1);
    if(error) return { row:null, error:error.message };
    return { row: (data && data[0]) || null, error:null };
  }catch(e){ return { row:null, error: e.message || 'Network error' }; }
}
async function checkForNewAnnouncement(){
  if(!leaderboardSyncReady()) return;
  const { row } = await fetchLatestAnnouncement();
  if(!row || state.settings.lastSeenAnnouncementId === row.id) return;
  state.settings.lastSeenAnnouncementId = row.id;
  save();
  sfxAchievement();
  toast('📣 ' + row.message);
  if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Studium update', { body: row.message, tag:'studium-announcement' }); }catch(e){}
  }
  pushNotification('announcement', 'Studium update', row.message);
}
async function postAnnouncement(message){

  try{
    const { error } = await client.from('announcements').insert({ message, created_by: state.profile.name });

/* Avatars are stored as base64 data URLs (up to ~2.7MB each after a 2MB upload) — fine
   for a one-time load, but ruinous if re-downloaded on every roster refresh. The roster
   is re-fetched constantly (every dashboard visit, every leaderboard visit, and every
   LB_POLL_INTERVAL_MS while sitting on the leaderboard page), so avatars are fetched
   separately and cached per browser session: each player's photo is downloaded once,
   then reused from memory for every subsequent refresh/poll instead of being re-pulled. */
let avatarCache = {};
async function fetchMissingAvatars(names){
  const missing = [...new Set(names)].filter(n=> !(n in avatarCache));
  if(!missing.length) return false;
  const client = getSbClient();
  if(!client) return false;
  try{
    const { data, error } = await client.from('players').select('name,avatar_data_url').in('name', missing);
    if(error) return false;
    missing.forEach(n=> avatarCache[n] = null); // mark as resolved even if a name had no row/photo, so we don't re-ask every poll
    (data||[]).forEach(p=> avatarCache[p.name] = p.avatar_data_url || null);
    return true;
  }catch(e){ return false; }
}
/* ============ LEADERBOARD ACCESS GATE ============
   Frontend-only, matching the existing admin system's trust model (no backend, no
   Edge Function — just this shared Supabase project, same as everything else here).
   Flow: someone requests access with name+email -> admin sees the request in Settings
   -> Admin and clicks "Generate Code" -> a fresh random code appears for the admin to
   copy and send manually (Messenger, email, whatever) -> the person types their email
   + that code back into the app -> if it matches an issued, not-yet-redeemed request,
   the leaderboard unlocks on this device.
   Honest security note: like the existing announcement admin panel, this table's RLS
   is permissive rather than tied to real server-side identity, because there's no
   backend here to check against. Someone probing the API directly could theoretically
   read pending codes. This matches the trust level you already have with the
   ADMIN_CODE-gated announcement system — not a new weakness, the same one, extended. */
function generateAccessCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O or 1/I — easy to read aloud
  const bytes = new Uint8Array(8);
  (window.crypto || window.msCrypto).getRandomValues(bytes);
  let code = '';
  for(let i=0;i<8;i++){ code += chars[bytes[i] % chars.length]; if(i===3) code += '-'; }
  return code;
}
async function submitLeaderboardAccessRequest(name, email){
  const client = getSbClient();
  if(!client) return { error:'Not connected to Supabase.' };
  try{
    // One request per email — if they've already got a pending or already-issued
    // request, don't create a duplicate; just point them at what already exists.
    const { data: existing, error: lookupErr } = await client.from('leaderboard_access_requests')
      .select('id,status').eq('email', email).in('status', ['pending','issued']).maybeSingle();
    if(lookupErr) return { error: lookupErr.message };
    if(existing){
      state.settings.leaderboardAccessRequestId = existing.id;
      save();
      return { error:null, alreadyRequested:true, status:existing.status };
    }
    const { data, error } = await client.from('leaderboard_access_requests')
      .insert({ name, email, status:'pending' })
      .select().single();
    if(error) return { error: error.message };
    state.settings.leaderboardAccessRequestId = data.id;
    save();
    return { error:null };
  }catch(e){ return { error: e.message || 'Network error' }; }
}
async function redeemLeaderboardAccessCode(email, code){
  const client = getSbClient();
  if(!client) return { error:'Not connected to Supabase.' };
  const cleanEmail = email.trim();
  try{
    const { data, error } = await client.from('leaderboard_access_requests')
      .select('id,status,blocked_at,suspended_until').eq('email', cleanEmail).eq('access_code', code.trim().toUpperCase())
      .eq('status','issued').maybeSingle();
    if(error) return { error: error.message };
    if(!data) return { error:'That code doesn\'t match — double-check the email and code, or ask the admin to resend it.' };
    if(data.blocked_at) return { error:'This account has been restricted. Please contact the admin if you believe this is an error.' };
    if(data.suspended_until && new Date(data.suspended_until) > new Date()) return { error:'This account is temporarily suspended. Please contact the admin if you believe this is an error.' };
    const { error: updErr } = await client.from('leaderboard_access_requests')
      .update({ status:'redeemed', redeemed_at:new Date().toISOString() }).eq('id', data.id);
    if(updErr) return { error: updErr.message };
    state.settings.leaderboardAccessGranted = true;
    state.settings.leaderboardAccessEmail = cleanEmail;
    save();
    return { error:null };
  }catch(e){ return { error: e.message || 'Network error' }; }
}
async function fetchLeaderboardAccessRequests(){
  const client = getSbClient();
  if(!client) return { rows:null, error:'Not connected to Supabase.' };
  try{
    const { data, error } = await client.from('leaderboard_access_requests').select('*').order('requested_at', { ascending:false });
    if(error) return { rows:null, error: error.message };
    const rows = (data||[]).filter(r => r.email && r.email.trim());
    return { rows, error:null };
  }catch(e){ return { rows:null, error: e.message || 'Network error' }; }
}
async function issueLeaderboardAccessCode(requestId){
  const client = getSbClient();
  if(!client) return { error:'Not connected to Supabase.' };
  const code = generateAccessCode();
  try{
    const { error } = await client.from('leaderboard_access_requests')
      .update({ access_code: code, status:'issued', code_issued_at: new Date().toISOString() }).eq('id', requestId);
    if(error) return { error: error.message };
    return { error:null, code };
  }catch(e){ return { error: e.message || 'Network error' }; }
}
async function adminRenamePlayer(requestId, email, newName){
  const client = getSbClient();
  if(!client) return { error:'Not connected.' };
  try{
    const { error: e1 } = await client.from('leaderboard_access_requests').update({ name:newName }).eq('id', requestId);
    if(e1) return { error:e1.message };
    if(email){
      const { data: playerRow } = await client.from('players').select('name').eq('email', email).maybeSingle();
      if(playerRow && playerRow.name && playerRow.name !== newName){
        const oldName = playerRow.name;
        const { error: e2 } = await client.from('players').update({ name:newName }).eq('email', email);
        if(e2) return { error:e2.message };
        const { error: e3 } = await client.from('daily_minutes').update({ player_name:newName }).eq('player_name', oldName);
        if(e3) return { error: 'Renamed, but their past daily totals couldn\'t follow — ' + e3.message };
      }
    }
    return { error:null };
  }catch(e){ return { error: e.message||'Network error' }; }
}
async function adminSuspendPlayer(requestId, days){
  const client = getSbClient();
  if(!client) return { error:'Not connected.' };
  const until = new Date(Date.now() + days*24*60*60*1000).toISOString();
  try{
    const { error } = await client.from('leaderboard_access_requests').update({ suspended_until: until, blocked_at:null }).eq('id', requestId);
    if(error) return { error: error.message };
    return { error:null };
  }catch(e){ return { error: e.message||'Network error' }; }
}

async function adminDeletePlayerCompletely(requestId, email, name){
  const client = getSbClient();
  if(!client) return { error:'Not connected.' };
  try{
    if(name){ await client.from('daily_minutes').delete().eq('player_name', name); }
    if(email){ await client.from('players').delete().eq('email', email); }
    const { error } = await client.from('leaderboard_access_requests').delete().eq('id', requestId);
    if(error) return { error: error.message };
    return { error:null };
  }catch(e){ return { error: e.message||'Network error' }; }
}

      <div class="row" style="margin-top:10px; gap:8px; align-items:center;">
        <span class="mono badge" style="font-size:13px;">${escapeHtml(r.access_code)}</span>
        <button class="btn btn-sm" data-copy-code="${escapeHtml(r.access_code)}">Copy</button>
        <button class="btn btn-sm" data-issue-code="${r.id}">Regenerate</button>
      </div>
      <p style="font-size:11px; color:var(--text-muted); margin-top:6px;">Sent to them yourself yet? Copy this and message it to ${escapeHtml(r.email)}.</p>
    ` : ''}
    ${r.status==='redeemed' ? `
      <p style="font-size:11px; color:var(--text-muted); margin-top:6px;">Redeemed ${dt(r.redeemed_at)}${isSuspended ? ` · Suspended until ${dt(r.suspended_until)}` : ''}${isBlocked ? ` · Blocked ${dt(r.blocked_at)}` : ''}</p>

        ${!isBlocked ? `<button class="btn btn-sm" data-block="${r.id}" style="color:var(--danger);">Block Permanently</button>` : ''}

        <button class="btn btn-sm" data-delete-player="${r.id}" data-email="${escapeHtml(r.email)}" data-current-name="${escapeHtml(r.name)}" style="color:var(--danger);">Delete Permanently</button>
      </div>
    ` : ''}
  </div>`;
}
async function loadAndRenderAccessRequests(){
  const wrap = document.getElementById('lbAccessRequestsWrap');
  if(!wrap) return;
  wrap.innerHTML = `<p style="font-size:13px; color:var(--text-muted);">Loading…</p>`;
  const { rows, error } = await fetchLeaderboardAccessRequests();
  if(error){ wrap.innerHTML = `<p style="font-size:13px; color:var(--danger);">Could not load requests — ${escapeHtml(error)}. Check that the leaderboard_access_requests table exists (see the SQL file).</p>`; return; }
  if(!rows.length){ wrap.innerHTML = `<p style="font-size:13px; color:var(--text-muted);">No requests yet.</p>`; return; }
  wrap.innerHTML = rows.map(accessRequestRowHtml).join('');
  wrap.querySelectorAll('[data-issue-code]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true; btn.textContent = 'Generating…';
      const { error, code } = await issueLeaderboardAccessCode(btn.dataset.issueCode);
      if(error){ toast('Could not generate code — ' + error); btn.disabled = false; btn.textContent = 'Generate Code'; return; }
      toast('Code generated: ' + code);
      loadAndRenderAccessRequests();
    });
  });
  wrap.querySelectorAll('[data-copy-code]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      navigator.clipboard?.writeText(btn.dataset.copyCode).then(()=> toast('Code copied')).catch(()=> toast('Could not copy — select and copy manually'));
    });
  });
  wrap.querySelectorAll('[data-rename]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const newName = prompt('New display name:', btn.dataset.currentName);
      if(!newName || !newName.trim() || newName.trim()===btn.dataset.currentName) return;
      btn.disabled = true;
      const { error } = await adminRenamePlayer(btn.dataset.rename, btn.dataset.email, newName.trim());
      btn.disabled = false;
      if(error){ toast('Could not rename — ' + error); return; }
      toast('Renamed'); loadAndRenderAccessRequests(); refreshLbCache();
    });
  });
  wrap.querySelectorAll('[data-suspend]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const daysStr = prompt('Suspend for how many days?', '7');
      const days = parseInt(daysStr, 10);
      if(!days || days<=0) return;
      btn.disabled = true;
      const { error } = await adminSuspendPlayer(btn.dataset.suspend, days);
      btn.disabled = false;
      if(error){ toast('Could not suspend — ' + error); return; }
      toast(`Suspended for ${days} day${days===1?'':'s'}`); loadAndRenderAccessRequests(); refreshLbCache();
    });
  });
  wrap.querySelectorAll('[data-block]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      confirmAction('Block this person permanently from the leaderboard? They can only come back if you unban them.', async ()=>{
        const { error } = await adminBlockPlayer(btn.dataset.block);
        if(error){ toast('Could not block — ' + error); return; }
        toast('Blocked'); loadAndRenderAccessRequests(); refreshLbCache();
      });
    });
  });
  wrap.querySelectorAll('[data-restore]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true;
      const { error } = await adminRestorePlayer(btn.dataset.restore);
      btn.disabled = false;
      if(error){ toast('Could not unban — ' + error); return; }
      toast('Unbanned'); loadAndRenderAccessRequests(); refreshLbCache();
    });
  });
  wrap.querySelectorAll('[data-delete-player]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      confirmAction(`Permanently delete ${btn.dataset.currentName}? This removes their request, leaderboard entry, and all daily study records. This can't be undone.`, async ()=>{
        const { error } = await adminDeletePlayerCompletely(btn.dataset.deletePlayer, btn.dataset.email, btn.dataset.currentName);
        if(error){ toast('Could not delete — ' + error); return; }
        toast('Deleted permanently'); loadAndRenderAccessRequests(); refreshLbCache();
      });
    });
  });
}
/* Instant admin notification for new access requests, via Supabase Realtime — still
   "frontend only" (uses the normal anon key, no Edge Function), but requires Realtime
   to be switched on for this table in the Supabase dashboard first: Database → 
   Replication → find "leaderboard_access_requests" → enable it. Without that one-time
   toggle, new requests still show up fine when you open the Admin panel and click
   Refresh — you just won't get the instant notification while looking elsewhere. */
let adminRequestChannel = null;
function startAdminRequestNotifications(){
  const client = getSbClient();
  if(!client || adminRequestChannel) return; // already subscribed this session
  fetchLeaderboardAccessRequests().then(({rows})=>{
    const pending = (rows||[]).filter(r=>r.status==='pending').length;
    if(pending>0) toast(`${pending} pending leaderboard request${pending===1?'':'s'} waiting`);
  });
  try{
    adminRequestChannel = client.channel('admin-access-requests')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'leaderboard_access_requests' }, (payload)=>{
        const r = payload.new;
        toast(`New leaderboard request from ${r.name}`);
        pushNotification('leaderboard-request', 'New Access Request', `${r.name} (${r.email}) requested leaderboard access.`);
        if(currentPage==='settings') loadAndRenderAccessRequests();
      })
      .subscribe();
  }catch(e){ /* Realtime not available/enabled — silent fallback to manual Refresh */ }
}
async function fetchVerifiedEmails(){
  const client = getSbClient();
  if(!client) return new Set();
  try{
    const { data, error } = await client.from('leaderboard_access_requests')
      .select('email,blocked_at,suspended_until').eq('status','redeemed');
    if(error) return new Set();
    const now = Date.now();
    const verified = (data||[]).filter(r=>
      !r.blocked_at && (!r.suspended_until || new Date(r.suspended_until).getTime() <= now)
    );
    return new Set(verified.map(r=>r.email));
  }catch(e){ return new Set(); }
}
async function fetchRosterRows(){
  const client = getSbClient();
  if(!client) return { rows:null, error:'Leaderboard isn\'t connected.' };
  try{
    const today = todayStr();
    const [playersRes, minutesRes, verifiedEmails] = await Promise.all([
      client.from('players').select('name,email'),
      client.from('daily_minutes').select('player_name,minutes').eq('study_date', today),
      fetchVerifiedEmails()
    ]);
    if(playersRes.error) return { rows:null, error:playersRes.error.message };
    if(minutesRes.error) return { rows:null, error:minutesRes.error.message };
    const minutesByName = {};
    minutesRes.data.forEach(r=> minutesByName[r.player_name] = r.minutes);
    // Only verified members (redeemed, not blocked, not currently suspended) show on the
    // leaderboard — anyone whose email isn't in that set is excluded, including players
    // from before this check existed (no email on file at all can't be confirmed verified).
    const rows = playersRes.data
      .filter(p=> p.email && verifiedEmails.has(p.email))
      .map(p=>({
        name:p.name, avatarDataUrl: avatarCache[p.name] || null, minutes: Math.round(minutesByName[p.name]||0),
        isMe: p.name === state.profile.name
      }));
    rows.sort((a,b)=> b.minutes - a.minutes);
    // Fire-and-forget: only pulls photos for names we've never seen this session (usually
    // zero after the first load), then patches them into the already-rendered leaderboard.
    fetchMissingAvatars(rows.map(r=>r.name)).then(gotNew=>{ if(gotNew){
      rows.forEach(r=>{ if(r.name in avatarCache) r.avatarDataUrl = avatarCache[r.name]; });
      lbCache.rows = rows; updateLeaderboardDom(); updateDashRankBanner();
    }});
    return { rows, error:null };
  }catch(e){ return { rows:null, error: e.message || 'Network error' }; }
}
async function fetchMyChallenges(){
  const client = getSbClient();
  if(!client) return { rows:null, error:'not configured' };
  try{
    const { data, error } = await client.from('challenges').select('*').contains('participant_names', [state.profile.name]).order('created_at', { ascending:false });
    if(error) return { rows:null, error:error.message };
    return { rows: data||[], error:null };
  }catch(e){ return { rows:null, error: e.message || 'Network error' }; }
}
async function refreshLbCache(){
  const { rows, error } = await fetchRosterRows();
  if(rows) lbCache.rows = rows; else lbCache.error = error;
  const { rows: chs } = await fetchMyChallenges();
  if(chs) lbCache.challenges = chs;
  lbCache.loaded = true;
  updateDashRankBanner();
  updateLeaderboardDom();
  checkDailyTopper();
  const hadActive = lbCache.challenges.some(c=>!c.finished);
  if(hadActive){
    await autoSettleChallenges();
    const { rows: chs2 } = await fetchMyChallenges();
    if(chs2){ lbCache.challenges = chs2; updateLeaderboardDom(); }
  }
}
function updateLeaderboardDom(){
  // Patches the already-rendered skeleton in place — deliberately does NOT call
  // renderMain(), since this runs on a poll timer and a render→refresh→render loop
  // would never stop.
  const listEl = document.getElementById('lbList');
  if(listEl){
    listEl.innerHTML = lbCache.loaded
      ? (lbCache.rows.length ? lbCache.rows.map(leaderboardRowHtml).join('') : '<p class="sticky-empty">No one\'s studied yet today.</p>')
      : '<p class="sticky-empty" style="opacity:.7;">Loading…</p>';
  }
  const compListEl = document.getElementById('compList');
  if(compListEl){
    const active = lbCache.challenges.filter(c=>!c.finished);
    const finished = lbCache.challenges.filter(c=>c.finished);

async function fetchPlayerWeeklyMinutes(playerName){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    days.push({ date: todayStr(d), mins:0, label: i===0 ? 'Today' : i===1 ? 'Yest' : d.toLocaleDateString(undefined,{weekday:'short'}) });
  }
  // Your own history is already complete locally — no need to round-trip for it.
  if(playerName === state.profile.name){
    days.forEach(d=>{ d.mins = minutesOnDate(d.date); });
    return { days, error:null };
  }
  const client = getSbClient();
  if(!client) return { days:null, error:'Not connected.' };
  try{
    const { data, error } = await client.from('daily_minutes').select('study_date,minutes')
      .eq('player_name', playerName).in('study_date', days.map(d=>d.date));
    if(error) return { days:null, error:error.message };
    (data||[]).forEach(r=>{
      const d = days.find(x=>x.date===r.study_date);
      if(d) d.mins = Math.min(MAX_SANE_DAILY_MINUTES, Math.max(0, r.minutes||0));
    });
    return { days, error:null };
  }catch(e){ return { days:null, error:e.message||'Network error' }; }
}

/* ============ AUTOMATIC CHALLENGE SETTLEMENT ============
   No "log result" button — like Duolingo's weekly leagues or a Strava segment board,
   results settle themselves. There's no server-side cron here (this app has no
   backend beyond the database), so instead: whenever any participant's app checks
   in — opening the Dashboard, visiting the Leaderboard, or just sitting on the
   polling interval — it looks for any challenge days that have fully elapsed but
   haven't been scored yet, and settles all of them in one pass, catching up on
   however many days were missed (e.g. nobody opened the app over a weekend). Several
   people's apps can attempt this around the same moment, so every write is a
   compare-and-swap: it only applies if last_settled_date still matches what this
   client last saw. Whoever gets there first wins the write; everyone else's update
   matches nothing, no-ops safely, and they just pick up the result on their next
   refresh — same end state either way, no double-counting. */
async function deleteChallenge(compId){
  const comp = lbCache.challenges.find(c=>c.id===compId);
  if(!comp) return;
  confirmAction(`Delete "${compTitle(comp)}"? This can't be undone.`, async ()=>{
    const client = getSbClient();
    const { data, error } = await client.from('challenges').delete().eq('id', compId).select();
    if(error){ toast('Could not delete — ' + error.message); return; }
    if(!data || !data.length){
      // The request "succeeded" but removed nothing — almost always a missing DELETE
      // policy in Supabase's Row Level Security, which silently filters rows the anon
      // role can't touch rather than erroring. Don't pretend it worked: a fake success
      // here is exactly what let deleted challenges reappear on the next full refresh.
      toast('Could not delete — no permission to delete on the server (check the Row Level Security DELETE policy on the challenges table).');
      return;
    }
    lbCache.challenges = lbCache.challenges.filter(c=>c.id!==compId);
    toast('Challenge deleted');
    updateLeaderboardDom();
  });
}
async function autoSettleChallenges(){
  if(!leaderboardSyncReady()) return;
  const mine = (lbCache.challenges||[]).filter(c=>!c.finished && c.participant_names.includes(state.profile.name));
  for(const comp of mine){
    try{ await settleOneChallengeCatchUp(comp); }catch(e){ /* best-effort — next refresh retries */ }
  }
}
async function settleOneChallengeCatchUp(comp){
  const today = todayStr();
  const firstDue = comp.last_settled_date ? addDays(comp.last_settled_date, 1) : comp.start_date;
  if(firstDue >= today) return; // today is still in progress — nothing due yet
  const dueDates = [];
  let d = firstDue;
  while(d < today && dueDates.length < comp.days){ dueDates.push(d); d = addDays(d, 1); }
  if(dueDates.length === 0) return;
  const client = getSbClient();
  const { data: minsData, error } = await client.from('daily_minutes').select('player_name,study_date,minutes').in('study_date', dueDates).in('player_name', comp.participant_names);
  if(error) return;
  let points = Object.assign({}, comp.points);
  let log = (comp.log||[]).slice();
  let dayIndex = comp.day_index || 0;
  let finished = false;
  let lastDate = comp.last_settled_date;
  for(const date of dueDates){
    if(dayIndex >= comp.days) break;
    const minutesByName = {}; comp.participant_names.forEach(n=> minutesByName[n]=0);
    minsData.filter(r=>r.study_date===date).forEach(r=> minutesByName[r.player_name] = Math.round(r.minutes));
    const top = Math.max(...comp.participant_names.map(n=>minutesByName[n]));
    const winners = comp.participant_names.filter(n=>minutesByName[n]===top);
    const isTie = top===0 || winners.length>1; // an all-zero day (nobody opened the app) counts as a tie, not a random win
    if(!isTie) comp.participant_names.forEach(n=>{ points[n] = (points[n]||0) + (n===winners[0] ? 5 : -5); });
    log.push({ date, standings: comp.participant_names.map(n=>({name:n, minutes:minutesByName[n]})), winner: isTie ? null : winners[0] });
    dayIndex++;
    lastDate = date;
    if(dayIndex >= comp.days){ finished = true; break; }
  }
  let q = client.from('challenges').update({ points, log, last_settled_date:lastDate, day_index:dayIndex, finished }).eq('id', comp.id);
  q = comp.last_settled_date ? q.eq('last_settled_date', comp.last_settled_date) : q.is('last_settled_date', null);
  const { data: updData, error: updErr } = await q.select();
  if(updErr || !updData || !updData.length) return; // someone else already settled it — we'll see their result on next refresh
  const priorLogLen = comp.log ? comp.log.length : 0;
  log.slice(priorLogLen).forEach((entry, i, arr)=>{
    const mine2 = entry.winner === state.profile.name;
    const msg = entry.winner ? `${entry.winner} won ${entry.date} (${mine2?'+5':'-5'})` : `${entry.date} was a tie — no points`;
    pushNotification('challenge', compTitle(comp), msg + (finished && i===arr.length-1 ? ' — challenge finished!' : ''));
  });
}
/* Consecutive most-recent days this browser's user has won, for the small streak
   badge — inspired by the "current streak" indicators common on habit/fitness apps. */
function challengeStreakFor(comp){
  const log = comp.log || [];
  let streak = 0;
  for(let i=log.length-1; i>=0; i--){
    if(log[i].winner === state.profile.name) streak++;
    else break;
  }
  return streak;
}

  {id:'first_session', title:'First Steps', desc:'Log your first study session', check: s=> s.sessions.length>=1},
  {id:'five_pomos', title:'Focused Five', desc:'Complete 5 Pomodoro sprints', check: s=> s.sessions.filter(x=>x.type==='pomodoro').length>=5},

  {id:'week_streak', title:'Week Warrior', desc:'Reach a 7-day streak', check: s=> currentStreak()>=7},
  {id:'first_subject', title:'Getting Organized', desc:'Add your first subject', check: s=> s.subjects.length>=1},

  {id:'chapter_complete', title:'Chapter Closed', desc:'Finish every chapter in a subject', check: s=> s.subjects.some(sub=> sub.chapters.length>0 && sub.chapters.every(c=>c.done))},
  {id:'five_subjects', title:'Renaissance Scholar', desc:'Track 5 different subjects', check: s=> s.subjects.length>=5},
];
/* Metrics available for user-created goals — reuses the same stats the built-in
   achievements and dashboard already compute, so numbers always agree. */
const GOAL_METRICS = {
  totalHours: { label:'Total study hours', unit:'hrs', value: ()=> totalMinutesAll()/60 },
  streak:     { label:'Study streak (days)', unit:'day streak', value: ()=> currentStreak() },
  pomodoros:  { label:'Pomodoro sprints completed', unit:'sprints', value: ()=> state.sessions.filter(x=>x.type==='pomodoro').length },
  notes:      { label:'Notes written', unit:'notes', value: ()=> state.notes.length },
  subjects:   { label:'Subjects tracked', unit:'subjects', value: ()=> state.subjects.length },
  chapters:   { label:'Chapters completed', unit:'chapters', value: ()=> state.subjects.reduce((a,s)=>a+s.chapters.filter(c=>c.done).length,0) },
};
function formatMetric(metric, value){
  const v = metric==='totalHours' ? (Math.round(value*10)/10) : Math.round(value);
  return `${v} ${GOAL_METRICS[metric] ? GOAL_METRICS[metric].unit : ''}`;
}
/* ============ NOTIFICATION CENTER ============ */
/* A persistent, reviewable history — toasts are still shown for immediate feedback, but
   they vanish in a couple seconds. This is the "come back and actually see what
   happened" version, surfaced through the bell icon next to your profile photo. */
const NOTIF_ICONS = {
  achievement: '🏆', pomodoro: '🍅', task: '✓', challenge: '🎮', topper: '👑', announcement: '📣'
};
function pushNotification(type, title, body){
  state.notifications = state.notifications || [];
  state.notifications.unshift({ id:uid(), type, title, body, createdAt:new Date().toISOString(), read:false });
  if(state.notifications.length > 50) state.notifications.length = 50;
  save();
  updateNotifBell();
}
function unreadNotifCount(){ return (state.notifications||[]).filter(n=>!n.read).length; }
function updateNotifBell(){
  const badge = document.getElementById('notifBellBadge');
  if(!badge) return;
  const count = unreadNotifCount();
  badge.style.display = count>0 ? 'flex' : 'none';
  badge.textContent = count>9 ? '9+' : String(count);
}
function relativeTime(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'Just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  if(days < 7) return days+'d ago';
  return new Date(iso).toLocaleDateString();
}
function openNotifPanel(){
  renderNotifPanel();
  (state.notifications||[]).forEach(n=> n.read = true);
  save();
  updateNotifBell();
}
function renderNotifPanel(){
  const list = state.notifications || [];
  openModal(`
    <button class="close-x" id="closeM">×</button>
    <div class="row" style="justify-content:space-between; margin-bottom:14px;">
      <h3>Notifications</h3>
      ${list.length ? '<button class="btn btn-sm" id="notifClearBtn">Clear All</button>' : ''}
    </div>
    <div id="notifList" style="max-height:56vh; overflow-y:auto;">
      ${list.length ? list.map(n=>`<div class="notif-row ${n.read?'':'unread'}">
        <span class="notif-icon">${NOTIF_ICONS[n.type]||'🔔'}</span>
        <div class="notif-text">
          <div class="notif-title">${escapeHtml(n.title)}</div>
          <div class="notif-body">${escapeHtml(n.body)}</div>
          <div class="notif-time">${relativeTime(n.createdAt)}</div>
        </div>
      </div>`).join('') : `<div class="empty"><h3>Nothing yet</h3><p>Achievements, finished sprints, challenge results, and updates will show up here.</p></div>`}
    </div>
  `, {large:true});
  document.getElementById('closeM').addEventListener('click', closeModal);
  const clearBtn = document.getElementById('notifClearBtn');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    confirmAction('Clear all notifications? This can\'t be undone.', ()=>{
      state.notifications = []; save(); updateNotifBell(); closeModal();
    });
  });
}
/* Spot-checks the current #1 on today's leaderboard and notifies once when it's someone
   new — not on every poll tick, only when the actual leader changes for the day. */
function checkDailyTopper(){
  if(!lbCache.loaded || lbCache.rows.length < 2) return;
  const top = lbCache.rows[0];
  if(top.minutes <= 0) return;
  const key = todayStr() + ':' + top.name;
  if(state.settings.lastAnnouncedTopper === key) return;
  state.settings.lastAnnouncedTopper = key;
  save();
  const isMe = top.isMe;
  pushNotification('topper', isMe ? "You're leading today! 👑" : `${top.name} is leading today`, `${top.name} — ${fmtMin(top.minutes)} logged so far.`);
}
function celebrateGoal(title){
  sfxAchievement();
  if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Achievement unlocked', {body:title}); }catch(e){}
  }
  toast('Achievement unlocked: '+title);
  pushNotification('achievement', 'Achievement unlocked', title);
}
function notifyTaskDone(name){
  sfxStopwatchStop();
  if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Task complete', {body:name}); }catch(e){}
  }
  toast('✓ Done: ' + name);
  pushNotification('task', 'Task complete', name);
}
function checkAchievements(){
  let changed = false;
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievementsUnlocked.includes(a.id) && a.check(state)){
      state.achievementsUnlocked.push(a.id); changed = true;
      celebrateGoal(a.title);
    }
  });
  (state.customAchievements||[]).forEach(g=>{
    if(g.metric!=='manual' && !g.unlocked && GOAL_METRICS[g.metric] && GOAL_METRICS[g.metric].value() >= g.target){
      g.unlocked = true; g.unlockedAt = new Date().toISOString(); changed = true;
      celebrateGoal(g.title);
    }
  });
  if(changed) save();
}
function toggleCustomGoal(id){
  const g = (state.customAchievements||[]).find(x=>x.id===id);
  if(!g || g.metric!=='manual') return;
  g.unlocked = !g.unlocked;
  g.unlockedAt = g.unlocked ? new Date().toISOString() : null;
  save();
  if(g.unlocked) celebrateGoal(g.title);
  renderMain();
}
function openAddGoalModal(){

    const metric = metricSelect.value;
    const desc = document.getElementById('goalDesc').value.trim();
    const goal = {
      id:uid(), title, desc, metric,
      target: metric==='manual' ? null : Math.max(1, parseFloat(document.getElementById('goalTarget').value)||1),
      unlocked:false, unlockedAt:null

function renderAchievements(main){
  const customs = state.customAchievements || [];
  main.innerHTML = `<div class="page-header"><div><h1>Achievements</h1><p>${state.achievementsUnlocked.length} of ${ACHIEVEMENTS.length} unlocked${customs.length? ` · ${customs.filter(g=>g.unlocked).length} of ${customs.length} of your own goals`:''}.</p></div></div>

  document.getElementById('achGrid').innerHTML = ACHIEVEMENTS.map(a=>{

    return `<div class="card ach-card ${unlocked?'unlocked':'locked'}">
      <div class="icon">${unlocked?'✓':'?'}</div>
      <h4>${escapeHtml(a.title)}</h4>
      <p>${escapeHtml(a.desc)}</p>

    goalGrid.innerHTML = `<div class="card empty" style="grid-column:1/-1;"><h3>No goals yet</h3><p>Set a personal target — like "finish 3 chapters" or "study 20 hours this month."</p></div>`;
  } else {
    goalGrid.innerHTML = customs.map(g=>{
      const isManual = g.metric === 'manual';
      const progress = isManual ? (g.unlocked ? 'Marked complete' : 'Tap to mark complete') : `${formatMetric(g.metric, GOAL_METRICS[g.metric] ? GOAL_METRICS[g.metric].value() : 0)} / ${formatMetric(g.metric, g.target)}`;
      return `<div class="card ach-card custom-goal ${g.unlocked?'unlocked':'locked'}" data-goal="${g.id}" style="position:relative; cursor:${isManual?'pointer':'default'};">
        <button class="icon-btn" data-del-goal="${g.id}" title="Delete goal" style="position:absolute; top:8px; right:8px;">${ICONS.trash}</button>
        <div class="icon">${g.unlocked?'✓':'?'}</div>

        ${g.desc ? `<p style="font-size:10px; margin-top:4px; opacity:.7;">${progress}</p>` : ''}
      </div>`;
    }).join('');
    goalGrid.querySelectorAll('[data-goal]').forEach(card=>{
      card.addEventListener('click', (e)=>{
        if(e.target.closest('[data-del-goal]')) return;
        toggleCustomGoal(card.dataset.goal);
      });

    goalGrid.querySelectorAll('[data-del-goal]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();

          state.customAchievements = state.customAchievements.filter(x=>x.id!==btn.dataset.delGoal);
          save(); renderMain();
        });
      });
    });
  }
  document.getElementById('addGoalBtn').addEventListener('click', openAddGoalModal);
}
