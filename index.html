        <p style="font-size:12px; color:var(--text-muted); margin-bottom:0;" id="lbSyncStatus">⏸ Temporarily paused — sync and connection testing are switched off while a data-usage issue is being fixed. Your saved connection settings are untouched and will resume once this is turned back on.</p>
      ` : `
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;" id="lbSyncStatus">${leaderboardSyncReady() ? '🟢 Connected — your name, photo, and today\'s minutes sync automatically.' : '🔴 Not connected.'}</p>
        <div class="field"><label>Project URL</label><input type="text" id="lbSyncUrl" value="${escapeHtml(state.settings.leaderboardSync.supabaseUrl)}" placeholder="https://xxxxx.supabase.co"></div>
        <div class="field"><label>Anon Public API Key</label><input type="text" id="lbSyncKey" value="${escapeHtml(state.settings.leaderboardSync.supabaseKey)}" placeholder="eyJhbGciOi..."></div>
        <button class="btn btn-primary" id="lbSyncSave">Save Connection</button>
        <p style="font-size:11px; color:var(--text-muted); margin-top:10px;">Only your display name, profile photo, and today's total minutes are ever sent — nothing about your notes, subjects, or session history leaves this device.</p>
      `}
    </div>
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px;">Admin</h3>
      ${isAdminUnlocked ? `
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Post a short update — everyone who opens this app will get it as a notification.</p>
        <div class="field"><label>Message</label><textarea id="announceText" placeholder="e.g. New Challenges feature just shipped — try it out!" style="min-height:70px;"></textarea></div>
        <button class="btn btn-primary" id="announceSendBtn">Send to Everyone</button>
        <p style="font-size:11px; color:var(--text-muted); margin-top:8px;" id="announceStatus"></p>
      ` : `
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Enter the admin code to post an update to everyone using this app.</p>
        <div class="row">
          <input type="password" id="adminCodeInput" placeholder="Admin code" style="flex:1;">
          <button class="btn btn-sm" id="adminUnlockBtn">Unlock</button>
        </div>
      `}
    </div>
    ${isAdminUnlocked ? `<div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:12px;">
        <h3 style="font-size:15px;">Leaderboard Access Requests</h3>
        <button class="btn btn-sm" id="lbAccessRefreshBtn">Refresh</button>
      </div>
      <div id="lbAccessRequestsWrap"><p style="font-size:13px; color:var(--text-muted);">Loading…</p></div>
    </div>` : ''}
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:14px;">Your Data</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Everything you track — sessions, notes, subjects — is stored only in this browser. The one exception is the Leaderboard above, if connected.</p>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn" id="exportBtn">Export Data (.json)</button>
        <button class="btn" id="importBtn">Import Data</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <button class="btn btn-danger" id="resetBtn">Reset All Data</button>
    </div>
  </div>`;
  const lbSyncSaveBtn = document.getElementById('lbSyncSave');
  if(lbSyncSaveBtn) lbSyncSaveBtn.addEventListener('click', async ()=>{
    const url = document.getElementById('lbSyncUrl').value.trim();
    const key = document.getElementById('lbSyncKey').value.trim();
    state.settings.leaderboardSync = { supabaseUrl:url, supabaseKey:key };
    sbClient = null;
    avatarCache = {};
    const statusEl = document.getElementById('lbSyncStatus');
    statusEl.textContent = 'Checking…';
    const { error } = await fetchRosterRows();
    if(error){ statusEl.textContent = '🔴 Could not connect — ' + error; return; }
    save();
    statusEl.textContent = '🟢 Connected — your name, photo, and today\'s minutes sync automatically.';
    toast('Leaderboard connected');
    pushMyPlayerRow(); pushMyDailyMinutes();
  });
  const adminUnlockBtn = document.getElementById('adminUnlockBtn');
  if(adminUnlockBtn) adminUnlockBtn.addEventListener('click', ()=>{
    const code = document.getElementById('adminCodeInput').value;
    if(code === ADMIN_CODE){ isAdminUnlocked = true; renderMain(); toast('Admin unlocked'); startAdminRequestNotifications(); }
    else toast('Incorrect code');
  });
  const lbAccessRefreshBtn = document.getElementById('lbAccessRefreshBtn');
  if(lbAccessRefreshBtn){
    lbAccessRefreshBtn.addEventListener('click', loadAndRenderAccessRequests);
    loadAndRenderAccessRequests();
  }
  const announceSendBtn = document.getElementById('announceSendBtn');
  if(announceSendBtn) announceSendBtn.addEventListener('click', async ()=>{
    const msg = document.getElementById('announceText').value.trim();
    const statusEl = document.getElementById('announceStatus');
    if(!msg){ toast('Write a message first'); return; }
    announceSendBtn.textContent = 'Sending…'; announceSendBtn.disabled = true;
    const { error } = await postAnnouncement(msg);
    announceSendBtn.textContent = 'Send to Everyone'; announceSendBtn.disabled = false;
    if(error){ statusEl.textContent = 'Could not send — ' + error; return; }
    statusEl.textContent = 'Sent!';
    document.getElementById('announceText').value = '';
    toast('Update posted');
  });
  document.querySelectorAll('[data-set-theme]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ setTheme(btn.dataset.setTheme); renderMain(); });
  });
  document.getElementById('notifSwitch').addEventListener('change', async e=>{
    if(e.target.checked){
      const granted = await requestNotifPermission();
      state.settings.notifications = granted;
      e.target.checked = granted;
    } else {
      state.settings.notifications = false;
    }
    save(); updateNotifStatus();
  });
  updateNotifStatus();
  document.getElementById('sfxSwitch').addEventListener('change', e=>{ state.settings.sfx = e.target.checked; save(); if(e.target.checked) sfxStart(); });
  const testSound = (fn)=>{ const wasOn = state.settings.sfx; state.settings.sfx = true; fn(); state.settings.sfx = wasOn; };
  document.getElementById('testStart').addEventListener('click', ()=>testSound(sfxStart));
  document.getElementById('testFinish').addEventListener('click', ()=>testSound(sfxWorkComplete));
  document.getElementById('testBreak').addEventListener('click', ()=>testSound(sfxBreakStart));
  document.getElementById('testResume').addEventListener('click', ()=>testSound(sfxBreakEnd));
  document.getElementById('testAch').addEventListener('click', ()=>testSound(sfxAchievement));
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    confirmAction('This will permanently delete all subjects, sessions, notes, and settings stored in this browser. Continue?', ()=>{
      localStorage.removeItem(STORAGE_KEY);
      clearLiveTimerState();
      stopPomoInterval(); clearInterval(sw.timerId); sw.timerId=null;
      pomo.running=false; sw.running=false; sw.elapsed=0; pomo.mode='work';
      stopMusic(); musicAudio.src=''; musicAudio.removeAttribute('src');
      showYtMiniPlayer(false);
      if(tickAliveAudio) tickAliveAudio.pause();
      isAdminUnlocked = false;
      state = defaultState();
      pomo.remaining = pomoDuration('work');
      sbClient = null;
      avatarCache = {};
      lbCache = { rows:[], challenges:[], loaded:false, error:null };
      applyTheme(); renderNav(); renderMain();
      toast('All data reset');
    }, 'Reset everything');
  });
}
function updateNotifStatus(){
  const el = document.getElementById('notifStatus'); if(!el) return;
  if(!('Notification' in window)){ el.textContent = 'Notifications are not supported in this browser.'; return; }
  el.textContent = 'Browser permission: ' + Notification.permission;
}
async function requestNotifPermission(){
  if(!('Notification' in window)) { toast('Notifications not supported in this browser'); return false; }
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied'){ toast('Notifications are blocked in your browser settings'); return false; }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}
function notifyUser(title, body){
  if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title, {body}); }catch(e){}
  }
  toast(title+' — '+body);
  pushNotification('pomodoro', title, body);
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'studium-study-data.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      state = mergeState(parsed);
      save(); applyTheme(); renderNav(); renderMain();
      toast('Data imported');
    }catch(err){ toast('Invalid file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ============ THEME ============ */
const THEME_ORDER = ['vintage','cozy-evening','cyber'];
const THEME_LABELS = { vintage:'Vintage Cozy', 'cozy-evening':'Cozy Evening', cyber:'Cyber Mode' };
function setTheme(theme){
  state.settings.theme = theme;
  save(); applyTheme();
}
function applyTheme(){
  const theme = THEME_ORDER.includes(state.settings.theme) ? state.settings.theme : 'vintage';
  document.documentElement.setAttribute('data-theme', theme);
  const next = THEME_ORDER[(THEME_ORDER.indexOf(theme)+1) % THEME_ORDER.length];
  document.getElementById('darkToggleLabel').textContent = THEME_LABELS[next];
  document.getElementById('darkToggleIcon').innerHTML = next==='cyber' ? ICONS.sun : ICONS.moon;
}
document.getElementById('darkToggleBtn').addEventListener('click', ()=>{
  const cur = THEME_ORDER.includes(state.settings.theme) ? state.settings.theme : 'vintage';
  setTheme(THEME_ORDER[(THEME_ORDER.indexOf(cur)+1) % THEME_ORDER.length]);
});

/* One-time cleanup: anyone who uploaded an avatar before compression was added is still
   storing (and re-uploading, and every viewer is re-downloading) a full-size image. This
   silently re-compresses it in place on next load, so the fix reaches existing users
   without needing a backend migration. Threshold is generous — legitimately small/already-
   compressed avatars are left untouched. */
function shrinkExistingAvatarIfTooLarge(){
  const url = state.profile.avatarDataUrl;
  if(!url || url.length < 60000) return;
  const img = new Image();
  img.onload = ()=>{
    try{
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2;
      const sy = (img.naturalHeight - side) / 2;
      const canvas = document.createElement('canvas');
      canvas.width = AVATAR_TARGET_PX; canvas.height = AVATAR_TARGET_PX;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, side, side, 0, 0, AVATAR_TARGET_PX, AVATAR_TARGET_PX);
      const shrunk = canvas.toDataURL('image/jpeg', AVATAR_JPEG_QUALITY);
      if(shrunk.length < url.length){
        state.profile.avatarDataUrl = shrunk;
        save();
        if(document.getElementById('changePhotoBtn')) renderMain();
        if(leaderboardSyncReady()) pushMyPlayerRow();
      }
    }catch(e){ /* if anything about the existing image can't be decoded, just leave it be */ }
  };
  img.onerror = ()=>{};
  img.src = url;
}

/* ============ INIT ============ */
applyTheme();
wireMediaSessionActions();
restoreLiveTimerState();
renderNav();
renderMain();
checkAchievements();
shrinkExistingAvatarIfTooLarge();
maybeShowMessengerInvite();
document.getElementById('messengerFabBtn').addEventListener('click', ()=> window.open(MESSENGER_INVITE_LINK, '_blank', 'noopener'));
document.getElementById('ytMiniCloseBtn').addEventListener('click', ()=>{
  if(ytPlayer && ytPlayerReady) ytPlayer.pauseVideo();
  showYtMiniPlayer(false);
  refreshMusicButton();
});
</script>
