<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EA; --bg-alt:#E4E8DE; --surface:#FFFFFF; --surface-2:#F7F8F3;
  --text:#1B231D; --text-muted:#5B6459; --border:#D7DCCF;
  --accent:#1F6F5C; --accent-soft:#1F6F5C1a; --accent-2:#C77E22; --accent-2-soft:#C77E221a;
  --danger:#B24A2C; --danger-soft:#B24A2C1a;
  --shadow:0 1px 2px rgba(27,35,29,0.06), 0 4px 16px rgba(27,35,29,0.06);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#101512; --bg-alt:#161C18; --surface:#1B2320; --surface-2:#202A25;
  --text:#EDEFE9; --text-muted:#9AA79E; --border:#2B362F;
  --accent:#4BCBA8; --accent-soft:#4BCBA826; --accent-2:#F0B35C; --accent-2-soft:#F0B35C26;
  --danger:#E2734A; --danger-soft:#E2734A26;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; transition:background .25s ease, color .25s ease;
}
h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
.mono{ font-family:'IBM Plex Mono',monospace; }
button{ font-family:'Inter',sans-serif; cursor:pointer; }
input,select,textarea{ font-family:'Inter',sans-serif; }
a{ color:var(--accent); }

/* Layout */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:220px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; padding:24px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ padding:6px 10px 20px 10px; }
.brand .mark{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; }
.brand .sub{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-btn{
  display:flex; align-items:center; gap:10px; border:none; background:none; text-align:left;
  padding:9px 12px; border-radius:8px; color:var(--text-muted); font-size:14px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-btn .nav-icon{ width:18px; height:18px; flex-shrink:0; color:var(--text-muted); transition:color .15s ease; }
.nav-btn .nav-icon svg{ width:100%; height:100%; display:block; }
.nav-btn:hover{ background:var(--surface-2); color:var(--text); }
.nav-btn:hover .nav-icon{ color:var(--text); }
.nav-btn.active{ background:var(--accent-soft); color:var(--text); font-weight:600; }
.nav-btn.active .nav-icon{ color:var(--accent); }
.icon-btn .nav-icon, .icon-btn svg{ width:15px; height:15px; display:block; }
.icon-btn{ display:inline-flex; align-items:center; justify-content:center; }
.btn svg{ width:14px; height:14px; }
.btn-icon-inline{ display:inline-flex; align-items:center; gap:6px; }
.sidebar-foot{ padding-top:10px; border-top:1px solid var(--border); margin-top:10px; }

.main{ flex:1; min-width:0; padding:32px 40px 80px; }
.page-header{ margin-bottom:24px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-header h1{ font-size:28px; }
.page-header p{ color:var(--text-muted); font-size:14px; margin-top:4px; }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.grid{ display:grid; gap:16px; }
.grid-2{ grid-template-columns:1fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } .main{padding:20px;} .sidebar{width:180px;} }

.stat{ display:flex; flex-direction:column; gap:6px; }
.stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); }
.stat .value{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; }

.btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; transition:all .15s ease;}
.btn:hover{ border-color:var(--accent); }
.btn-primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover{ opacity:.9; }
.btn-danger{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn-icon{ padding:6px 9px; }
input[type=text], input[type=number], input[type=url], textarea, select{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font-size:14px;
}
textarea{ resize:vertical; min-height:100px; font-family:'Inter',sans-serif; }
label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
.field{ margin-bottom:14px; }
.row{ display:flex; gap:10px; align-items:center; }
.progress-track{ height:8px; border-radius:5px; background:var(--bg-alt); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:5px; transition:width .3s ease; }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
.empty{ text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty h3{ color:var(--text); margin-bottom:6px; }

/* Toggle switch */
.switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.slider{ position:absolute; inset:0; background:var(--bg-alt); border-radius:20px; cursor:pointer; transition:.2s; border:1px solid var(--border);}
.slider:before{ content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked + .slider{ background:var(--accent); border-color:var(--accent);}
.switch input:checked + .slider:before{ transform:translateX(18px); background:#fff; }

/* Dashboard */
.hero-card{ background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); }
.subject-chip{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); }
.swatch{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* Pomodoro */
.timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:20px; padding:20px 0; }
.dial{ position:relative; width:260px; height:260px; }
.dial svg{ transform:rotate(-90deg); width:100%; height:100%; }
.dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.dial-time{ font-family:'IBM Plex Mono',monospace; font-size:44px; font-weight:600; }
.dial-mode{ font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-muted); margin-top:4px; }
.timer-controls{ display:flex; gap:10px; }
.timer-controls .btn{ min-width:90px; }

/* Heatmap */
.heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,1fr); gap:3px; overflow-x:auto; padding-bottom:6px; }
.heat-cell{ width:12px; height:12px; border-radius:3px; background:var(--bg-alt); }
.heat-legend{ display:flex; align-items:center; gap:4px; margin-top:10px; font-size:11px; color:var(--text-muted); }

/* Notes */
.notes-list{ display:flex; flex-direction:column; gap:10px; }
.note-item{ padding:14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; }
.note-item h4{ font-size:14px; margin-bottom:4px; font-family:'Inter',sans-serif; font-weight:600;}
.note-item p{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-item .meta{ font-size:10px; color:var(--text-muted); margin-top:6px; text-transform:uppercase; letter-spacing:.05em;}
.note-attach-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--text-muted); margin-top:6px; }
.note-attach-badge svg{ width:11px; height:11px; }
.attach-list{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; margin-bottom:4px; }
.attach-chip{ position:relative; width:72px; }
.attach-thumb{ width:72px; height:72px; border-radius:8px; object-fit:cover; border:1px solid var(--border); display:block; background:var(--surface-2); cursor:pointer; }
.attach-file{ width:72px; height:72px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-muted); cursor:pointer; }
.attach-file .nav-icon{ width:20px; height:20px; }
.attach-name{ font-size:9.5px; text-align:center; margin-top:4px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attach-remove{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

/* Achievements */
.ach-card{ text-align:center; padding:22px 14px; }
.ach-card .icon{ width:46px; height:46px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
.ach-card.locked .icon{ background:var(--bg-alt); color:var(--text-muted); }
.ach-card.unlocked .icon{ background:var(--accent-2-soft); color:var(--accent-2); }
.ach-card.locked{ opacity:.5; }
.ach-card h4{ font-size:13px; margin-bottom:4px; }
.ach-card p{ font-size:11px; color:var(--text-muted); }

/* Donut */
.donut-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
.donut{ width:180px; height:180px; border-radius:50%; flex-shrink:0; }
.legend{ display:flex; flex-direction:column; gap:8px; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
.legend-item .swatch{ width:10px; height:10px; border-radius:3px; }
.legend-item .pct{ margin-left:auto; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12px; }

/* Modal */
.overlay{ position:fixed; inset:0; background:rgba(10,14,11,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.overlay.open{ display:flex; }
.modal{ background:var(--surface); border-radius:12px; padding:24px; width:100%; max-width:440px; border:1px solid var(--border); max-height:85vh; overflow-y:auto; transition:max-width .15s ease;}
.modal.modal-lg{ max-width:820px; }
.pdf-frame{ width:100%; height:64vh; border:1px solid var(--border); border-radius:8px; background:#fff; display:block; }
.modal h3{ margin-bottom:16px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
.close-x{ float:right; background:none; border:none; color:var(--text-muted); font-size:20px; line-height:1; }

.chapter-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.chapter-row:last-child{ border-bottom:none; }
.chapter-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); }
.chapter-row span{ flex:1; font-size:14px; }
.chapter-row span.done{ text-decoration:line-through; color:var(--text-muted); }

.subject-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.icon-btn{ background:none; border:none; color:var(--text-muted); padding:4px; border-radius:6px; }
.icon-btn:hover{ background:var(--bg-alt); color:var(--text); }

.avatar{ width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; font-weight:700; flex-shrink:0;}
.toast{ position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:8px; padding:12px 18px; font-size:13px; z-index:100; opacity:0; transform:translateY(10px); transition:all .25s ease; pointer-events:none;}
.toast.show{ opacity:1; transform:translateY(0); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
input[type=range]{ width:100%; accent-color:var(--accent); height:20px; padding:0; background:none; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">Ledger</div>
      <div class="sub">Study Tracker</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <button class="nav-btn" id="darkToggleBtn"><span class="nav-icon" id="darkToggleIcon"></span><span id="darkToggleLabel">Dark mode</span></button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'ledgerStudyTrackerData';
const SUBJECT_COLORS = ['#1F6F5C','#C77E22','#5C6BC0','#B24A2C','#2E8B8B','#8E5FB0','#3F7D3A','#A0522D'];

/* Hand-picked line-icon set, drawn to match Ledger's editorial/analog feel:
   thin uniform stroke, rounded joins, no fills — reads like ink on a page. */
const ISVG = (inner)=> `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICONS = {
  dashboard: ISVG(`<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="4.5" rx="1.5"/><rect x="13" y="10" width="7.5" height="10.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/>`),
  pomodoro: ISVG(`<circle cx="12" cy="13" r="8"/><path d="M12 13V8.5"/><path d="M9 3.5h6"/><path d="M17.2 6.3l1.3-1.3"/>`),
  stopwatch: ISVG(`<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5"/><path d="M9.5 3.5h5"/><path d="M12 3.5V5.5"/>`),
  subjects: ISVG(`<path d="M6 3.5h11a1 1 0 0 1 1 1V21l-6.5-3.6L4.5 21V5a1.5 1.5 0 0 1 1.5-1.5Z"/>`),
  chapters: ISVG(`<path d="M4.5 6.5h1.5M4.5 12h1.5M4.5 17.5h1.5"/><path d="M9 6.5h10.5M9 12h10.5M9 17.5h10.5"/>`),
  heatmap: ISVG(`<rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="16" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="16" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16" width="4.5" height="4.5" rx="1"/><rect x="16" y="16" width="4.5" height="4.5" rx="1"/>`),
  notes: ISVG(`<path d="M6 3.5h9l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M15 3.5V8h4.5"/><path d="M8 12.5h8M8 16h5.5"/>`),
  analytics: ISVG(`<path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12Z"/><path d="M15.5 3.9A8.5 8.5 0 0 1 20.1 8.5H12Z"/>`),
  achievements: ISVG(`<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5 7 20.5l5-2.3 5 2.3-1.5-7"/>`),
  profile: ISVG(`<circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1-3.8 4-5.8 7.5-5.8s6.5 2 7.5 5.8"/>`),
  settings: ISVG(`<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6M17.7 17.7l-1.6-1.6M7.9 7.9 6.3 6.3"/>`),
  sun: ISVG(`<circle cx="12" cy="12" r="4"/><path d="M12 3v2.3M12 18.7V21M21 12h-2.3M5.3 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/>`),
  moon: ISVG(`<path d="M20 14.3A8.5 8.5 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3Z"/>`),
  edit: ISVG(`<path d="M14.5 4.5l5 5L8 21H3.5v-4.5Z"/>`),
  trash: ISVG(`<path d="M4.5 7h15"/><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2"/><path d="M6.5 7 7.3 19a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10.3 11v6M13.7 11v6"/>`),
  play: ISVG(`<circle cx="12" cy="12" r="8.5"/><path d="M10 8.5 15.5 12 10 15.5Z"/>`),
  warning: ISVG(`<path d="M12 3.5 21.5 20h-19Z"/><path d="M12 9.5v5"/><path d="M12 17.3v.2"/>`),
  plus: ISVG(`<path d="M12 5v14M5 12h14"/>`),
  music: ISVG(`<path d="M9 17.5V4.5l10.5-2V15"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17" cy="15" r="2.5"/>`),
  pause: ISVG(`<rect x="6" y="4.5" width="4.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1"/>`),
  speaker: ISVG(`<path d="M4 9.5h3.5L13 5v14L7.5 14.5H4Z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/><path d="M19 6.7a8 8 0 0 1 0 10.6"/>`),
  attach: ISVG(`<path d="M8 12.2V6.8a3.2 3.2 0 0 1 6.4 0V15a4.7 4.7 0 0 1-9.4 0V8"/>`),
  file: ISVG(`<path d="M6 3.5h9l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M15 3.5V8h4.5"/>`),
  image: ISVG(`<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-5 3.5 3.5L17 11l3.5 4.5"/>`),
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }

function defaultState(){
  return {
    profile:{ name:'Student', createdAt: todayStr() },
    settings:{ darkMode:false, workMin:25, breakMin:5, longBreakMin:15, sessionsBeforeLong:4, notifications:false, sfx:true,
      music:{ enabled:false, volume:0.5, fileName:'' } },
    subjects:[],
    sessions:[], // {id, subjectId, minutes, date, type}
    notes:[], // {id, subjectId, title, body, updatedAt}
    achievementsUnlocked:[],
    pomodoroCount:0
  };
}
let state = load();
function mergeState(parsed){
  const def = defaultState();
  const merged = Object.assign(def, parsed);
  merged.profile = Object.assign(def.profile, parsed.profile||{});
  merged.settings = Object.assign(def.settings, parsed.settings||{});
  merged.settings.music = Object.assign({enabled:false, volume:0.5, fileName:''}, (parsed.settings&&parsed.settings.music)||{});
  return merged;
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return mergeState(parsed);
  }catch(e){ return defaultState(); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    toast('Storage is full — try removing an attachment or a large note.');
    return false;
  }
}

/* ============ NAV ============ */
const PAGES = [
  {id:'dashboard', label:'Dashboard'},
  {id:'pomodoro', label:'Pomodoro Timer'},
  {id:'stopwatch', label:'Stopwatch'},
  {id:'subjects', label:'Subject Tracker'},
  {id:'chapters', label:'Chapter Progress'},
  {id:'heatmap', label:'Heatmap'},
  {id:'notes', label:'Notes'},
  {id:'analytics', label:'Analytics'},
  {id:'achievements', label:'Achievements'},
  {id:'profile', label:'Profile'},
  {id:'settings', label:'Settings'},
];
let currentPage = 'dashboard';

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map(p => `<button class="nav-btn ${p.id===currentPage?'active':''}" data-page="${p.id}"><span class="nav-icon">${ICONS[p.id]}</span>${p.label}</button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentPage = btn.dataset.page; renderNav(); renderMain(); });
  });
}

function renderMain(){
  const main = document.getElementById('main');
  const renderers = {
    dashboard: renderDashboard, pomodoro: renderPomodoro, stopwatch: renderStopwatch,
    subjects: renderSubjects, chapters: renderChapters, heatmap: renderHeatmap,
    notes: renderNotes, analytics: renderAnalytics, achievements: renderAchievements,
    profile: renderProfile, settings: renderSettings
  };
  main.innerHTML = '';
  renderers[currentPage](main);
}

/* ============ HELPERS ============ */
function subjectById(id){ return state.subjects.find(s=>s.id===id); }
function fmtMin(mins){
  mins = Math.round(mins);
  if(mins < 60) return mins + 'm';
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h ' + (m? m+'m':'');
}
function totalMinutesForSubject(id){
  return state.sessions.filter(s=>s.subjectId===id).reduce((a,s)=>a+s.minutes,0);
}
function totalMinutesAll(){ return state.sessions.reduce((a,s)=>a+s.minutes,0); }
function minutesOnDate(dateStr){
  return state.sessions.filter(s=>s.date===dateStr).reduce((a,s)=>a+s.minutes,0);
}
function currentStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const ds = todayStr(d);
    const mins = minutesOnDate(ds);
    if(mins > 0){ streak++; d.setDate(d.getDate()-1); }
    else{
      if(ds === todayStr()) { d.setDate(d.getDate()-1); continue; } // allow today to be empty still counting streak from yesterday
      break;
    }
  }
  return streak;
}
function logSession(subjectId, minutes, type){
  if(minutes <= 0) return;
  state.sessions.push({id:uid(), subjectId: subjectId||null, minutes, date: todayStr(), type});
  if(type==='pomodoro') state.pomodoroCount++;
  save();
  checkAchievements();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(()=>t.classList.remove('show'), 2600);
}
function subjectOptions(selectedId){
  const opts = ['<option value="">No subject</option>'];
  state.subjects.forEach(s=> opts.push(`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${escapeHtml(s.name)}</option>`));
  return opts.join('');
}
function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str; return d.innerHTML; }

function openModal(html, opts){
  const el = document.getElementById('modalBody');
  el.innerHTML = html;
  el.classList.toggle('modal-lg', !!(opts && opts.large));
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* Custom confirm — native confirm()/alert() are blocked inside sandboxed preview iframes */
function confirmAction(message, onConfirm, confirmLabel){
  openModal(`
    <h3 style="display:flex; align-items:center; gap:10px;">${ICONS.warning}Are you sure?</h3>
    <p style="font-size:14px; color:var(--text-muted); margin-bottom:20px;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">${escapeHtml(confirmLabel||'Delete')}</button>
    </div>
  `);
  document.getElementById('confirmCancel').addEventListener('click', closeModal);
  document.getElementById('confirmOk').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
}

/* ============ SOUND ENGINE ============ */
/* All SFX are synthesized locally via Web Audio — no external audio files, so everything
   still works fully offline. Browsers only allow audio to start from a direct click, so we
   unlock the context on the very first click anywhere, and surface a toast if playback
   ever actually fails instead of failing silently. */
let actx = null;
let audioUnlocked = false;
function getActx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  return actx;
}
function unlockAudio(){
  if(audioUnlocked) return;
  try{
    const ctx = getActx();
    if(ctx.state === 'suspended') ctx.resume();
    audioUnlocked = true;
  }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:true});
document.addEventListener('keydown', unlockAudio, {once:true});

function playSequence(notes){
  if(!state.settings.sfx) return false;
  try{
    const ctx = getActx();
    if(ctx.state === 'suspended') ctx.resume();
    notes.forEach(([freq, offset, dur, type, gain])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, ctx.currentTime + offset);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
      g.gain.exponentialRampToValueAtTime(gain||0.12, ctx.currentTime + offset + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + offset); o.stop(ctx.currentTime + offset + dur + 0.05);
    });
    return true;
  }catch(e){
    toast('Sound couldn\'t play — click anywhere on the page once, then try again.');
    return false;
  }
}
/* Quick perky blip — "here we go" cue for starting either timer */
function sfxStart(){ playSequence([[587.33,0,0.08,'sine',0.12],[880,0.08,0.13,'sine',0.14]]); }
/* Crisp double-beep — a focus sprint just ended */
function sfxWorkComplete(){ playSequence([[880,0,0.11,'triangle',0.15],[880,0.15,0.14,'triangle',0.15]]); }
/* Slow, mellow descending chime — signals break time, deliberately calming */
function sfxBreakStart(){ playSequence([[659.25,0,0.22,'sine',0.11],[523.25,0.2,0.26,'sine',0.11],[392,0.44,0.4,'sine',0.1]]); }
/* Bright ascending triad — break's over, back to focus */
function sfxBreakEnd(){ playSequence([[440,0,0.1,'sine',0.13],[523.25,0.1,0.1,'sine',0.13],[659.25,0.2,0.2,'sine',0.15]]); }
/* Soft single tick — confirms a stopwatch session was logged */
function sfxStopwatchStop(){ playSequence([[600,0,0.16,'sine',0.13]]); }
/* Four-note ascending fanfare — celebratory, for unlocking an achievement */
function sfxAchievement(){ playSequence([[523.25,0,0.1,'triangle',0.14],[659.25,0.09,0.1,'triangle',0.14],[783.99,0.18,0.1,'triangle',0.14],[1046.5,0.27,0.32,'triangle',0.17]]); }

/* ============ BACKGROUND MUSIC PLAYER (user's own library) ============ */
const musicAudio = new Audio();
musicAudio.loop = true;
musicAudio.volume = state.settings.music.volume;
let musicStatusText = 'No track selected yet — choose one, then press Play.';
let musicStatusError = false;
function setMusicStatus(text, isError){
  musicStatusText = text; musicStatusError = !!isError;
  const el = document.getElementById('musicStatus');
  if(el){ el.textContent = text; el.style.color = isError ? 'var(--danger)' : 'var(--text-muted)'; }
}
function handleMusicFile(file){
  if(!file) return;
  if(!file.type.startsWith('audio/')){ setMusicStatus('That file doesn\'t look like audio — pick an mp3, wav, m4a, or ogg file.', true); return; }
  setMusicStatus('Loading ' + file.name + '…', false);
  const reader = new FileReader();
  reader.onload = ()=>{
    musicAudio.pause();
    musicAudio.src = reader.result; // data: URL — more reliably permitted than blob: in sandboxed previews
    state.settings.music.fileName = file.name;
    save();
    playMusicNow();
  };
  reader.onerror = ()=>{ setMusicStatus('Could not read that file. Try a different track.', true); };
  reader.readAsDataURL(file);
}
function playMusicNow(){
  if(!musicAudio.src){ setMusicStatus('Choose a track first.', true); return; }
  musicAudio.play().then(()=>{
    setMusicStatus('Now playing: ' + state.settings.music.fileName, false);
    refreshMusicButton();
  }).catch(err=>{
    setMusicStatus('Playback blocked (' + (err.name||'error') + '). Press Play once more — this unlocks audio for the rest of the session.', true);
    refreshMusicButton();
  });
}
function pauseMusicNow(){ musicAudio.pause(); setMusicStatus('Paused.', false); refreshMusicButton(); }
function toggleMusicPlay(){ musicAudio.paused ? playMusicNow() : pauseMusicNow(); }
function refreshMusicButton(){
  const btn = document.getElementById('musicPlayBtn');
  if(!btn) return;
  btn.innerHTML = musicAudio.paused
    ? `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.play}</span>Play`
    : `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pause}</span>Pause`;
}
musicAudio.addEventListener('play', refreshMusicButton);
musicAudio.addEventListener('pause', refreshMusicButton);
musicAudio.addEventListener('error', ()=>{
  const codes = {1:'aborted',2:'network error',3:'could not decode this file — try a different format like mp3',4:'format not supported by this browser'};
  const err = musicAudio.error;
  setMusicStatus('Couldn\'t play that file' + (err? ' (' + (codes[err.code]||'unknown error') + ')' : '') + '.', true);
});
function setMusicAutoplay(on){
  state.settings.music.enabled = on; save();
}
function setMusicVolume(v){ state.settings.music.volume = v; musicAudio.volume = v; save(); }
function playMusicIfEnabled(){ if(state.settings.music.enabled && musicAudio.src) musicAudio.play().catch(()=>{}); }
function pauseMusic(){ musicAudio.pause(); }
function stopMusic(){ musicAudio.pause(); musicAudio.currentTime = 0; }
function musicPanelHtml(){
  const m = state.settings.music;
  return `<div class="card" style="margin-top:16px;">
    <h3 style="font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px;"><span class="nav-icon" style="width:16px;height:16px;">${ICONS.music}</span>Background Music Player</h3>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">Loop a track from your own device while you work. Nothing is uploaded — it's read straight from your files.</p>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn btn-sm" id="pickMusicBtn"><span class="nav-icon" style="width:14px;height:14px;">${ICONS.music}</span>Choose from library</button>
      <input type="file" id="musicFile" accept="audio/*" style="display:none;">
      <button class="btn btn-sm btn-primary" id="musicPlayBtn">
        <span class="nav-icon" style="width:14px;height:14px;">${musicAudio.paused?ICONS.play:ICONS.pause}</span>${musicAudio.paused?'Play':'Pause'}
      </button>
    </div>
    <p style="font-size:12px; margin-bottom:14px; color:${musicStatusError?'var(--danger)':'var(--text-muted)'};" id="musicStatus">${escapeHtml(m.fileName && !musicStatusError ? 'Track: '+m.fileName : musicStatusText)}</p>
    <div class="field" style="margin-bottom:12px;"><label>Volume</label><input type="range" id="musicVolume" min="0" max="1" step="0.05" value="${m.volume}"></div>
    <div class="row" style="justify-content:space-between;">
      <span style="font-size:13px;">Auto-play when I start a timer</span>
      <label class="switch"><input type="checkbox" id="musicAutoplay" ${m.enabled?'checked':''}><span class="slider"></span></label>
    </div>
  </div>`;
}
function wireMusicPanel(){
  document.getElementById('pickMusicBtn').addEventListener('click', ()=> document.getElementById('musicFile').click());
  document.getElementById('musicFile').addEventListener('change', e=>{ handleMusicFile(e.target.files[0]); e.target.value=''; });
  document.getElementById('musicPlayBtn').addEventListener('click', toggleMusicPlay);
  document.getElementById('musicVolume').addEventListener('input', e=> setMusicVolume(parseFloat(e.target.value)));
  document.getElementById('musicAutoplay').addEventListener('change', e=> setMusicAutoplay(e.target.checked));
}

/* ============ POMODORO ============ */
let pomo = {
  mode:'work', // work | break | longBreak
  remaining: state.settings.workMin*60,
  running:false, timerId:null, subjectId:'', sessionsDone:0
};
function pomoDuration(mode){
  if(mode==='work') return state.settings.workMin*60;
  if(mode==='break') return state.settings.breakMin*60;
  return state.settings.longBreakMin*60;
}
function renderPomodoro(main){
  main.innerHTML = `
    <div class="page-header"><div><h1>Pomodoro Timer</h1><p>Work in focused sprints, then rest.</p></div></div>
    <div class="grid grid-2">
      <div class="card timer-wrap">
        <div class="field" style="width:220px;">
          <label>Subject</label>
          <select id="pomoSubject">${subjectOptions(pomo.subjectId)}</select>
        </div>
        <div class="dial">
          <svg viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="88" fill="none" stroke="var(--bg-alt)" stroke-width="10"/>
            <circle id="pomoRing" cx="100" cy="100" r="88" fill="none" stroke="${pomo.mode==='work'?'var(--accent)':'var(--accent-2)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0"/>
          </svg>
          <div class="dial-center">
            <div class="dial-time mono" id="pomoTime">00:00</div>
            <div class="dial-mode" id="pomoMode">Focus</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="pomoStart">Start</button>
          <button class="btn" id="pomoReset">Reset</button>
          <button class="btn" id="pomoSkip">Skip</button>
        </div>
        <p style="font-size:12px; color:var(--text-muted);">Completed sprints today: <span class="mono" id="pomoDoneCount">${state.sessions.filter(s=>s.date===todayStr() && s.type==='pomodoro').length}</span></p>
      </div>
      <div class="card">
        <h3 style="font-size:16px; margin-bottom:14px;">Session Lengths</h3>
        <div class="field"><label>Focus (minutes)</label><input type="number" id="wLen" min="1" value="${state.settings.workMin}"></div>
        <div class="field"><label>Short Break (minutes)</label><input type="number" id="bLen" min="1" value="${state.settings.breakMin}"></div>
        <div class="field"><label>Long Break (minutes)</label><input type="number" id="lbLen" min="1" value="${state.settings.longBreakMin}"></div>
        <div class="field"><label>Sprints before long break</label><input type="number" id="sbl" min="1" value="${state.settings.sessionsBeforeLong}"></div>
        <button class="btn" id="saveLens">Save Lengths</button>
        <p style="font-size:12px; color:var(--text-muted); margin-top:14px;">Turn on notifications in Settings to get alerted when a sprint or break ends, even if this tab isn't focused.</p>
      </div>
    </div>
    ${musicPanelHtml()}`;
  wireMusicPanel();
  document.getElementById('pomoSubject').addEventListener('change', e=> pomo.subjectId = e.target.value);
  document.getElementById('pomoStart').addEventListener('click', togglePomo);
  document.getElementById('pomoReset').addEventListener('click', ()=>{ stopPomoInterval(); pomo.mode='work'; pomo.remaining=pomoDuration('work'); pomo.running=false; stopMusic(); updatePomoUI(); });
  document.getElementById('pomoSkip').addEventListener('click', ()=>completePomoCycle(true));
  document.getElementById('saveLens').addEventListener('click', ()=>{
    state.settings.workMin = Math.max(1, parseInt(document.getElementById('wLen').value)||25);
    state.settings.breakMin = Math.max(1, parseInt(document.getElementById('bLen').value)||5);
    state.settings.longBreakMin = Math.max(1, parseInt(document.getElementById('lbLen').value)||15);
    state.settings.sessionsBeforeLong = Math.max(1, parseInt(document.getElementById('sbl').value)||4);
    save();
    if(!pomo.running){ pomo.remaining = pomoDuration(pomo.mode); }
    updatePomoUI();
    toast('Session lengths saved');
  });
  if(pomo.remaining === undefined) pomo.remaining = pomoDuration('work');
  updatePomoUI();
}
function togglePomo(){
  pomo.running = !pomo.running;
  if(pomo.running){
    sfxStart();
    playMusicIfEnabled();
    pomo.timerId = setInterval(()=>{
      pomo.remaining--;
      if(pomo.remaining <= 0){ completePomoCycle(false); return; }
      updatePomoUI();
    },1000);
  } else { stopPomoInterval(); pauseMusic(); }
  updatePomoUI();
}
function stopPomoInterval(){ clearInterval(pomo.timerId); pomo.timerId=null; }
function completePomoCycle(skipped){
  stopPomoInterval();
  const wasWork = pomo.mode==='work';
  if(wasWork && !skipped){
    logSession(pomo.subjectId, state.settings.workMin, 'pomodoro');
    pomo.sessionsDone++;
    sfxWorkComplete();
    notifyUser('Focus sprint complete', 'Nice work — time for a break.');
  } else if(wasWork && skipped){
    pomo.sessionsDone++;
  }
  if(wasWork){
    pomo.mode = (pomo.sessionsDone % state.settings.sessionsBeforeLong === 0) ? 'longBreak' : 'break';
    if(!skipped) setTimeout(sfxBreakStart, 500);
  } else {
    pomo.mode = 'work';
    if(!skipped){ sfxBreakEnd(); notifyUser('Break over', 'Ready for another focus sprint?'); }
  }
  pomo.remaining = pomoDuration(pomo.mode);
  pomo.running = false;
  pauseMusic();
  updatePomoUI();
  if(currentPage==='pomodoro'){
    document.getElementById('pomoDoneCount').textContent = state.sessions.filter(s=>s.date===todayStr() && s.type==='pomodoro').length;
  }
}
function updatePomoUI(){
  if(currentPage!=='pomodoro') return;
  const t = document.getElementById('pomoTime'); if(!t) return;
  const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
  const s = (pomo.remaining%60).toString().padStart(2,'0');
  t.textContent = `${m}:${s}`;
  document.getElementById('pomoMode').textContent = pomo.mode==='work' ? 'Focus' : pomo.mode==='break' ? 'Short Break' : 'Long Break';
  document.getElementById('pomoStart').textContent = pomo.running ? 'Pause' : 'Start';
  const ring = document.getElementById('pomoRing');
  const total = pomoDuration(pomo.mode);
  const circumference = 553;
  const frac = 1 - (pomo.remaining/total);
  ring.setAttribute('stroke-dashoffset', (circumference*(1-frac)).toFixed(1));
  ring.setAttribute('stroke', pomo.mode==='work' ? 'var(--accent)' : 'var(--accent-2)');
  document.title = pomo.running ? `${t.textContent} · Ledger` : 'Ledger — Study Tracker';
}

/* ============ STOPWATCH ============ */
let sw = { running:false, startedAt:0, elapsed:0, timerId:null, subjectId:'' };
function renderStopwatch(main){
  main.innerHTML = `
    <div class="page-header"><div><h1>Stopwatch</h1><p>For open-ended study sessions.</p></div></div>
    <div class="card timer-wrap" style="max-width:420px;">
      <div class="field" style="width:220px;">
        <label>Subject</label>
        <select id="swSubject">${subjectOptions(sw.subjectId)}</select>
      </div>
      <div class="dial-time mono" id="swTime" style="font-size:52px;">00:00:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="swStart">Start</button>
        <button class="btn" id="swStop">Log &amp; Reset</button>
      </div>
    </div>
    ${musicPanelHtml()}`;
  wireMusicPanel();
  document.getElementById('swSubject').addEventListener('change', e=> sw.subjectId = e.target.value);
  document.getElementById('swStart').addEventListener('click', toggleSw);
  document.getElementById('swStop').addEventListener('click', ()=>{
    const mins = sw.elapsed/60000;
    if(mins > 0.05) { logSession(sw.subjectId, mins, 'stopwatch'); sfxStopwatchStop(); toast('Session logged: '+fmtMin(mins)); }
    clearInterval(sw.timerId); sw.timerId=null; sw.running=false; sw.elapsed=0;
    stopMusic();
    updateSwUI();
  });
  updateSwUI();
}
function toggleSw(){
  if(!sw.running){
    sw.running = true; sw.startedAt = Date.now() - sw.elapsed;
    sfxStart();
    playMusicIfEnabled();
    sw.timerId = setInterval(()=>{ sw.elapsed = Date.now()-sw.startedAt; updateSwUI(); },500);
  } else {
    sw.running = false; clearInterval(sw.timerId); sw.timerId=null;
    pauseMusic();
  }
  updateSwUI();
}
function updateSwUI(){
  if(currentPage!=='stopwatch') return;
  const el = document.getElementById('swTime'); if(!el) return;
  const totalSec = Math.floor(sw.elapsed/1000);
  const h = Math.floor(totalSec/3600).toString().padStart(2,'0');
  const m = Math.floor((totalSec%3600)/60).toString().padStart(2,'0');
  const s = (totalSec%60).toString().padStart(2,'0');
  el.textContent = `${h}:${m}:${s}`;
  document.getElementById('swStart').textContent = sw.running ? 'Pause' : 'Start';
}

/* ============ HEATMAP ============ */
function buildHeatmapGrid(days){
  const wrap = document.createElement('div');
  const grid = document.createElement('div');
  grid.className = 'heatmap';
  const today = new Date();
  const cells = [];
  let max = 1;
  for(let i=days-1;i>=0;i--){
    const d = new Date(today); d.setDate(today.getDate()-i);
    const ds = todayStr(d);
    const mins = minutesOnDate(ds);
    max = Math.max(max, mins);
    cells.push({ds, mins});
  }
  cells.forEach(c=>{
    const cell = document.createElement('div');
    cell.className = 'heat-cell';
    cell.title = `${c.ds}: ${fmtMin(c.mins)}`;
    let level = 0;
    if(c.mins>0) level = 1;
    if(c.mins >= max*0.33) level = 2;
    if(c.mins >= max*0.66) level = 3;
    if(c.mins >= max*0.9) level = 4;
    const opacities = [0, 0.28, 0.52, 0.75, 1];
    cell.style.background = level===0 ? 'var(--bg-alt)' : `color-mix(in srgb, var(--accent) ${opacities[level]*100}%, var(--bg-alt))`;
    grid.appendChild(cell);
  });
  wrap.appendChild(grid);
  return wrap;
}
function renderHeatmap(main){
  main.innerHTML = `<div class="page-header"><div><h1>Heatmap</h1><p>Your study consistency over the last 26 weeks.</p></div></div>
  <div class="card">
    <div id="fullHeatmap" style="overflow-x:auto;"></div>
    <div class="heat-legend">Less
      <span class="heat-cell" style="background:var(--bg-alt)"></span>
      <span class="heat-cell" style="background:color-mix(in srgb, var(--accent) 28%, var(--bg-alt))"></span>
      <span class="heat-cell" style="background:color-mix(in srgb, var(--accent) 52%, var(--bg-alt))"></span>
      <span class="heat-cell" style="background:color-mix(in srgb, var(--accent) 75%, var(--bg-alt))"></span>
      <span class="heat-cell" style="background:var(--accent)"></span>
    More</div>
  </div>
  <div class="grid grid-3" style="margin-top:16px;">
    <div class="card stat"><span class="label">Current Streak</span><span class="value">${currentStreak()}d</span></div>
    <div class="card stat"><span class="label">Active Days (26wk)</span><span class="value">${last182ActiveDays()}</span></div>
    <div class="card stat"><span class="label">Total Logged</span><span class="value">${fmtMin(totalMinutesAll())}</span></div>

function last182ActiveDays(){
  const today = new Date(); let count=0;
  for(let i=0;i<182;i++){ const d=new Date(today); d.setDate(today.getDate()-i); if(minutesOnDate(todayStr(d))>0) count++; }
  return count;
}

/* ============ NOTES ============ */
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(0) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}
function dataUrlToBlob(dataUrl){
  const [header, base64] = dataUrl.split(',');
  const mime = (header.match(/data:(.*?);base64/)||[])[1] || 'application/octet-stream';
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}
function openAttachment(att){
  try{
    const blob = dataUrlToBlob(att.dataUrl);
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank', 'noopener');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }catch(e){ toast('Could not open this file.'); }
}
function downloadAttachment(att){
  try{
    const blob = dataUrlToBlob(att.dataUrl);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = att.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 30000);
  }catch(e){ toast('Could not download this file.'); }
}
/* Smart attachment viewer: images get a fit/zoom lightbox, PDFs render inline via the
   browser's native PDF viewer (full scroll/zoom/search/print for free) with prev/next
   through a note's other attachments and a fallback if inline preview isn't supported. */
let viewerState = {list:[], index:0, zoomed:false, onClose:null};
function openAttachmentViewer(list, index, onClose){
  viewerState = {list, index, zoomed:false, onClose: onClose || null};
  renderAttachmentViewer();
}
function closeAttachmentViewer(){
  if(viewerState.onClose) viewerState.onClose();
  else closeModal();
}
function renderAttachmentViewer(){
  const {list, index, zoomed} = viewerState;
  const att = list[index];
  const isImg = att.type.startsWith('image/');
  const isPdf = att.type === 'application/pdf';
  const multi = list.length > 1;
  openModal(`
    <button class="close-x" id="closeM">×</button>
    <div class="row" style="justify-content:space-between; margin-bottom:14px; padding-right:26px;">
      <h3 style="font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(att.name)}</h3>
      ${multi? `<span class="badge" style="flex-shrink:0;">${index+1} / ${list.length}</span>`:''}
    </div>
    <div id="viewerBody"></div>
    <div class="modal-actions" style="margin-top:16px; flex-wrap:wrap;">
      ${multi? `<button class="btn btn-sm" id="prevAtt" ${index===0?'disabled':''}>‹ Prev</button><button class="btn btn-sm" id="nextAtt" ${index===list.length-1?'disabled':''}>Next ›</button>`:''}
      <div style="flex:1;"></div>
      ${isImg? `<button class="btn btn-sm" id="zoomBtn">${zoomed?'Zoom Out':'Zoom In'}</button>`:''}
      <button class="btn btn-sm" id="openNewTab">Open in New Tab</button>
      <button class="btn btn-sm btn-primary" id="downloadAtt">Download</button>
    </div>
  `, {large:true});
  const body = document.getElementById('viewerBody');
  if(isImg){
    body.innerHTML = `<div style="max-height:62vh; overflow:auto; text-align:center; background:var(--bg-alt); border-radius:8px; padding:10px;">
      <img src="${att.dataUrl}" id="viewerImg" style="${zoomed? 'max-width:none; cursor:zoom-out;' : 'max-width:100%; max-height:58vh; cursor:zoom-in;'} border-radius:6px;">
    </div>`;
    document.getElementById('viewerImg').addEventListener('click', ()=>{ viewerState.zoomed = !viewerState.zoomed; renderAttachmentViewer(); });
  } else if(isPdf){
    const blob = dataUrlToBlob(att.dataUrl);
    const url = URL.createObjectURL(blob);
    body.innerHTML = `<iframe src="${url}" class="pdf-frame" title="${escapeHtml(att.name)}"></iframe>
      <p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Scroll, zoom, and search using your browser's built-in PDF controls. If nothing shows above, use "Open in New Tab" instead.</p>`;
  } else {
    body.innerHTML = `<div class="empty"><h3>No preview available</h3><p>Use Download or Open in New Tab.</p></div>`;
  }
  document.getElementById('closeM').addEventListener('click', closeAttachmentViewer);
  if(multi){
    const prevBtn = document.getElementById('prevAtt'), nextBtn = document.getElementById('nextAtt');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(viewerState.index>0){ viewerState.index--; viewerState.zoomed=false; renderAttachmentViewer(); } });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ if(viewerState.index<list.length-1){ viewerState.index++; viewerState.zoomed=false; renderAttachmentViewer(); } });
  }
  const zoomBtn = document.getElementById('zoomBtn');
  if(zoomBtn) zoomBtn.addEventListener('click', ()=>{ viewerState.zoomed = !viewerState.zoomed; renderAttachmentViewer(); });
  document.getElementById('openNewTab').addEventListener('click', ()=> openAttachment(att));
  document.getElementById('downloadAtt').addEventListener('click', ()=> downloadAttachment(att));
}

function attachListHtml(list, removable){
  if(removable === undefined) removable = true;
  if(!list.length) return `<p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">No files attached.</p>`;
  return `<div class="attach-list">${list.map(a=>{
    const removeBtn = removable ? `<button class="attach-remove" data-remove="${a.id}" title="Remove">✕</button>` : '';
    if(a.type.startsWith('image/')){
      return `<div class="attach-chip"><img class="attach-thumb" src="${a.dataUrl}" data-view="${a.id}" title="${escapeHtml(a.name)}">${removeBtn}<div class="attach-name">${escapeHtml(a.name)}</div></div>`;
    }
    return `<div class="attach-chip"><div class="attach-file" data-view="${a.id}" title="${escapeHtml(a.name)}"><span class="nav-icon">${ICONS.file}</span></div>${removeBtn}<div class="attach-name">${escapeHtml(a.name)}</div></div>`;
  }).join('')}</div>`;
}
function openNoteEditor(id){
  const n = id ? state.notes.find(x=>x.id===id) : {id:uid(), title:'', body:'', subjectId:'', updatedAt:new Date().toISOString(), attachments:[]};
  const isNew = !id;
  // Draft mirrors the form fields live, so previewing an attachment and coming back
  // never loses in-progress typing.
  const draft = { title:n.title, subjectId:n.subjectId, body:n.body, attachments:(n.attachments||[]).slice() };

  function renderEditorModal(){
    openModal(`
      <button class="close-x" id="closeM">×</button>
      <h3>${isNew?'New Note':'Edit Note'}</h3>
      <div class="field"><label>Title</label><input type="text" id="nTitle" value="${escapeHtml(draft.title)}" placeholder="Note title"></div>
      <div class="field"><label>Subject</label><select id="nSubject">${subjectOptions(draft.subjectId)}</select></div>
      <div class="field"><label>Content</label><textarea id="nBody" placeholder="Write your notes...">${escapeHtml(draft.body)}</textarea></div>
      <div class="field">
        <label>Attachments</label>
        <div id="attachListWrap">${attachListHtml(draft.attachments)}</div>
        <button class="btn btn-sm" id="addAttachBtn"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.attach}</span>Add PDF or image</button>
        <input type="file" id="attachInput" accept="image/*,application/pdf" multiple style="display:none;">
        <p style="font-size:11px; color:var(--text-muted); margin-top:8px;">Stored right in this note, up to 4MB per file. Large files eat into your browser's storage quota, so keep it light.</p>
      </div>
      <div class="modal-actions">
        ${!isNew? '<button class="btn btn-danger" id="delM" style="margin-right:auto;">Delete</button>':''}
        <button class="btn" id="cancelM">Cancel</button>
        <button class="btn btn-primary" id="saveM">Save Note</button>
      </div>
    `);
    document.getElementById('nTitle').addEventListener('input', e=> draft.title = e.target.value);
    document.getElementById('nSubject').addEventListener('change', e=> draft.subjectId = e.target.value);
    document.getElementById('nBody').addEventListener('input', e=> draft.body = e.target.value);
    function refreshAttachList(){
      document.getElementById('attachListWrap').innerHTML = attachListHtml(draft.attachments);
      wireAttachList();
    }
    function wireAttachList(){
      document.querySelectorAll('[data-view]').forEach(el=> el.addEventListener('click', ()=>{
        const i = draft.attachments.findIndex(a=>a.id===el.dataset.view);
        if(i>-1) openAttachmentViewer(draft.attachments, i, renderEditorModal);
      }));
      document.querySelectorAll('[data-remove]').forEach(el=> el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        draft.attachments = draft.attachments.filter(a=>a.id!==el.dataset.remove);
        refreshAttachList();
      }));
    }
    wireAttachList();
    document.getElementById('addAttachBtn').addEventListener('click', ()=> document.getElementById('attachInput').click());
    document.getElementById('attachInput').addEventListener('change', (e)=>{
      const files = Array.from(e.target.files||[]);
      e.target.value = '';
      files.forEach(file=>{
        const isImg = file.type.startsWith('image/');
        const isPdf = file.type === 'application/pdf';
        if(!isImg && !isPdf){ toast(file.name + ' isn\'t a supported type (images or PDF only)'); return; }
        if(file.size > MAX_ATTACH_BYTES){ toast(file.name + ' is too large (max 4MB)'); return; }
        const reader = new FileReader();
        reader.onload = ()=>{
          draft.attachments.push({id:uid(), name:file.name, type:file.type, dataUrl:reader.result});
          refreshAttachList();
        };
        reader.onerror = ()=>{ toast('Could not read ' + file.name); };
        reader.readAsDataURL(file);
      });
    });
    document.getElementById('closeM').addEventListener('click', closeModal);
    document.getElementById('cancelM').addEventListener('click', closeModal);
    if(!isNew) document.getElementById('delM').addEventListener('click', ()=>{
      confirmAction('Delete this note? This cannot be undone.', ()=>{
        state.notes = state.notes.filter(x=>x.id!==n.id); save(); renderMain();
      });
    });
    document.getElementById('saveM').addEventListener('click', ()=>{
      n.title = draft.title.trim();
      n.subjectId = draft.subjectId;
      n.body = draft.body;
      n.attachments = draft.attachments;
      n.updatedAt = new Date().toISOString();
      if(isNew) state.notes.push(n);
      const ok = save();
      if(!ok){
        if(isNew) state.notes = state.notes.filter(x=>x.id!==n.id);
        return; // leave modal open so they can remove an attachment and retry
      }
      closeModal(); renderMain(); checkAchievements();
    });
  }
  renderEditorModal();
}

  <div class="grid grid-3" style="margin-bottom:16px;">
    <div class="card stat"><span class="label">Total Time</span><span class="value">${fmtMin(totalMinutesAll())}</span></div>
    <div class="card stat"><span class="label">Sessions Logged</span><span class="value">${state.sessions.length}</span></div>
    <div class="card stat"><span class="label">Avg Session</span><span class="value">${fmtMin(state.sessions.length? totalMinutesAll()/state.sessions.length:0)}</span></div>
  </div>
  <div class="card">
    <h3 style="font-size:16px; margin-bottom:16px;">Time by Subject</h3>
    <div id="donutWrap"></div>
  </div>`;
  const wrap = document.getElementById('donutWrap');
  const data = state.subjects.map(s=>({name:s.name, color:s.color, mins:totalMinutesForSubject(s.id)})).filter(d=>d.mins>0);
  const unassigned = state.sessions.filter(s=>!s.subjectId || !subjectById(s.subjectId)).reduce((a,s)=>a+s.minutes,0);
  if(unassigned>0) data.push({name:'Unassigned', color:'#8A9086', mins:unassigned});
  if(data.length===0){
    wrap.innerHTML = `<div class="empty"><h3>No data yet</h3><p>Log a Pomodoro or stopwatch session to see the breakdown.</p></div>`;
    return;
  }
  const total = data.reduce((a,d)=>a+d.mins,0);
  let acc = 0;
  const stops = data.map(d=>{
    const start = acc/total*360; acc += d.mins; const end = acc/total*360;
    return `${d.color} ${start}deg ${end}deg`;
  }).join(', ');
  wrap.innerHTML = `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops});"></div>
    <div class="legend">${data.map(d=>`<div class="legend-item"><span class="swatch" style="background:${d.color}"></span>${escapeHtml(d.name)}<span class="pct">${Math.round(d.mins/total*100)}%</span></div>`).join('')}</div>
  </div>`;
}

/* ============ ACHIEVEMENTS ============ */
const ACHIEVEMENTS = [
  {id:'first_session', title:'First Steps', desc:'Log your first study session', check: s=> s.sessions.length>=1},
  {id:'five_pomos', title:'Focused Five', desc:'Complete 5 Pomodoro sprints', check: s=> s.sessions.filter(x=>x.type==='pomodoro').length>=5},
  {id:'twentyfive_pomos', title:'In The Zone', desc:'Complete 25 Pomodoro sprints', check: s=> s.sessions.filter(x=>x.type==='pomodoro').length>=25},
  {id:'ten_hours', title:'Ten Hour Club', desc:'Log 10 hours of total study time', check: s=> totalMinutesAll()>=600},
  {id:'three_streak', title:'Building Momentum', desc:'Reach a 3-day streak', check: s=> currentStreak()>=3},
  {id:'week_streak', title:'Week Warrior', desc:'Reach a 7-day streak', check: s=> currentStreak()>=7},
  {id:'first_subject', title:'Getting Organized', desc:'Add your first subject', check: s=> s.subjects.length>=1},
  {id:'first_note', title:'Note Taker', desc:'Write your first note', check: s=> s.notes.length>=5 || s.notes.length>=1},
  {id:'chapter_complete', title:'Chapter Closed', desc:'Finish every chapter in a subject', check: s=> s.subjects.some(sub=> sub.chapters.length>0 && sub.chapters.every(c=>c.done))},
  {id:'five_subjects', title:'Renaissance Scholar', desc:'Track 5 different subjects', check: s=> s.subjects.length>=5},
];
function checkAchievements(){
  let changed = false;
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievementsUnlocked.includes(a.id) && a.check(state)){
      state.achievementsUnlocked.push(a.id); changed = true;
      sfxAchievement();
      if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
        try{ new Notification('Achievement unlocked', {body:a.title}); }catch(e){}
      }
      toast('Achievement unlocked: '+a.title);
    }
  });
  if(changed) save();
}
function renderAchievements(main){
  main.innerHTML = `<div class="page-header"><div><h1>Achievements</h1><p>${state.achievementsUnlocked.length} of ${ACHIEVEMENTS.length} unlocked.</p></div></div>
  <div class="grid grid-4" id="achGrid"></div>`;
  document.getElementById('achGrid').innerHTML = ACHIEVEMENTS.map(a=>{
    const unlocked = state.achievementsUnlocked.includes(a.id);
    return `<div class="card ach-card ${unlocked?'unlocked':'locked'}">
      <div class="icon">${unlocked?'✓':'?'}</div>
      <h4>${escapeHtml(a.title)}</h4>
      <p>${escapeHtml(a.desc)}</p>
    </div>`;
  }).join('');
}

/* ============ PROFILE ============ */
function renderProfile(main){
  const totalSubjects = state.subjects.length;
  const totalHours = (totalMinutesAll()/60).toFixed(1);
  const longestStreak = currentStreak();
  main.innerHTML = `<div class="page-header"><div><h1>Profile</h1></div></div>
  <div class="card" style="margin-bottom:16px;">
    <div class="row" style="gap:18px;">
      <div class="avatar">${escapeHtml((state.profile.name||'S')[0].toUpperCase())}</div>
      <div style="flex:1;">
        <div class="field" style="margin-bottom:8px;"><label>Display Name</label><input type="text" id="profName" value="${escapeHtml(state.profile.name)}"></div>
        <p style="font-size:12px; color:var(--text-muted);">Member since ${state.profile.createdAt}</p>
      </div>
      <button class="btn btn-primary" id="saveProf">Save</button>
    </div>
  </div>
  <div class="grid grid-4">
    <div class="card stat"><span class="label">Subjects</span><span class="value">${totalSubjects}</span></div>
    <div class="card stat"><span class="label">Total Hours</span><span class="value">${totalHours}</span></div>
    <div class="card stat"><span class="label">Notes Written</span><span class="value">${state.notes.length}</span></div>
    <div class="card stat"><span class="label">Achievements</span><span class="value">${state.achievementsUnlocked.length}/${ACHIEVEMENTS.length}</span></div>
  </div>`;
  document.getElementById('saveProf').addEventListener('click', ()=>{
    state.profile.name = document.getElementById('profName').value.trim() || 'Student';
    save(); renderNav(); renderMain(); toast('Profile updated');
  });
}

/* ============ SETTINGS ============ */
function renderSettings(main){
  main.innerHTML = `<div class="page-header"><div><h1>Settings</h1></div></div>
  <div class="grid grid-2">
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:14px;">Appearance</h3>
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:14px;">Dark mode</span>
        <label class="switch"><input type="checkbox" id="darkSwitch" ${state.settings.darkMode?'checked':''}><span class="slider"></span></label>
      </div>
      <h3 style="font-size:15px; margin:20px 0 14px;">Notifications</h3>
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:14px;">Local notifications for timers</span>
        <label class="switch"><input type="checkbox" id="notifSwitch" ${state.settings.notifications?'checked':''}><span class="slider"></span></label>
      </div>
      <p style="font-size:12px; color:var(--text-muted);" id="notifStatus"></p>
      <h3 style="font-size:15px; margin:20px 0 14px;">Sound</h3>
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <span style="font-size:14px;">Sound effects (start, finish, break, achievements)</span>
        <label class="switch"><input type="checkbox" id="sfxSwitch" ${state.settings.sfx?'checked':''}><span class="slider"></span></label>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">These are short tones generated on the spot — no files, no internet needed. Tap any button below to hear it right now.</p>
      <div style="display:flex; flex-wrap:wrap; gap:8px;">
        <button class="btn btn-sm" id="testStart"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.speaker}</span>Timer start</button>
        <button class="btn btn-sm" id="testFinish"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.speaker}</span>Timer finish</button>
        <button class="btn btn-sm" id="testBreak"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.speaker}</span>Break time</button>
        <button class="btn btn-sm" id="testResume"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.speaker}</span>Back to focus</button>
        <button class="btn btn-sm" id="testAch"><span class="nav-icon" style="width:13px;height:13px;">${ICONS.speaker}</span>Achievement</button>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:12px;">Background music you load on the Pomodoro or Stopwatch pages is separate and unaffected by this toggle.</p>
    </div>
    <div class="card">
      <h3 style="font-size:15px; margin-bottom:14px;">Your Data</h3>
      <p style="font-size:13px; color:var(--text-muted); margin-bottom:14px;">Everything is stored only in this browser — nothing leaves your device.</p>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn" id="exportBtn">Export Data (.json)</button>
        <button class="btn" id="importBtn">Import Data</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
      </div>
      <button class="btn btn-danger" id="resetBtn">Reset All Data</button>
    </div>
  </div>`;
  document.getElementById('darkSwitch').addEventListener('change', e=>{ setDarkMode(e.target.checked); });
  document.getElementById('notifSwitch').addEventListener('change', async e=>{
    if(e.target.checked){
      const granted = await requestNotifPermission();
      state.settings.notifications = granted;
      e.target.checked = granted;
    } else {
      state.settings.notifications = false;
    }
    save(); updateNotifStatus();
  });
  updateNotifStatus();
  document.getElementById('sfxSwitch').addEventListener('change', e=>{ state.settings.sfx = e.target.checked; save(); if(e.target.checked) sfxStart(); });
  const testSound = (fn)=>{ const wasOn = state.settings.sfx; state.settings.sfx = true; fn(); state.settings.sfx = wasOn; };
  document.getElementById('testStart').addEventListener('click', ()=>testSound(sfxStart));
  document.getElementById('testFinish').addEventListener('click', ()=>testSound(sfxWorkComplete));
  document.getElementById('testBreak').addEventListener('click', ()=>testSound(sfxBreakStart));
  document.getElementById('testResume').addEventListener('click', ()=>testSound(sfxBreakEnd));
  document.getElementById('testAch').addEventListener('click', ()=>testSound(sfxAchievement));
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', importData);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    confirmAction('This will permanently delete all subjects, sessions, notes, and settings stored in this browser. Continue?', ()=>{
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      applyTheme(); renderNav(); renderMain();
      toast('All data reset');
    }, 'Reset everything');
  });
}
function updateNotifStatus(){
  const el = document.getElementById('notifStatus'); if(!el) return;
  if(!('Notification' in window)){ el.textContent = 'Notifications are not supported in this browser.'; return; }
  el.textContent = 'Browser permission: ' + Notification.permission;
}
async function requestNotifPermission(){
  if(!('Notification' in window)) { toast('Notifications not supported in this browser'); return false; }
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied'){ toast('Notifications are blocked in your browser settings'); return false; }
  const perm = await Notification.requestPermission();
  return perm === 'granted';
}
function notifyUser(title, body){
  if(state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    try{ new Notification(title, {body}); }catch(e){}
  }
  toast(title+' — '+body);
}
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ledger-study-data.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      state = mergeState(parsed);
      save(); applyTheme(); renderNav(); renderMain();
      toast('Data imported');
    }catch(err){ toast('Invalid file'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ============ THEME ============ */
function setDarkMode(on){
  state.settings.darkMode = on;
  save(); applyTheme();
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.darkMode ? 'dark':'light');
  document.getElementById('darkToggleLabel').textContent = state.settings.darkMode ? 'Light mode' : 'Dark mode';
  document.getElementById('darkToggleIcon').innerHTML = state.settings.darkMode ? ICONS.sun : ICONS.moon;
}
document.getElementById('darkToggleBtn').addEventListener('click', ()=> setDarkMode(!state.settings.darkMode));

/* ============ INIT ============ */
applyTheme();
renderNav();
renderMain();
checkAchievements();
</script>
</body>
</html>
