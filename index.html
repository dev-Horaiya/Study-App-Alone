<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studium — Study Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2EC; --bg-alt:#EAE7DD; --surface:#FFFFFF; --surface-2:#F7F5EF;
  --text:#241F16; --text-muted:#6B6455; --border:#E1DCCD;
  --accent:#3F7F6F; --accent-soft:#3F7F6F1a; --accent-2:#B4893A; --accent-2-soft:#B4893A22;
  --danger:#B2503A; --danger-soft:#B2503A1a;
  --shadow:0 1px 2px rgba(30,25,15,0.05), 0 2px 8px rgba(30,25,15,0.05);
  --shadow-hover:0 1px 2px rgba(30,25,15,0.06), 0 6px 16px rgba(30,25,15,0.07);
  --card-bg:#FFFFFF; --card-border:#E5E0D2;
  --illo-opacity:0; --vignette-color:rgba(30,25,15,0.04);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#14150F; --bg-alt:#191B13; --surface:#211F17; --surface-2:#282619;
  --text:#F1EDE0; --text-muted:#9C9A8A; --border:#332F22;
  --accent:#4C8F7E; --accent-soft:#4C8F7E22; --accent-2:#E3B34D; --accent-2-soft:#E3B34D26;
  --danger:#D9765C; --danger-soft:#D9765C22;
  --shadow:0 1px 2px rgba(0,0,0,0.3), 0 3px 10px rgba(0,0,0,0.25);
  --shadow-hover:0 1px 3px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.32);
  --card-bg:#211F17; --card-border:#332F22;
  --illo-opacity:0.55; --vignette-color:rgba(0,0,0,0.45);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; transition:background .3s ease, color .3s ease;
}
h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }
.mono{ font-family:'IBM Plex Mono',monospace; }
button{ font-family:'Inter',sans-serif; cursor:pointer; }
input,select,textarea{ font-family:'Inter',sans-serif; }
a{ color:var(--accent); }

/* Ambient background — a quiet "desk at night" atmosphere: a lamp, a stack of books
   with glasses, and a plant sprig tucked into the corners, plus a soft vignette. All
   fixed, pointer-events:none, and confined to the margins outside the card grid so they
   never sit under text. Only visible in dark mode — a lamp-lit desk is a night idea. */
.ambient-bg{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
.ambient-bg .vignette{ position:absolute; inset:0; background:radial-gradient(circle at 50% 34%, transparent 0%, transparent 58%, var(--vignette-color) 100%); }
.ambient-bg .illo{ position:absolute; opacity:var(--illo-opacity); transition:opacity .4s ease; }
.ambient-bg .illo-lamp{ left:-18px; bottom:-14px; width:230px; height:auto; }
.ambient-bg .illo-books{ right:-14px; bottom:-10px; width:210px; height:auto; }
.ambient-bg .illo-plant{ right:-10px; top:-14px; width:150px; height:auto; }
@media (max-width:900px){
  .ambient-bg .illo-lamp{ width:150px; }
  .ambient-bg .illo-books{ width:140px; }
  .ambient-bg .illo-plant{ width:100px; }
}
@media (max-width:760px){ .ambient-bg .illo{ display:none; } } /* keep phones light — fewer painted layers */

/* Smooth, subtle page transition — content settles in on every navigation, nothing showy */
@keyframes pageFadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
.page-fade-in{ animation:pageFadeIn .28s ease; }
@media (prefers-reduced-motion: reduce){ .page-fade-in{ animation:none; } }

/* Layout */
.app{ display:flex; min-height:100vh; }
.sidebar{
  width:220px; flex-shrink:0; background:var(--card-bg); border-right:1px solid var(--card-border);
  display:flex; flex-direction:column; padding:24px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{ padding:6px 10px 20px 10px; }
.brand .mark{ font-family:'Fraunces',serif; font-size:22px; font-weight:700; display:flex; align-items:center; gap:8px; }
.brand-mark-icon{ width:22px; height:22px; color:var(--accent); flex-shrink:0; }
.mobile-topbar-title{ display:flex; align-items:center; gap:7px; }
.mobile-topbar-title .brand-mark-icon{ width:19px; height:19px; }
.brand .sub{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.nav-btn{
  display:flex; align-items:center; gap:10px; border:none; background:none; text-align:left;
  padding:9px 12px; border-radius:8px; color:var(--text-muted); font-size:14px; font-weight:500;
  transition:background .15s ease, color .15s ease;
}
.nav-btn .nav-icon{ width:18px; height:18px; flex-shrink:0; color:var(--text-muted); transition:color .15s ease; }
.nav-btn .nav-icon svg{ width:100%; height:100%; display:block; }
.nav-btn:hover{ background:var(--surface-2); color:var(--text); }
.nav-btn:hover .nav-icon{ color:var(--text); }
.nav-btn.active{ background:var(--accent-soft); color:var(--text); font-weight:600; }
.nav-btn.active .nav-icon{ color:var(--accent); }
.icon-btn .nav-icon, .icon-btn svg{ width:15px; height:15px; display:block; }
.icon-btn{ display:inline-flex; align-items:center; justify-content:center; }
.btn svg{ width:14px; height:14px; }
.btn-icon-inline{ display:inline-flex; align-items:center; gap:6px; }
.sidebar-foot{ padding-top:10px; border-top:1px solid var(--border); margin-top:10px; }

.main{ flex:1; min-width:0; padding:36px 44px 84px; }
.page-header{ margin-bottom:28px; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.page-header h1{ font-size:28px; }
.page-header p{ color:var(--text-muted); font-size:14px; margin-top:4px; }

.card{
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px;
  box-shadow:var(--shadow); transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.card:hover{ transform:translateY(-1px); box-shadow:var(--shadow-hover); border-color:var(--accent-soft); }
.grid{ display:grid; gap:18px; }
.grid-2{ grid-template-columns:1fr 1fr; }
.grid-3{ grid-template-columns:repeat(3,1fr); }
.grid-4{ grid-template-columns:repeat(4,1fr); }
@media (max-width:900px){ .grid-2,.grid-3,.grid-4{ grid-template-columns:1fr; } .main{padding:20px;} .sidebar{width:180px;} }

/* Mobile nav: sidebar becomes an off-canvas drawer under a hamburger menu, and the
   Pomodoro dial shrinks so it never overflows a narrow screen. */
.mobile-topbar{ display:none; }
.hamburger-btn{ display:none; }
.sidebar-backdrop{ display:none; }
@media (max-width:760px){
  .mobile-topbar{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--card-bg); border-bottom:1px solid var(--card-border);
    position:sticky; top:0; z-index:55;
  }
  .hamburger-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px;
    border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); flex-shrink:0;
  }
  .hamburger-btn svg{ width:18px; height:18px; }
  .mobile-topbar-title{ font-family:'Fraunces',serif; font-weight:700; font-size:17px; }
  .app{ display:block; }
  .sidebar{
    position:fixed; top:0; left:0; height:100vh; width:240px; max-width:80vw;
    transform:translateX(-100%); transition:transform .25s cubic-bezier(.4,0,.2,1);
    z-index:70;
  }
  .sidebar.open{ transform:translateX(0); box-shadow:12px 0 32px rgba(0,0,0,.28); }
  .sidebar-backdrop.open{ display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:65; animation:fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .main{ padding:16px; }
}
@media (max-width:480px){
  .dial{ width:230px; height:230px; }
  .dial-time{ font-size:36px; }
  .timer-controls{ flex-wrap:wrap; justify-content:center; }
  .timer-controls .btn{ min-width:0; padding:9px 14px; font-size:12.5px; }
  .sw-time-display{ font-size:34px !important; }
  .grid-4{ grid-template-columns:repeat(2,1fr); }
}

.stat{ display:flex; flex-direction:column; gap:7px; }
.stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); font-weight:600; }
.stat .value{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--text); letter-spacing:-0.01em; }

.btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600; transition:all .15s ease;}
.btn:hover{ border-color:var(--accent); }
.btn-primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-primary:hover{ opacity:.9; }
.btn-danger{ background:var(--danger-soft); color:var(--danger); border-color:transparent; }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn-icon{ padding:6px 9px; }
input[type=text], input[type=number], input[type=url], textarea, select{
  width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); font-size:14px;
}
textarea{ resize:vertical; min-height:100px; font-family:'Inter',sans-serif; }
label{ font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; display:block; margin-bottom:6px;}
.field{ margin-bottom:14px; }
.row{ display:flex; gap:10px; align-items:center; }
.progress-track{ height:8px; border-radius:5px; background:var(--bg-alt); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:5px; transition:width .3s ease; }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 9px; border-radius:20px; background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
.empty{ text-align:center; padding:40px 20px; color:var(--text-muted); }
.empty h3{ color:var(--text); margin-bottom:6px; }

/* Toggle switch */
.switch{ position:relative; width:42px; height:24px; flex-shrink:0; }
.switch input{ opacity:0; width:0; height:0; }
.slider{ position:absolute; inset:0; background:var(--bg-alt); border-radius:20px; cursor:pointer; transition:.2s; border:1px solid var(--border);}
.slider:before{ content:""; position:absolute; height:16px; width:16px; left:3px; top:3px; background:var(--surface); border-radius:50%; transition:.2s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.switch input:checked + .slider{ background:var(--accent); border-color:var(--accent);}
.switch input:checked + .slider:before{ transform:translateX(18px); background:#fff; }

/* Dashboard */
.hero-card{ background:linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%); }
.subject-chip{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); }
.swatch{ width:10px; height:10px; border-radius:3px; flex-shrink:0; }

/* Pomodoro — given visual prominence: a larger dial, a bolder digit face, and a quiet
   static halo behind the ring. No motion here — this is the one element that should
   read as "the point of the screen" the instant you land on the page. */
.timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:28px 0 20px; }
.dial{ position:relative; width:288px; height:288px; }
.dial::before{
  content:""; position:absolute; inset:-18px; border-radius:50%;
  background:radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  z-index:-1;
}
.dial svg{ transform:rotate(-90deg); width:100%; height:100%; }
.dial-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.dial-time{ font-family:'IBM Plex Mono',monospace; font-size:50px; font-weight:600; letter-spacing:-0.01em; }
.sw-time-display{ font-size:52px; }
.dial-mode{ font-size:12px; text-transform:uppercase; letter-spacing:.14em; color:var(--text-muted); margin-top:6px; font-weight:600; }
.timer-controls{ display:flex; gap:10px; }
.timer-controls .btn{ min-width:90px; }

/* Heatmap */
.heatmap-wrap{ display:inline-block; overflow-x:auto; max-width:100%; padding-bottom:2px; }
.heatmap-months{ display:grid; gap:3px; margin-left:29px; margin-bottom:4px; }
.heatmap-months span{ font-size:10px; color:var(--text-muted); width:12px; }
.heatmap-body{ display:flex; gap:6px; }
.heatmap-daylabels{ display:grid; grid-template-rows:repeat(7,12px); gap:3px; flex-shrink:0; width:26px; }
.heatmap-daylabels span{ font-size:9px; color:var(--text-muted); line-height:12px; height:12px; width:100%; text-align:right; }
.heatmap{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px; }
.heat-cell{ width:12px; height:12px; border-radius:3px; background:var(--bg-alt); }
.heat-cell-empty{ background:transparent !important; }
.heat-legend{ display:flex; align-items:center; gap:4px; margin-top:10px; font-size:11px; color:var(--text-muted); }

/* Notes */
.notes-list{ display:flex; flex-direction:column; gap:10px; }
.note-item{ padding:14px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); cursor:pointer; }
.note-item h4{ font-size:14px; margin-bottom:4px; font-family:'Inter',sans-serif; font-weight:600;}
.note-item p{ font-size:12px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.note-item .meta{ font-size:10px; color:var(--text-muted); margin-top:6px; text-transform:uppercase; letter-spacing:.05em;}
.note-attach-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; color:var(--text-muted); margin-top:6px; }
.note-attach-badge svg{ width:11px; height:11px; }
.attach-list{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; margin-bottom:4px; }
.attach-chip{ position:relative; width:72px; }
.attach-thumb{ width:72px; height:72px; border-radius:8px; object-fit:cover; border:1px solid var(--border); display:block; background:var(--surface-2); cursor:pointer; }
.attach-file{ width:72px; height:72px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--text-muted); cursor:pointer; }
.attach-file .nav-icon{ width:20px; height:20px; }
.attach-name{ font-size:9.5px; text-align:center; margin-top:4px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attach-remove{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }

/* Sticky note — to-do list + daily target, for Pomodoro & Stopwatch */
.sticky-note{
  position:relative; margin-top:16px; padding:24px 22px 20px;
  background:linear-gradient(135deg, #FFF6C6 0%, #FFEA96 100%);
  color:#4A3A0B; border-radius:3px 3px 22px 3px;
  transform:rotate(-1.1deg);
  box-shadow:0 12px 22px -8px rgba(60,45,0,.35), 0 3px 8px rgba(60,45,0,.18);
  transition:transform .3s cubic-bezier(.34,1.4,.64,1), box-shadow .3s ease;
  font-family:'Kalam',cursive;
  animation:stickyDrop .4s cubic-bezier(.34,1.4,.64,1);
}
[data-theme="dark"] .sticky-note{
  background:linear-gradient(135deg, #4E3F0E 0%, #3D3208 100%);
  color:#F3E3A0;
  box-shadow:0 12px 22px -8px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.35);
}
.sticky-note:hover{ transform:rotate(0deg) translateY(-2px) scale(1.008); box-shadow:0 18px 30px -10px rgba(60,45,0,.4), 0 4px 10px rgba(60,45,0,.2); }
[data-theme="dark"] .sticky-note:hover{ box-shadow:0 18px 30px -10px rgba(0,0,0,.6), 0 4px 10px rgba(0,0,0,.4); }
.sticky-note::before{ content:""; position:absolute; right:0; bottom:0; width:0; height:0; border-style:solid; border-width:0 0 24px 24px; border-color:transparent transparent rgba(0,0,0,.14) transparent; border-radius:0 0 22px 0; }
.sticky-note::after{ content:""; position:absolute; top:-11px; left:50%; transform:translateX(-50%) rotate(-3deg); width:50px; height:20px; background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.65); box-shadow:0 3px 5px rgba(0,0,0,.18); border-radius:1px; }
[data-theme="dark"] .sticky-note::after{ background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.22); }
@keyframes stickyDrop{ from{ opacity:0; transform:rotate(-1.1deg) translateY(-14px) scale(.97);} to{ opacity:1; transform:rotate(-1.1deg) translateY(0) scale(1);} }
.sticky-title{ font-family:'Kalam',cursive; font-weight:700; font-size:19px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.sticky-title svg{ width:18px; height:18px; }
.sticky-target-row{ display:flex; align-items:center; gap:6px; font-size:14px; margin-bottom:8px; flex-wrap:wrap; }
.sticky-input{ background:rgba(255,255,255,.4); border:none; border-bottom:2px solid rgba(0,0,0,.25); border-radius:2px; padding:3px 6px; font-family:'Kalam',cursive; font-size:14px; color:inherit; }
[data-theme="dark"] .sticky-input{ background:rgba(0,0,0,.2); border-bottom-color:rgba(255,255,255,.3); }
.sticky-target-hrs{ width:52px; text-align:center; }
.sticky-progress-track{ height:9px; border-radius:6px; background:rgba(0,0,0,.14); overflow:hidden; margin-bottom:14px; }
[data-theme="dark"] .sticky-progress-track{ background:rgba(0,0,0,.35); }
.sticky-progress-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,#E08A1E,#F2B33D); transition:width .5s cubic-bezier(.34,1.4,.64,1); }
.sticky-todo{ display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px dashed rgba(0,0,0,.18); animation:stickyItemIn .22s ease; }
[data-theme="dark"] .sticky-todo{ border-bottom-color:rgba(255,255,255,.2); }
@keyframes stickyItemIn{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:translateX(0);} }
.sticky-todo.removing{ animation:stickyItemOut .18s ease forwards; }
@keyframes stickyItemOut{ to{ opacity:0; transform:translateX(12px) scale(.9); height:0; padding:0; margin:0; border:none;} }
.sticky-todo input[type=checkbox]{ width:17px; height:17px; accent-color:#B4790A; flex-shrink:0; cursor:pointer; }
.sticky-todo span{ flex:1; font-size:15.5px; transition:opacity .2s ease; }
.sticky-todo span.done{ text-decoration:line-through; opacity:.5; }
.sticky-todo button{ background:none; border:none; color:inherit; opacity:.45; font-size:13px; cursor:pointer; padding:2px 4px; transition:opacity .15s ease, transform .15s ease; }
.sticky-todo button:hover{ opacity:1; transform:scale(1.15); }
.sticky-add-row{ display:flex; gap:8px; margin-top:12px; }
.sticky-add-row input{ flex:1; background:rgba(255,255,255,.4); border:none; border-bottom:2px solid rgba(0,0,0,.25); border-radius:2px; font-family:'Kalam',cursive; font-size:14.5px; color:inherit; padding:5px 7px; }
[data-theme="dark"] .sticky-add-row input{ background:rgba(0,0,0,.2); border-bottom-color:rgba(255,255,255,.3); }
.sticky-add-row button{ background:rgba(255,255,255,.45); border:1px solid rgba(0,0,0,.15); color:inherit; font-family:'Kalam',cursive; font-weight:700; border-radius:6px; padding:6px 14px; cursor:pointer; transition:transform .15s ease, background .15s ease; }
.sticky-add-row button:hover{ transform:translateY(-1px); background:rgba(255,255,255,.65); }
[data-theme="dark"] .sticky-add-row button{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.2); }
[data-theme="dark"] .sticky-add-row button:hover{ background:rgba(255,255,255,.2); }
.sticky-empty{ font-size:13.5px; opacity:.65; padding:6px 0; }

/* Floating mini sticky note — appears top-left only while a focus sprint or the
   stopwatch is actively running, so it's there when you need it and gone when you don't. */
.floating-sticky{ position:fixed; top:16px; left:16px; z-index:60; display:none; }
.floating-sticky.show{ display:block; animation:floatIn .3s cubic-bezier(.34,1.4,.64,1); }
@keyframes floatIn{ from{ opacity:0; transform:translateY(-10px) scale(.95);} to{ opacity:1; transform:translateY(0) scale(1);} }
.sticky-pill{
  display:flex; align-items:center; gap:8px; border:none; cursor:pointer;
  background:linear-gradient(135deg, #FFF6C6, #FFEA96); color:#4A3A0B;
  border-radius:999px; padding:9px 16px 9px 12px;
  font-family:'Kalam',cursive; font-size:14px; font-weight:700;
  box-shadow:0 8px 18px -6px rgba(60,45,0,.4), 0 2px 6px rgba(60,45,0,.2);
  transition:transform .2s cubic-bezier(.34,1.4,.64,1), box-shadow .2s ease;
}
[data-theme="dark"] .sticky-pill{ background:linear-gradient(135deg,#4E3F0E,#3D3208); color:#F3E3A0; box-shadow:0 8px 18px -6px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4); }
.sticky-pill:hover{ transform:translateY(-2px) scale(1.04); box-shadow:0 12px 22px -6px rgba(60,45,0,.45), 0 3px 8px rgba(60,45,0,.25); }
[data-theme="dark"] .sticky-pill:hover{ box-shadow:0 12px 22px -6px rgba(0,0,0,.65), 0 3px 8px rgba(0,0,0,.45); }
.sticky-pill-pct{ font-variant-numeric:tabular-nums; }
.sticky-pill-todo{ font-size:11px; opacity:.75; font-family:'Inter',sans-serif; font-weight:600; background:rgba(0,0,0,.08); padding:2px 8px; border-radius:20px; }
[data-theme="dark"] .sticky-pill-todo{ background:rgba(255,255,255,.14); }
.sticky-note.sticky-float{ width:280px; margin-top:0; animation:none; transform:rotate(-.6deg); cursor:default; }
.sticky-note.sticky-float:hover{ transform:rotate(-.6deg) translateY(-1px); }
.sticky-float-close{
  position:absolute; top:10px; right:12px; background:rgba(0,0,0,.1); border:none; color:inherit;
  width:22px; height:22px; border-radius:50%; font-size:15px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s ease, transform .15s ease;
}
.sticky-float-close:hover{ background:rgba(0,0,0,.2); transform:scale(1.1); }
[data-theme="dark"] .sticky-float-close{ background:rgba(255,255,255,.14); }
[data-theme="dark"] .sticky-float-close:hover{ background:rgba(255,255,255,.24); }

/* Achievements */
.ach-card{ text-align:center; padding:22px 14px; }
.ach-card .icon{ width:46px; height:46px; border-radius:50%; margin:0 auto 12px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:20px; font-weight:700; }
.ach-card.locked .icon{ background:var(--bg-alt); color:var(--text-muted); }
.ach-card.unlocked .icon{ background:var(--accent-2-soft); color:var(--accent-2); }
.ach-card.locked{ opacity:.5; }
.custom-goal{ transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; }
.custom-goal:hover{ transform:translateY(-2px); box-shadow:var(--shadow), 0 6px 14px rgba(0,0,0,.08); }
.custom-goal.locked:hover{ opacity:.75; }
.ach-card h4{ font-size:13px; margin-bottom:4px; }
.ach-card p{ font-size:11px; color:var(--text-muted); }

/* Donut */
.donut-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
.donut{ width:180px; height:180px; border-radius:50%; flex-shrink:0; }
.legend{ display:flex; flex-direction:column; gap:8px; }
.legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
.legend-item .swatch{ width:10px; height:10px; border-radius:3px; }
.legend-item .pct{ margin-left:auto; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; font-size:12px; }

/* Modal */
.overlay{ position:fixed; inset:0; background:rgba(10,14,11,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
.overlay.open{ display:flex; }
.modal{ background:var(--card-bg); border-radius:12px; padding:24px; width:100%; max-width:440px; border:1px solid var(--card-border); max-height:85vh; overflow-y:auto; transition:max-width .15s ease; box-shadow:var(--shadow-hover);}
.modal.modal-lg{ max-width:820px; }
.pdf-frame{ width:100%; height:64vh; border:1px solid var(--border); border-radius:8px; background:#fff; display:block; }
.modal h3{ margin-bottom:16px; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
.close-x{ float:right; background:none; border:none; color:var(--text-muted); font-size:20px; line-height:1; }

.chapter-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
.chapter-row:last-child{ border-bottom:none; }
.chapter-row input[type=checkbox]{ width:16px; height:16px; accent-color:var(--accent); }
.chapter-row span{ flex:1; font-size:14px; }
.chapter-row span.done{ text-decoration:line-through; color:var(--text-muted); }
.chapter-row a{ flex:1; font-size:14px; color:inherit; text-decoration:none; }
.chapter-row a:hover{ text-decoration:underline; }
.chapter-row a.done{ text-decoration:line-through; color:var(--text-muted); }
.subject-chapters-toggle{ display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--text-muted); padding:9px 0 3px; border-top:1px solid var(--border); margin-top:10px; user-select:none; transition:color .15s ease; }
.subject-chapters-toggle:hover{ color:var(--text); }
.chevron-icon{ width:14px; height:14px; flex-shrink:0; transition:transform .2s ease; }
.chevron-icon.open{ transform:rotate(180deg); }
.subject-chapters-panel{ margin-top:8px; animation:panelDrop .2s ease; }
@keyframes panelDrop{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:translateY(0);} }

.subject-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.icon-btn{ background:none; border:none; color:var(--text-muted); padding:4px; border-radius:6px; }
.icon-btn:hover{ background:var(--bg-alt); color:var(--text); }

.avatar{ width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:24px; font-weight:700; flex-shrink:0;}
.toast{ position:fixed; bottom:24px; right:24px; background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:8px; padding:12px 18px; font-size:13px; z-index:100; opacity:0; transform:translateY(10px); transition:all .25s ease; pointer-events:none;}
.toast.show{ opacity:1; transform:translateY(0); }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
input[type=range]{ width:100%; accent-color:var(--accent); height:20px; padding:0; background:none; }
</style>
</head>

<script>
/* ============ STATE ============ */
const STORAGE_KEY = 'studiumStudyTrackerData';
const LEGACY_STORAGE_KEYS = ['ledgerStudyTrackerData']; // pre-rename key — migrated automatically on load
const SUBJECT_COLORS = ['#4FB6A8','#B7A279','#7B92D9','#C4735C','#5E9E9C','#9A87C4','#7FA867','#B98D6A'];

/* Hand-picked line-icon set, drawn to match Studium's editorial/analog feel:
   thin uniform stroke, rounded joins, no fills — reads like ink on a page. */
const ISVG = (inner)=> `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const ICONS = {
  dashboard: ISVG(`<rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="4.5" rx="1.5"/><rect x="13" y="10" width="7.5" height="10.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/>`),
  pomodoro: ISVG(`<circle cx="12" cy="13" r="8"/><path d="M12 13V8.5"/><path d="M9 3.5h6"/><path d="M17.2 6.3l1.3-1.3"/>`),
  stopwatch: ISVG(`<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5"/><path d="M9.5 3.5h5"/><path d="M12 3.5V5.5"/>`),
  subjects: ISVG(`<path d="M6 3.5h11a1 1 0 0 1 1 1V21l-6.5-3.6L4.5 21V5a1.5 1.5 0 0 1 1.5-1.5Z"/>`),
  chapters: ISVG(`<path d="M4.5 6.5h1.5M4.5 12h1.5M4.5 17.5h1.5"/><path d="M9 6.5h10.5M9 12h10.5M9 17.5h10.5"/>`),
  heatmap: ISVG(`<rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="16" y="3.5" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="16" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="3.5" y="16" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="16" width="4.5" height="4.5" rx="1"/><rect x="16" y="16" width="4.5" height="4.5" rx="1"/>`),
  notes: ISVG(`<path d="M6 3.5h9l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M15 3.5V8h4.5"/><path d="M8 12.5h8M8 16h5.5"/>`),
  analytics: ISVG(`<path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12Z"/><path d="M15.5 3.9A8.5 8.5 0 0 1 20.1 8.5H12Z"/>`),
  achievements: ISVG(`<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5 7 20.5l5-2.3 5 2.3-1.5-7"/>`),
  profile: ISVG(`<circle cx="12" cy="8.5" r="3.5"/><path d="M4.5 20c1-3.8 4-5.8 7.5-5.8s6.5 2 7.5 5.8"/>`),
  settings: ISVG(`<circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.7 6.3l-1.6 1.6M7.9 16.1l-1.6 1.6M17.7 17.7l-1.6-1.6M7.9 7.9 6.3 6.3"/>`),
  sun: ISVG(`<circle cx="12" cy="12" r="4"/><path d="M12 3v2.3M12 18.7V21M21 12h-2.3M5.3 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/>`),
  moon: ISVG(`<path d="M20 14.3A8.5 8.5 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3Z"/>`),
  edit: ISVG(`<path d="M14.5 4.5l5 5L8 21H3.5v-4.5Z"/>`),
  trash: ISVG(`<path d="M4.5 7h15"/><path d="M9 7V5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5v2"/><path d="M6.5 7 7.3 19a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10.3 11v6M13.7 11v6"/>`),
  play: ISVG(`<circle cx="12" cy="12" r="8.5"/><path d="M10 8.5 15.5 12 10 15.5Z"/>`),
  warning: ISVG(`<path d="M12 3.5 21.5 20h-19Z"/><path d="M12 9.5v5"/><path d="M12 17.3v.2"/>`),
  plus: ISVG(`<path d="M12 5v14M5 12h14"/>`),
  music: ISVG(`<path d="M9 17.5V4.5l10.5-2V15"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17" cy="15" r="2.5"/>`),
  pause: ISVG(`<rect x="6" y="4.5" width="4.5" height="15" rx="1"/><rect x="13.5" y="4.5" width="4.5" height="15" rx="1"/>`),
  speaker: ISVG(`<path d="M4 9.5h3.5L13 5v14L7.5 14.5H4Z"/><path d="M16.5 9a4.2 4.2 0 0 1 0 6"/><path d="M19 6.7a8 8 0 0 1 0 10.6"/>`),
  attach: ISVG(`<path d="M8 12.2V6.8a3.2 3.2 0 0 1 6.4 0V15a4.7 4.7 0 0 1-9.4 0V8"/>`),
  file: ISVG(`<path d="M6 3.5h9l4.5 4.5V19a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 19V5A1.5 1.5 0 0 1 6 3.5Z"/><path d="M15 3.5V8h4.5"/>`),
  image: ISVG(`<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17.5l5-5 3.5 3.5L17 11l3.5 4.5"/>`),
  pin: ISVG(`<path d="M12 3.5v6M8.5 9.5h7l1.5 3H7Z"/><path d="M12 12.5V20.5"/>`),
  pip: ISVG(`<rect x="3.5" y="4.5" width="17" height="14" rx="2"/><rect x="12.5" y="12" width="6.5" height="4.7" rx="1" fill="currentColor" stroke="none"/>`),
  logo: ISVG(`<path d="M12 6.3c-2.2-1.6-5.3-2.1-8.3-1.1v11.4c3-1 6.1-.5 8.3 1.1c2.2-1.6 5.3-2.1 8.3-1.1V5.2c-3-1-6.1-.5-8.3 1.1Z"/><path d="M12 6.3v11.4"/>`),
  chevron: ISVG(`<path d="M6 9l6 6 6-6"/>`),
  link: ISVG(`<path d="M9.5 14.5l5-5"/><path d="M8 12.3 6.2 14.1a3 3 0 0 0 4.2 4.2l1.8-1.8"/><path d="M16 11.7l1.8-1.8a3 3 0 0 0-4.2-4.2l-1.8 1.8"/>`),
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(d=new Date()){ return d.toISOString().slice(0,10); }

function defaultState(){
  return {
    profile:{ name:'Student', createdAt: todayStr() },
    settings:{ darkMode:false, workMin:25, breakMin:5, longBreakMin:15, sessionsBeforeLong:4, notifications:false, sfx:true,
      music:{ enabled:false, volume:0.5, fileName:'' } },
    subjects:[],
    sessions:[], // {id, subjectId, minutes, date, type}
    notes:[], // {id, subjectId, title, body, updatedAt}
    achievementsUnlocked:[],
    pomodoroCount:0,
    sticky:{ targetHours:2, todos:[] }, // {id, text, done}
    customAchievements:[] // {id, title, desc, metric, target, unlocked, unlockedAt}
  };
}
let state = load();
function mergeState(parsed){
  const def = defaultState();
  const merged = Object.assign(def, parsed);
  merged.profile = Object.assign(def.profile, parsed.profile||{});
  merged.settings = Object.assign(def.settings, parsed.settings||{});
  merged.settings.music = Object.assign({enabled:false, volume:0.5, fileName:''}, (parsed.settings&&parsed.settings.music)||{});
  merged.sticky = Object.assign({targetHours:2, todos:[]}, parsed.sticky||{});
  return merged;
}
function load(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      // Migrate data saved under the app's old name so nobody loses their history.
      for(const legacyKey of LEGACY_STORAGE_KEYS){
        const legacyRaw = localStorage.getItem(legacyKey);
        if(legacyRaw){ raw = legacyRaw; localStorage.setItem(STORAGE_KEY, raw); break; }
      }
    }
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return mergeState(parsed);
  }catch(e){ return defaultState(); }
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    toast('Storage is full — try removing an attachment or a large note.');
    return false;
  }
}

/* ============ NAV ============ */
const PAGES = [
  {id:'dashboard', label:'Dashboard'},
  {id:'pomodoro', label:'Pomodoro Timer'},
  {id:'stopwatch', label:'Stopwatch'},
  {id:'subjects', label:'Subject Tracker'},
  {id:'chapters', label:'Chapter Progress'},
  {id:'heatmap', label:'Heatmap'},
  {id:'notes', label:'Notes'},
  {id:'analytics', label:'Analytics'},
  {id:'achievements', label:'Achievements'},
  {id:'profile', label:'Profile'},
  {id:'settings', label:'Settings'},
];
let currentPage = 'dashboard';
let expandedChapterSubjects = new Set(); // which subject cards have their chapter panel open (Subject Tracker page)

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map(p => `<button class="nav-btn ${p.id===currentPage?'active':''}" data-page="${p.id}"><span class="nav-icon">${ICONS[p.id]}</span>${p.label}</button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentPage = btn.dataset.page; renderNav(); renderMain(); toggleMobileSidebar(false); });
  });
}
function toggleMobileSidebar(force){
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebarBackdrop');
  if(!sidebar || !backdrop) return;
  const open = force !== undefined ? force : !sidebar.classList.contains('open');
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('hamburgerBtn').addEventListener('click', ()=> toggleMobileSidebar());
document.getElementById('sidebarBackdrop').addEventListener('click', ()=> toggleMobileSidebar(false));

function renderMain(){
  const main = document.getElementById('main');
  const renderers = {
    dashboard: renderDashboard, pomodoro: renderPomodoro, stopwatch: renderStopwatch,
    subjects: renderSubjects, chapters: renderChapters, heatmap: renderHeatmap,
    notes: renderNotes, analytics: renderAnalytics, achievements: renderAchievements,
    profile: renderProfile, settings: renderSettings
  };
  main.innerHTML = '';
  renderers[currentPage](main);
  // Purely cosmetic: a gentle fade-and-settle on every page swap. Restart the animation
  // by removing the class, forcing reflow, then re-adding it.
  main.classList.remove('page-fade-in');
  void main.offsetWidth;
  main.classList.add('page-fade-in');
}

/* ============ HELPERS ============ */
function subjectById(id){ return state.subjects.find(s=>s.id===id); }
function fmtMin(mins){
  mins = Math.round(mins);
  if(mins < 60) return mins + 'm';
  const h = Math.floor(mins/60), m = mins%60;
  return h + 'h ' + (m? m+'m':'');
}
function totalMinutesForSubject(id){
  return state.sessions.filter(s=>s.subjectId===id).reduce((a,s)=>a+s.minutes,0);
}
function totalMinutesAll(){ return state.sessions.reduce((a,s)=>a+s.minutes,0); }
function minutesOnDate(dateStr){
  return state.sessions.filter(s=>s.date===dateStr).reduce((a,s)=>a+s.minutes,0);
}
function currentStreak(){
  let streak = 0;
  let d = new Date();
  while(true){
    const ds = todayStr(d);
    const mins = minutesOnDate(ds);
    if(mins > 0){ streak++; d.setDate(d.getDate()-1); }
    else{
      if(ds === todayStr()) { d.setDate(d.getDate()-1); continue; } // allow today to be empty still counting streak from yesterday
      break;
    }
  }
  return streak;
}
function logSession(subjectId, minutes, type){
  if(minutes <= 0) return;
  state.sessions.push({id:uid(), subjectId: subjectId||null, minutes, date: todayStr(), type});
  if(type==='pomodoro') state.pomodoroCount++;
  save();
  checkAchievements();
}

/* ============ SOUND ENGINE ============ */
/* All SFX are synthesized locally via Web Audio — no external audio files, so everything
   still works fully offline. Browsers only allow audio to start from a direct click, so we
   unlock the context on the very first click anywhere, and surface a toast if playback
   ever actually fails instead of failing silently. */
let actx = null;
let audioUnlocked = false;
function getActx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  return actx;
}
function unlockAudio(){
  if(audioUnlocked) return;
  try{
    const ctx = getActx();
    if(ctx.state === 'suspended') ctx.resume();
    audioUnlocked = true;
  }catch(e){}
}
document.addEventListener('click', unlockAudio, {once:true});
document.addEventListener('keydown', unlockAudio, {once:true});

function playSequence(notes){
  if(!state.settings.sfx) return false;
  try{
    const ctx = getActx();
    if(ctx.state === 'suspended') ctx.resume();
    notes.forEach(([freq, offset, dur, type, gain])=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, ctx.currentTime + offset);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
      g.gain.exponentialRampToValueAtTime(gain||0.12, ctx.currentTime + offset + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + offset); o.stop(ctx.currentTime + offset + dur + 0.05);
    });
    return true;
  }catch(e){
    toast('Sound couldn\'t play — click anywhere on the page once, then try again.');
    return false;
  }
}
/* Quick perky blip — "here we go" cue for starting either timer */
function sfxStart(){ playSequence([[587.33,0,0.08,'sine',0.12],[880,0.08,0.13,'sine',0.14]]); }
/* Crisp double-beep — a focus sprint just ended */
function sfxWorkComplete(){ playSequence([[880,0,0.11,'triangle',0.15],[880,0.15,0.14,'triangle',0.15]]); }
/* Slow, mellow descending chime — signals break time, deliberately calming */
function sfxBreakStart(){ playSequence([[659.25,0,0.22,'sine',0.11],[523.25,0.2,0.26,'sine',0.11],[392,0.44,0.4,'sine',0.1]]); }
/* Bright ascending triad — break's over, back to focus */
function sfxBreakEnd(){ playSequence([[440,0,0.1,'sine',0.13],[523.25,0.1,0.1,'sine',0.13],[659.25,0.2,0.2,'sine',0.15]]); }
/* Soft single tick — confirms a stopwatch session was logged */
function sfxStopwatchStop(){ playSequence([[600,0,0.16,'sine',0.13]]); }
/* Four-note ascending fanfare — celebratory, for unlocking an achievement */
function sfxAchievement(){ playSequence([[523.25,0,0.1,'triangle',0.14],[659.25,0.09,0.1,'triangle',0.14],[783.99,0.18,0.1,'triangle',0.14],[1046.5,0.27,0.32,'triangle',0.17]]); }

/* ============ BACKGROUND MUSIC PLAYER (user's own library) ============ */
const musicAudio = new Audio();
musicAudio.loop = true;
musicAudio.volume = state.settings.music.volume;
let musicStatusText = 'No track selected yet — choose one, then press Play.';
let musicStatusError = false;
function setMusicStatus(text, isError){
  musicStatusText = text; musicStatusError = !!isError;
  const el = document.getElementById('musicStatus');
  if(el){ el.textContent = text; el.style.color = isError ? 'var(--danger)' : 'var(--text-muted)'; }
}
function handleMusicFile(file){
  if(!file) return;
  if(!file.type.startsWith('audio/')){ setMusicStatus('That file doesn\'t look like audio — pick an mp3, wav, m4a, or ogg file.', true); return; }
  setMusicStatus('Loading ' + file.name + '…', false);
  const reader = new FileReader();
  reader.onload = ()=>{
    musicAudio.pause();
    musicAudio.src = reader.result; // data: URL — more reliably permitted than blob: in sandboxed previews
    state.settings.music.fileName = file.name;
    save();
    playMusicNow();
  };
  reader.onerror = ()=>{ setMusicStatus('Could not read that file. Try a different track.', true); };
  reader.readAsDataURL(file);
}
function playMusicNow(){
  if(!musicAudio.src){ setMusicStatus('Choose a track first.', true); return; }
  musicAudio.play().then(()=>{
    setMusicStatus('Now playing: ' + state.settings.music.fileName, false);
    refreshMusicButton();
  }).catch(err=>{
    setMusicStatus('Playback blocked (' + (err.name||'error') + '). Press Play once more — this unlocks audio for the rest of the session.', true);
    refreshMusicButton();
  });
}
function pauseMusicNow(){ musicAudio.pause(); setMusicStatus('Paused.', false); refreshMusicButton(); }
function toggleMusicPlay(){ musicAudio.paused ? playMusicNow() : pauseMusicNow(); }
function refreshMusicButton(){
  const btn = document.getElementById('musicPlayBtn');
  if(!btn) return;
  btn.innerHTML = musicAudio.paused
    ? `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.play}</span>Play`
    : `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pause}</span>Pause`;
}
musicAudio.addEventListener('play', refreshMusicButton);
musicAudio.addEventListener('pause', refreshMusicButton);
musicAudio.addEventListener('error', ()=>{
  const codes = {1:'aborted',2:'network error',3:'could not decode this file — try a different format like mp3',4:'format not supported by this browser'};
  const err = musicAudio.error;
  setMusicStatus('Couldn\'t play that file' + (err? ' (' + (codes[err.code]||'unknown error') + ')' : '') + '.', true);
});
function setMusicAutoplay(on){
  state.settings.music.enabled = on; save();
}
function setMusicVolume(v){ state.settings.music.volume = v; musicAudio.volume = v; save(); }
function playMusicIfEnabled(){ if(state.settings.music.enabled && musicAudio.src) musicAudio.play().catch(()=>{}); }
function pauseMusic(){ musicAudio.pause(); }
function stopMusic(){ musicAudio.pause(); musicAudio.currentTime = 0; }
function musicPanelHtml(){

/* ============ STICKY NOTE (to-do list + daily target) ============ */
/* Shared by the embedded card on Pomodoro/Stopwatch AND the floating mini widget —
   every id takes an optional suffix so both can exist in the DOM at once without clashing. */

/* Study minutes "today" = what's actually been logged, PLUS whatever is ticking right
   now in an active work sprint or stopwatch — otherwise the sticky note only jumps once
   a session finishes instead of moving while you watch. */
function liveTodayMinutes(){
  let mins = minutesOnDate(todayStr());
  if(pomo.running && pomo.mode==='work') mins += (state.settings.workMin*60 - pomo.remaining)/60;
  if(sw.running) mins += sw.elapsed/60000;
  return mins;
}
function stickyProgressPct(){
  const s = state.sticky;
  const targetMins = Math.max(0, s.targetHours) * 60;
  const todayMins = liveTodayMinutes();
  return targetMins > 0 ? Math.min(100, Math.round(todayMins/targetMins*100)) : 0;
}
function updateStickyDom(suffix){
  const fill = document.getElementById('stickyProgressFill'+suffix);
  const text = document.getElementById('stickyTodayText'+suffix);
  if(!fill && !text) return;
  const s = state.sticky;
  const todayMins = liveTodayMinutes();
  const pct = stickyProgressPct();
  if(fill) fill.style.width = pct + '%';
  if(text) text.textContent = `${fmtMin(todayMins)} of ${s.targetHours}h today${pct>=100?' — done! 🎉':''}`;
}
function stickyNoteInnerHtml(suffix){
  const s = state.sticky;
  const todayMins = liveTodayMinutes();
  const pct = stickyProgressPct();
  return `
    <div class="sticky-title"><span class="nav-icon" style="width:18px;height:18px;">${ICONS.pin}</span>Today's Focus</div>
    <div class="sticky-target-row">
      <span>Target</span>
      <input type="number" id="stickyTarget${suffix}" class="sticky-input sticky-target-hrs" min="0" step="0.5" value="${s.targetHours}">
      <span>hrs</span>
      <span style="margin-left:auto; font-size:12.5px; opacity:.75;" id="stickyTodayText${suffix}">${fmtMin(todayMins)} of ${s.targetHours}h today${pct>=100?' — done! 🎉':''}</span>
    </div>
    <div class="sticky-progress-track"><div class="sticky-progress-fill" id="stickyProgressFill${suffix}" style="width:${pct}%;"></div></div>
    <div id="stickyTodos${suffix}">
      ${s.todos.length ? s.todos.map(t=>`<div class="sticky-todo" data-row="${t.id}">
        <input type="checkbox" data-toggle="${t.id}" ${t.done?'checked':''}>
        <span class="${t.done?'done':''}">${escapeHtml(t.text)}</span>
        <button data-remove="${t.id}" title="Remove">✕</button>
      </div>`).join('') : '<p class="sticky-empty">Nothing on the list yet — what are you tackling today?</p>'}
    </div>
    <div class="sticky-add-row">
      <input type="text" id="stickyNewTodo${suffix}" placeholder="Add a to-do…">
      <button id="stickyAddBtn${suffix}">Add</button>
    </div>`;
}
function stickyNoteHtml(suffix){
  return `<div class="sticky-note">${stickyNoteInnerHtml(suffix||'')}</div>`;
}
function wireStickyNote(suffix){
  suffix = suffix || '';
  const $ = id => document.getElementById(id+suffix);
  const targetInput = $('stickyTarget');
  if(targetInput) targetInput.addEventListener('change', e=>{
    state.sticky.targetHours = Math.max(0, parseFloat(e.target.value)||0);
    save(); refreshAllStickyNotes();
  });
  const todosWrap = $('stickyTodos');
  if(todosWrap){
    todosWrap.querySelectorAll('[data-toggle]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const t = state.sticky.todos.find(x=>x.id===cb.dataset.toggle);
        if(t){ t.done = cb.checked; save(); }
        const span = cb.nextElementSibling;
        if(span) span.classList.toggle('done', cb.checked);
      });
    });
    todosWrap.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = btn.closest('.sticky-todo');
        if(row) row.classList.add('removing');
        setTimeout(()=>{
          state.sticky.todos = state.sticky.todos.filter(x=>x.id!==btn.dataset.remove);
          save(); refreshAllStickyNotes();
        }, 190);
      });
    });
  }
  const addTodo = ()=>{
    const input = $('stickyNewTodo');
    if(!input) return;
    const text = input.value.trim();
    if(!text) return;
    state.sticky.todos.push({id:uid(), text, done:false});
    save(); input.value='';
    refreshAllStickyNotes();
    setTimeout(()=>{ const el = $('stickyNewTodo'); if(el) el.focus(); }, 0);
  };
  const addBtn = $('stickyAddBtn');
  if(addBtn) addBtn.addEventListener('click', addTodo);
  const newTodoInput = $('stickyNewTodo');
  if(newTodoInput) newTodoInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTodo(); } });
}
/* Refreshes whichever sticky note instance(s) are currently on screen — the embedded
   card and/or the floating widget — after any edit, so they never fall out of sync. */
function refreshAllStickyNotes(){
  const wrap = document.getElementById('stickyNoteWrap');
  if(wrap){ wrap.innerHTML = stickyNoteHtml(''); wireStickyNote(''); }
  renderFloatingSticky();
}

/* ---- Floating mini widget: shows top-left only while a focus sprint or the
   stopwatch is running, minimized to a small pill by default. Click it to expand
   and configure (target hours, to-dos); click again to tuck it back away. ---- */
let floatingStickyExpanded = false;
let floatingStickyWasVisible = false;
function shouldShowFloatingSticky(){
  return (pomo.running && pomo.mode==='work') || sw.running;
}
function renderFloatingSticky(){
  const el = document.getElementById('floatingSticky');
  if(!el) return;
  if(!shouldShowFloatingSticky()){
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  el.classList.add('show');
  if(!floatingStickyExpanded){
    const s = state.sticky;
    const pct = stickyProgressPct();
    const remaining = s.todos.filter(t=>!t.done).length;
    el.innerHTML = `<button class="sticky-pill" id="stickyPillBtn" title="Open your sticky note">
      <span class="nav-icon" style="width:15px;height:15px;">${ICONS.pin}</span>
      <span class="sticky-pill-pct" id="stickyPillPct">${pct}%</span>
      ${remaining>0 ? `<span class="sticky-pill-todo">${remaining} to-do${remaining>1?'s':''}</span>` : ''}
    </button>`;
    document.getElementById('stickyPillBtn').addEventListener('click', ()=>{ floatingStickyExpanded = true; renderFloatingSticky(); });
  } else {
    el.innerHTML = `<div class="sticky-note sticky-float">
      <button class="sticky-float-close" id="stickyFloatClose" title="Minimize">–</button>
      ${stickyNoteInnerHtml('Float')}
    </div>`;
    document.getElementById('stickyFloatClose').addEventListener('click', ()=>{ floatingStickyExpanded = false; renderFloatingSticky(); });
    wireStickyNote('Float');
  }
}
function updateFloatingPillLive(){
  const pctEl = document.getElementById('stickyPillPct');
  if(!pctEl) return;
  pctEl.textContent = stickyProgressPct() + '%';
}
function updateStickyProgressLive(){
  updateStickyDom('');
  const shouldShow = shouldShowFloatingSticky();
  if(shouldShow !== floatingStickyWasVisible){
    floatingStickyWasVisible = shouldShow;
    renderFloatingSticky();
  } else if(shouldShow){
    if(floatingStickyExpanded) updateStickyDom('Float');
    else updateFloatingPillLive();
  }
}

/* ============ PAGE CHROME (tab title, favicon badge, background notification) ============ */
/* Keeps a timer visible even when you're not looking at it — switch tabs, minimize the
   window, or navigate to a different page in the app, and you can still tell a timer is
   running from the tab title and a colored dot on the favicon. If a timer is running when
   the tab actually loses focus, one background notification confirms it, refreshed every
   minute rather than spammed every second. */
let faviconBadgeState = 'unset'; // sentinel so the branded favicon draws even before any badge state is set
function ensureFaviconLink(){
  let link = document.getElementById('appFavicon');
  if(!link){ link = document.createElement('link'); link.id = 'appFavicon'; link.rel = 'icon'; document.head.appendChild(link); }
  return link;
}
function drawFavicon(badge){
  const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1F6F5C';
  ctx.beginPath(); ctx.arc(32,32,30,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '700 34px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('S', 32, 35);
  if(badge){
    const colors = { work:'#4BCBA8', break:'#F0B35C', stopwatch:'#7C8CF0' };
    ctx.beginPath(); ctx.arc(50,15,13,0,Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(50,15,10,0,Math.PI*2); ctx.fillStyle = colors[badge] || colors.work; ctx.fill();
  }
  return canvas.toDataURL('image/png');
}
function setFaviconBadge(badge){
  if(badge === faviconBadgeState) return; // only redraw on an actual state change
  faviconBadgeState = badge;
  ensureFaviconLink().href = drawFavicon(badge);
}
function activeTimerStatus(){
  if(pomo.running){
    const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
    const sec = (pomo.remaining%60).toString().padStart(2,'0');
    const label = pomo.mode==='work' ? 'Focus' : pomo.mode==='longBreak' ? 'Long Break' : 'Break';
    return { badge: pomo.mode==='work'?'work':'break', title:`${m}:${sec} · ${label} — Studium`, body:`${label} — ${m}:${sec} remaining` };
  }
  if(sw.running){
    const totalSec = Math.floor(sw.elapsed/1000);
    const h = Math.floor(totalSec/3600).toString().padStart(2,'0');
    const m = Math.floor((totalSec%3600)/60).toString().padStart(2,'0');
    const s = (totalSec%60).toString().padStart(2,'0');
    return { badge:'stopwatch', title:`${h}:${m}:${s} · Stopwatch — Studium`, body:`Stopwatch running — ${h}:${m}:${s} elapsed` };
  }
  return null;
}
let lastBgNotifyMinute = null;
function updatePageChrome(){
  const status = activeTimerStatus();
  document.title = status ? status.title : 'Studium — Study Tracker';
  setFaviconBadge(status ? status.badge : null);
  if(status && document.hidden && state.settings.notifications && 'Notification' in window && Notification.permission==='granted'){
    const curMin = Math.floor(Date.now()/60000);
    if(lastBgNotifyMinute !== curMin){
      lastBgNotifyMinute = curMin;
      try{ new Notification(status.title.replace(' — Studium',''), { body: status.body, tag:'studium-timer-status', silent:true }); }catch(e){}
    }
  } else if(!status){
    lastBgNotifyMinute = null;
  }
  if(pipActive){
    if(!status){ document.exitPictureInPicture && document.exitPictureInPicture().catch(()=>{}); }
    else drawPipFrame();
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    lastBgNotifyMinute = null;
    updatePageChrome();
  } else {
    // Coming back into view — resync from real elapsed time immediately rather than
    // waiting for the next (possibly throttled) tick, so nothing looks frozen or stale.
    syncPomoRemaining();
    if(sw.running) sw.elapsed = Date.now() - sw.startedAt;
    updatePomoUI();
    updateSwUI();
  }
});

/* ============ LIVE TIMER PERSISTENCE ============ */
/* Session minutes only get logged to state.sessions when a Pomodoro sprint completes or
   the stopwatch is stopped — so a running timer's progress was invisible to localStorage
   the whole time it was ticking. If the tab reloaded, crashed, or was closed mid-session,
   that time was gone. This snapshots the running timer every tick (and on every explicit
   action) to a separate key, and replays real elapsed wall-clock time back in on load. */
const LIVE_TIMER_KEY = 'studiumLiveTimerState';
const LEGACY_LIVE_TIMER_KEYS = ['ledgerLiveTimerState'];
function saveLiveTimerState(){
  try{
    localStorage.setItem(LIVE_TIMER_KEY, JSON.stringify({
      pomo: { mode:pomo.mode, remaining:pomo.remaining, running:pomo.running, subjectId:pomo.subjectId, sessionsDone:pomo.sessionsDone },
      sw: { elapsed:sw.elapsed, running:sw.running, subjectId:sw.subjectId },
      savedAt: Date.now()
    }));
  }catch(e){}
}
function clearLiveTimerState(){ try{ localStorage.removeItem(LIVE_TIMER_KEY); }catch(e){} }
function restoreLiveTimerState(){
  let data;
  try{
    let raw = localStorage.getItem(LIVE_TIMER_KEY);
    if(!raw){
      for(const legacyKey of LEGACY_LIVE_TIMER_KEYS){
        const legacyRaw = localStorage.getItem(legacyKey);
        if(legacyRaw){ raw = legacyRaw; break; }
      }
    }
    if(!raw) return;
    data = JSON.parse(raw);
  }catch(e){ return; }
  const now = Date.now();
  if(data.pomo){
    pomo.mode = data.pomo.mode || 'work';
    pomo.subjectId = data.pomo.subjectId || '';
    pomo.sessionsDone = data.pomo.sessionsDone || 0;
    if(data.pomo.running){
      const elapsedSec = Math.floor((now - data.savedAt)/1000);
      const GRACE_SEC = 120; // generous allowance for a normal refresh/restart gap
      if(elapsedSec > data.pomo.remaining + GRACE_SEC){
        // The gap is far bigger than the timer itself could explain — the browser was
        // actually closed for a while, not just refreshed. Don't fabricate a finished
        // session for time you weren't there for; bank only what was genuinely studied
        // before it closed, then reset to a fresh, paused state.
        if(pomo.mode==='work'){
          const studiedMin = (pomoDuration('work') - data.pomo.remaining) / 60;
          if(studiedMin >= 1) logSession(pomo.subjectId, studiedMin, 'pomodoro-partial');
        }
        pomo.remaining = pomoDuration(pomo.mode);
        pomo.running = false;
      } else {
        pomo.remaining = data.pomo.remaining - elapsedSec;
        if(pomo.remaining <= 0){
          // Finished naturally while briefly away — settle it as a completed sprint.
          pomo.remaining = 0; pomo.running = false;
          completePomoCycle(false);
        } else {
          pomo.running = true;
          startPomoInterval();
        }
      }
    } else {
      pomo.remaining = data.pomo.remaining;
      pomo.running = false;
    }
  }
  if(data.sw){
    sw.subjectId = data.sw.subjectId || '';
    if(data.sw.running){
      sw.elapsed = data.sw.elapsed + (now - data.savedAt);
      sw.running = true;
      sw.startedAt = now - sw.elapsed;
      startSwInterval();
    } else {
      sw.elapsed = data.sw.elapsed;
      sw.running = false;
    }
  }
  updatePomoUI();
  updateSwUI();
}

/* ============ FLOATING TIMER (Picture-in-Picture) ============ */
/* This is the piece that actually survives minimizing the whole browser window — the tab
   title and favicon badge only help while some part of the browser is visible on screen.
   PiP renders the countdown onto a canvas, streams that canvas into a hidden video, and
   asks the browser to float that video above every other window, including a minimized one. */
let pipCanvas = null, pipCtx = null, pipVideo = null, pipActive = false;
function pipSupported(){ return typeof document.pictureInPictureEnabled === 'boolean' && document.pictureInPictureEnabled; }
function ensurePipAssets(){
  if(pipCanvas) return;
  pipCanvas = document.createElement('canvas');
  pipCanvas.width = 170; pipCanvas.height = 60;
  pipCtx = pipCanvas.getContext('2d');
  pipVideo = document.createElement('video');
  pipVideo.muted = true; pipVideo.playsInline = true;
  pipVideo.setAttribute('playsinline', ''); pipVideo.setAttribute('muted', '');
  pipVideo.width = 170; pipVideo.height = 60;
  // Kept off-screen but NOT display:none — a display:none video won't reliably decode
  // frames or accept requestPictureInPicture() in most browsers.
  pipVideo.style.position = 'fixed';
  pipVideo.style.left = '-9999px';
  pipVideo.style.top = '0';
  pipVideo.style.width = '170px';
  pipVideo.style.height = '60px';
  pipVideo.style.opacity = '0';
  pipVideo.style.pointerEvents = 'none';
  pipVideo.srcObject = pipCanvas.captureStream(2); // 2fps is plenty for a digit clock
  document.body.appendChild(pipVideo);
  pipVideo.addEventListener('leavepictureinpicture', ()=>{ pipActive = false; updatePipButtons(); });
}
function pipDrawData(){
  if(pomo.running){
    const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
    const s = (pomo.remaining%60).toString().padStart(2,'0');
    const label = pomo.mode==='work' ? 'Focus Sprint' : pomo.mode==='longBreak' ? 'Long Break' : 'Short Break';
    return { big:`${m}:${s}`, label, color: pomo.mode==='work' ? '#4BCBA8' : '#F0B35C' };
  }
  if(sw.running){
    const totalSec = Math.floor(sw.elapsed/1000);
    const h = Math.floor(totalSec/3600).toString().padStart(2,'0');
    const m = Math.floor((totalSec%3600)/60).toString().padStart(2,'0');
    const s = (totalSec%60).toString().padStart(2,'0');
    return { big: h!=='00' ? `${h}:${m}:${s}` : `${m}:${s}`, label:'Stopwatch', color:'#7C8CF0' };
  }
  return null;
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawPipFrame(){
  if(!pipCtx) return;
  const d = pipDrawData();
  const w = pipCanvas.width, h = pipCanvas.height;
  pipCtx.clearRect(0,0,w,h);
  roundRectPath(pipCtx, 2, 2, w-4, h-4, (h-4)/2);
  pipCtx.fillStyle = '#12160F';
  pipCtx.fill();
  pipCtx.beginPath();
  pipCtx.arc(22, h/2, 7, 0, Math.PI*2);
  pipCtx.fillStyle = (d && d.color) || '#4BCBA8';
  pipCtx.fill();
  pipCtx.fillStyle = '#fff';
  pipCtx.font = '700 24px "IBM Plex Mono", monospace';
  pipCtx.textAlign = 'left'; pipCtx.textBaseline = 'middle';
  pipCtx.fillText(d ? d.big : '—:—', 38, h/2 + 1);
}
async function togglePip(){
  if(!pipSupported()){
    toast('Picture-in-Picture isn\'t supported in this browser.');
    return;
  }
  if(document.pictureInPictureElement){
    try{ await document.exitPictureInPicture(); }catch(e){}
    return;
  }
  ensurePipAssets();
  drawPipFrame();
  try{
    await pipVideo.play();
    await pipVideo.requestPictureInPicture();
    pipActive = true;
    updatePipButtons();
  }catch(e){
    toast('Floating timer blocked: ' + (e.name || 'error') + (e.message ? ' — ' + e.message : ''));
  }
}
function updatePipButtons(){
  ['pomoPipBtn','swPipBtn'].forEach(id=>{
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.innerHTML = pipActive
      ? `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Close Floating Timer`
      : `<span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Pop-out Timer`;
  });
}

/* ============ POMODORO ============ */
let pomo = {
  mode:'work', // work | break | longBreak
  remaining: state.settings.workMin*60,
  running:false, timerId:null, subjectId:'', sessionsDone:0, targetEndAt:null
};
function pomoDuration(mode){
  if(mode==='work') return state.settings.workMin*60;
  if(mode==='break') return state.settings.breakMin*60;
  return state.settings.longBreakMin*60;
}
function renderPomodoro(main){
  main.innerHTML = `
    <div class="page-header"><div><h1>Pomodoro Timer</h1><p>Work in focused sprints, then rest.</p></div></div>
    <div class="grid grid-2">
      <div class="card timer-wrap">
        <div class="field" style="width:220px;">
          <label>Subject</label>
          <select id="pomoSubject">${subjectOptions(pomo.subjectId)}</select>
        </div>
        <div class="dial">
          <svg viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="88" fill="none" stroke="var(--bg-alt)" stroke-width="10"/>
            <circle id="pomoRing" cx="100" cy="100" r="88" fill="none" stroke="${pomo.mode==='work'?'var(--accent)':'var(--accent-2)'}" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" stroke-dashoffset="0"/>
          </svg>
          <div class="dial-center">
            <div class="dial-time mono" id="pomoTime">00:00</div>
            <div class="dial-mode" id="pomoMode">Focus</div>
          </div>
        </div>
        <div class="timer-controls">
          <button class="btn btn-primary" id="pomoStart">Start</button>
          <button class="btn" id="pomoReset">Reset</button>
          <button class="btn" id="pomoSkip">Skip</button>
        </div>
        ${pipSupported() ? `<button class="btn btn-sm" id="pomoPipBtn" style="margin-top:10px;"><span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Pop-out Timer</button>` : ''}
        <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">Completed sprints today: <span class="mono" id="pomoDoneCount">${state.sessions.filter(s=>s.date===todayStr() && s.type==='pomodoro').length}</span></p>
      </div>
      <div class="card">
        <h3 style="font-size:16px; margin-bottom:14px;">Session Lengths</h3>
        <div class="field"><label>Focus (minutes)</label><input type="number" id="wLen" min="1" value="${state.settings.workMin}"></div>
        <div class="field"><label>Short Break (minutes)</label><input type="number" id="bLen" min="1" value="${state.settings.breakMin}"></div>
        <div class="field"><label>Long Break (minutes)</label><input type="number" id="lbLen" min="1" value="${state.settings.longBreakMin}"></div>
        <div class="field"><label>Sprints before long break</label><input type="number" id="sbl" min="1" value="${state.settings.sessionsBeforeLong}"></div>
        <button class="btn" id="saveLens">Save Lengths</button>
        <p style="font-size:12px; color:var(--text-muted); margin-top:14px;">Turn on notifications in Settings to get alerted when a sprint or break ends, even if this tab isn't focused.</p>
      </div>
    </div>
    <div class="grid grid-2">
      <div id="stickyNoteWrap">${stickyNoteHtml()}</div>
      ${musicPanelHtml()}
    </div>`;
  wireMusicPanel();
  wireStickyNote();
  document.getElementById('pomoSubject').addEventListener('change', e=>{ pomo.subjectId = e.target.value; saveLiveTimerState(); });
  document.getElementById('pomoStart').addEventListener('click', togglePomo);
  document.getElementById('pomoReset').addEventListener('click', ()=>{
    // Credit whatever was genuinely studied before resetting — don't throw away real
    // progress just because the sprint wasn't finished.
    if(pomo.mode==='work'){
      const studiedMin = (pomoDuration('work') - pomo.remaining) / 60;
      if(studiedMin >= 1){
        logSession(pomo.subjectId, studiedMin, 'pomodoro-partial');
        toast('Logged ' + fmtMin(studiedMin) + ' before resetting');
      }
    }
    stopPomoInterval(); pomo.mode='work'; pomo.remaining=pomoDuration('work'); pomo.running=false; pomo.targetEndAt=null; stopMusic(); updatePomoUI();
  });
  document.getElementById('pomoSkip').addEventListener('click', ()=>completePomoCycle(true));
  const pomoPipBtn = document.getElementById('pomoPipBtn');
  if(pomoPipBtn) pomoPipBtn.addEventListener('click', togglePip);
  document.getElementById('saveLens').addEventListener('click', ()=>{
    state.settings.workMin = Math.max(1, parseInt(document.getElementById('wLen').value)||25);
    state.settings.breakMin = Math.max(1, parseInt(document.getElementById('bLen').value)||5);
    state.settings.longBreakMin = Math.max(1, parseInt(document.getElementById('lbLen').value)||15);
    state.settings.sessionsBeforeLong = Math.max(1, parseInt(document.getElementById('sbl').value)||4);
    save();
    if(!pomo.running){ pomo.remaining = pomoDuration(pomo.mode); }
    updatePomoUI();
    toast('Session lengths saved');
  });
  if(pomo.remaining === undefined) pomo.remaining = pomoDuration('work');
  updatePomoUI();
  updatePipButtons();
}
function syncPomoRemaining(){
  if(pomo.running && pomo.targetEndAt){
    pomo.remaining = Math.max(0, Math.round((pomo.targetEndAt - Date.now())/1000));
  }
}
function startPomoInterval(){
  stopPomoInterval();
  pomo.targetEndAt = Date.now() + pomo.remaining*1000;
  pomo.timerId = setInterval(()=>{
    syncPomoRemaining();
    if(pomo.remaining <= 0){ completePomoCycle(false); return; }
    updatePomoUI();
  },1000);
}
function togglePomo(){
  pomo.running = !pomo.running;
  if(pomo.running){
    sfxStart();
    playMusicIfEnabled();
    startPomoInterval();
  } else {
    syncPomoRemaining(); // lock in the true value at the exact instant of pausing
    stopPomoInterval();
    pauseMusic();
  }
  updatePomoUI();
}
function stopPomoInterval(){ clearInterval(pomo.timerId); pomo.timerId=null; }
function completePomoCycle(skipped){
  stopPomoInterval();
  const wasWork = pomo.mode==='work';
  if(wasWork && !skipped){
    logSession(pomo.subjectId, state.settings.workMin, 'pomodoro');
    pomo.sessionsDone++;
    sfxWorkComplete();
    notifyUser('Focus sprint complete', 'Nice work — time for a break.');
  } else if(wasWork && skipped){
    pomo.sessionsDone++;
  }
  if(wasWork){
    pomo.mode = (pomo.sessionsDone % state.settings.sessionsBeforeLong === 0) ? 'longBreak' : 'break';
    if(!skipped) setTimeout(sfxBreakStart, 500);
  } else {
    pomo.mode = 'work';
    if(!skipped){ sfxBreakEnd(); notifyUser('Break over', 'Ready for another focus sprint?'); }
  }
  pomo.remaining = pomoDuration(pomo.mode);
  pomo.running = false;
  pomo.targetEndAt = null;
  pauseMusic();
  updatePomoUI();
  if(currentPage==='pomodoro'){
    document.getElementById('pomoDoneCount').textContent = state.sessions.filter(s=>s.date===todayStr() && s.type==='pomodoro').length;
  }
}
function updatePomoUI(){
  updateStickyProgressLive();
  updatePageChrome();
  saveLiveTimerState();
  if(currentPage!=='pomodoro') return;
  const t = document.getElementById('pomoTime'); if(!t) return;
  const m = Math.floor(pomo.remaining/60).toString().padStart(2,'0');
  const s = (pomo.remaining%60).toString().padStart(2,'0');
  t.textContent = `${m}:${s}`;
  document.getElementById('pomoMode').textContent = pomo.mode==='work' ? 'Focus' : pomo.mode==='break' ? 'Short Break' : 'Long Break';
  document.getElementById('pomoStart').textContent = pomo.running ? 'Pause' : 'Start';
  const ring = document.getElementById('pomoRing');
  const total = pomoDuration(pomo.mode);
  const circumference = 553;
  const frac = 1 - (pomo.remaining/total);
  ring.setAttribute('stroke-dashoffset', (circumference*(1-frac)).toFixed(1));
  ring.setAttribute('stroke', pomo.mode==='work' ? 'var(--accent)' : 'var(--accent-2)');
}

/* ============ STOPWATCH ============ */
let sw = { running:false, startedAt:0, elapsed:0, timerId:null, subjectId:'' };
function renderStopwatch(main){
  main.innerHTML = `
    <div class="page-header"><div><h1>Stopwatch</h1><p>For open-ended study sessions.</p></div></div>
    <div class="card timer-wrap" style="max-width:420px;">
      <div class="field" style="width:220px;">
        <label>Subject</label>
        <select id="swSubject">${subjectOptions(sw.subjectId)}</select>
      </div>
      <div class="dial-time mono sw-time-display" id="swTime">00:00:00</div>
      <div class="timer-controls">
        <button class="btn btn-primary" id="swStart">Start</button>
        <button class="btn" id="swStop">Log &amp; Reset</button>
      </div>
      ${pipSupported() ? `<button class="btn btn-sm" id="swPipBtn" style="margin-top:10px;"><span class="nav-icon" style="width:14px;height:14px;">${ICONS.pip}</span>Pop-out Timer</button>` : ''}
    </div>
    <div class="grid grid-2">
      <div id="stickyNoteWrap">${stickyNoteHtml()}</div>
      ${musicPanelHtml()}
    </div>`;
  wireMusicPanel();
  wireStickyNote();
  document.getElementById('swSubject').addEventListener('change', e=>{ sw.subjectId = e.target.value; saveLiveTimerState(); });
  document.getElementById('swStart').addEventListener('click', toggleSw);
  document.getElementById('swStop').addEventListener('click', ()=>{
    const mins = sw.elapsed/60000;
    if(mins > 0.05) { logSession(sw.subjectId, mins, 'stopwatch'); sfxStopwatchStop(); toast('Session logged: '+fmtMin(mins)); }
    clearInterval(sw.timerId); sw.timerId=null; sw.running=false; sw.elapsed=0;
    stopMusic();
    updateSwUI();
  });
  const swPipBtn = document.getElementById('swPipBtn');
  if(swPipBtn) swPipBtn.addEventListener('click', togglePip);
  updateSwUI();
  updatePipButtons();
}
function startSwInterval(){
  clearInterval(sw.timerId);
  sw.timerId = setInterval(()=>{ sw.elapsed = Date.now()-sw.startedAt; updateSwUI(); },500);
}
function toggleSw(){
  if(!sw.running){
    sw.running = true; sw.startedAt = Date.now() - sw.elapsed;
    sfxStart();
    playMusicIfEnabled();
    startSwInterval();
  } else {
    sw.running = false; clearInterval(sw.timerId); sw.timerId=null;
    pauseMusic();
  }
  updateSwUI();
}
function updateSwUI(){
  updateStickyProgressLive();
  updatePageChrome();
  saveLiveTimerState();
  if(currentPage!=='stopwatch') return;
  const el = document.getElementById('swTime'); if(!el) return;
  const totalSec = Math.floor(sw.elapsed/1000);
  const h = Math.floor(totalSec/3600).toString().padStart(2,'0');
  const m = Math.floor((totalSec%3600)/60).toString().padStart(2,'0');
  const s = (totalSec%60).toString().padStart(2,'0');
  el.textContent = `${h}:${m}:${s}`;
  document.getElementById('swStart').textContent = sw.running ? 'Pause' : 'Start';
}

/* ============ SUBJECTS ============ */
/* Shared chapter management panel — used by both the Subject Tracker card (collapsible)
   and the always-open Chapter Progress card, so add/check/delete/link behave identically
   in either place. */
function chapterManagePanelHtml(subject){
  const rows = subject.chapters.length ? subject.chapters.map(c=>{
    const nameEl = c.link
      ? `<a href="${escapeHtml(c.link)}" target="_blank" rel="noopener" class="${c.done?'done':''}" title="Open link">${escapeHtml(c.name)}</a>`
      : `<span class="${c.done?'done':''}">${escapeHtml(c.name)}</span>`;
    return `<div class="chapter-row">
      <input type="checkbox" data-ch="${c.id}" ${c.done?'checked':''}>
      ${nameEl}
      <button class="icon-btn" data-link-ch="${c.id}" title="${c.link?'Edit link':'Add link'}" style="color:${c.link?'var(--accent)':'inherit'};">${ICONS.link}</button>
      <button class="icon-btn" data-del-ch="${c.id}" title="Remove chapter">${ICONS.trash}</button>
    </div>`;
  }).join('') : '<p style="font-size:12px; color:var(--text-muted); padding:6px 0;">No chapters yet.</p>';
  return `<div id="chapterPanel-${subject.id}">
    ${rows}
    <div class="row" style="margin-top:10px;">
      <input type="text" placeholder="New chapter name" data-new-ch-input style="flex:1;">
      <button class="btn btn-sm" data-add-ch>Add</button>
    </div>
  </div>`;
}
function wireChapterPanel(subject, panelEl){
  panelEl.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const ch = subject.chapters.find(c=>c.id===cb.dataset.ch);
      if(ch){ ch.done = cb.checked; save(); checkAchievements(); }
      renderMain();
    });
  });
  panelEl.querySelectorAll('[data-del-ch]').forEach(b=>{
    b.addEventListener('click', ()=>{
      subject.chapters = subject.chapters.filter(c=>c.id!==b.dataset.delCh);
      save(); renderMain();
    });
  });
  panelEl.querySelectorAll('[data-link-ch]').forEach(b=>{
    b.addEventListener('click', ()=> openChapterLinkModal(subject.id, b.dataset.linkCh));
  });
  const addBtn = panelEl.querySelector('[data-add-ch]');
  if(addBtn){
    const doAdd = ()=>{
      const input = panelEl.querySelector('[data-new-ch-input]');
      const name = input.value.trim();
      if(!name) return;
      subject.chapters.push({id:uid(), name, done:false, link:''});
      save(); renderMain(); checkAchievements();
    };
    addBtn.addEventListener('click', doAdd);
    const input = panelEl.querySelector('[data-new-ch-input]');
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } });
  }
}
function openChapterLinkModal(subId, chId){
  const subj = subjectById(subId);
  const ch = subj && subj.chapters.find(c=>c.id===chId);
  if(!ch) return;
  openModal(`
    <button class="close-x" id="closeM">×</button>
    <h3>Chapter Link</h3>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:14px;">${escapeHtml(ch.name)}</p>
    <div class="field"><label>Video or resource link</label><input type="url" id="chLinkInput" value="${escapeHtml(ch.link||'')}" placeholder="https://youtube.com/watch?v=..."></div>
    <div class="modal-actions">
      ${ch.link ? '<button class="btn btn-danger" id="removeLinkBtn" style="margin-right:auto;">Remove Link</button>' : ''}
      <button class="btn" id="cancelM">Cancel</button>
      <button class="btn btn-primary" id="saveLinkBtn">Save</button>
    </div>
  `);
  document.getElementById('closeM').addEventListener('click', closeModal);
  document.getElementById('cancelM').addEventListener('click', closeModal);
  const removeBtn = document.getElementById('removeLinkBtn');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{ ch.link = ''; save(); closeModal(); renderMain(); });
  document.getElementById('saveLinkBtn').addEventListener('click', ()=>{
    ch.link = document.getElementById('chLinkInput').value.trim();
    save(); closeModal(); renderMain();
  });
}

/* ============ HEATMAP ============ */
/* Calendar-style heatmap — weekday rows fixed (Sun top → Sat bottom) so day-of-week
   patterns are visible at a glance, plus month labels along the top. */
function buildHeatmapGrid(days){
  const today = new Date();
  const start = new Date(today); start.setDate(today.getDate() - (days-1));
  const startDow = start.getDay(); // 0=Sun .. 6=Sat
  const cells = [];
  for(let i=0;i<startDow;i++) cells.push(null); // leading blanks so rows align to weekday
  for(let i=0;i<days;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    cells.push({date:d, ds:todayStr(d), mins:minutesOnDate(todayStr(d))});
  }
  while(cells.length % 7 !== 0) cells.push(null); // trailing blanks to complete last week
  const totalCols = cells.length / 7;
  let max = 1;
  cells.forEach(c=>{ if(c) max = Math.max(max, c.mins); });

  const wrap = document.createElement('div');
  wrap.className = 'heatmap-wrap';

  const monthsRow = document.createElement('div');
  monthsRow.className = 'heatmap-months';
  monthsRow.style.gridTemplateColumns = `repeat(${totalCols}, 12px)`;
  let lastMonth = -1;
  for(let col=0; col<totalCols; col++){
    let label = '';
    for(let row=0; row<7; row++){
      const c = cells[col*7+row];
      if(c && c.date.getDate() <= 7 && c.date.getMonth() !== lastMonth){
        label = c.date.toLocaleString('en-US', {month:'short'});
        lastMonth = c.date.getMonth();
        break;
      }
    }
    const span = document.createElement('span');
    span.textContent = label;
    monthsRow.appendChild(span);
  }

  const dayLabels = document.createElement('div');
  dayLabels.className = 'heatmap-daylabels';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n=>{ const s = document.createElement('span'); s.textContent = n; dayLabels.appendChild(s); });

  const grid = document.createElement('div');
  grid.className = 'heatmap';
  cells.forEach(c=>{
    const cell = document.createElement('div');
    if(!c){ cell.className = 'heat-cell heat-cell-empty'; grid.appendChild(cell); return; }
    cell.className = 'heat-cell';
    const dayName = c.date.toLocaleString('en-US', {weekday:'short'});
    const dateLabel = c.date.toLocaleString('en-US', {month:'short', day:'numeric'});
    cell.title = `${dayName}, ${dateLabel}: ${fmtMin(c.mins)}`;
    let level = 0;
    if(c.mins>0) level = 1;
    if(c.mins >= max*0.33) level = 2;
    if(c.mins >= max*0.66) level = 3;
    if(c.mins >= max*0.9) level = 4;
    const opacities = [0, 0.28, 0.52, 0.75, 1];
    cell.style.background = level===0 ? 'var(--bg-alt)' : `color-mix(in srgb, var(--accent) ${opacities[level]*100}%, var(--bg-alt))`;
    grid.appendChild(cell);
  });

  const body = document.createElement('div');
  body.className = 'heatmap-body';
  body.appendChild(dayLabels);
  body.appendChild(grid);

  wrap.appendChild(monthsRow);
  wrap.appendChild(body);
  return wrap;
}

  main.innerHTML = `<div class="page-header"><div><h1>Heatmap</h1><p>Your study consistency over the last 26 weeks.</p></div></div>
  <div class="card">
